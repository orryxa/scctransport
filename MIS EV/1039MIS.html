<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>1039 MIS | Trip Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fbbf24;
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            transition: all var(--transition-normal);
        }

        .app-container { max-width: 1400px; margin: 0 auto; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .page { display: none; animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .page.active-page { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .soft-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-xl); }

        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }
        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        .search-section { padding: 1.5rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        
        .btn {
            border: none; padding: 10px 24px; border-radius: 60px; font-weight: 600; font-size: 0.875rem;
            cursor: pointer; transition: all var(--transition-fast); display: inline-flex; align-items: center; gap: 8px;
            position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            border-radius: 50%; background: rgba(255, 255, 255, 0.3); transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::before { width: 300px; height: 300px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: var(--shadow-sm); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); filter: brightness(1.05); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); color: white; }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: #1e293b; }
        .btn-sm { padding: 6px 16px; font-size: 0.75rem; }
        .btn-xs { padding: 4px 12px; font-size: 0.7rem; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ======================== BUTTON VISIBILITY ======================== */
        .desktop-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mobile-buttons {
            display: none;
        }

        /* ======================== RESPONSIVE DESIGN ======================== */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .card-header { padding: 1rem 1.2rem; }
            .card-header h2 { font-size: 1.3rem; }
            .search-section { padding: 1rem 1.2rem; }
            
            /* ✅ Hide desktop buttons on mobile */
            .desktop-buttons {
                display: none !important;
            }

            /* ✅ Show mobile buttons on mobile with 3fr grid */
            .mobile-buttons {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin-top: 16px;
                width: 100%;
            }

            .mobile-buttons .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 0.85rem;
            }

            .data-table th, .data-table td { padding: 12px 10px; font-size: 0.75rem; }
            .btn { padding: 8px 18px; font-size: 0.8rem; }
            .modal-box { width: 95%; border-radius: 1.5rem; }
            .form-grid { grid-template-columns: 1fr; gap: 1rem; }
            .section-title { flex-direction: column; align-items: flex-start; }
            .section-actions { align-self: flex-end; }
        }

        /* Show desktop buttons on larger screens */
        @media (min-width: 769px) {
            .desktop-buttons {
                display: flex !important;
            }
            
            .mobile-buttons {
                display: none !important;
            }
        }

        .search-wrapper input {
            width: 100%; padding: 14px 20px; border: 2px solid var(--border-color); border-radius: 60px;
            background: var(--bg-secondary); color: var(--text-primary); font-size: 0.95rem;
            transition: all var(--transition-fast);
        }
        .search-wrapper input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); transform: translateY(-1px); }

        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem; }
        .data-table th { text-align: left; padding: 16px; background: var(--table-header-bg); color: var(--primary); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--primary); }
        .data-table td { padding: 16px; border-bottom: 1px solid var(--table-border); color: var(--text-primary); transition: background var(--transition-fast); }
        .data-table tr:hover td { background: var(--table-row-hover); }

        /* Page 2 Grid Layout */
        .details-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 2rem;
        }
        @media (max-width: 768px) {
            .details-grid { padding: 1rem; gap: 1rem; }
        }

        /* Individual Collapse Section Styles */
        .trip-section {
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all var(--transition-fast);
        }
        .section-header {
            padding: 1.2rem 1.5rem;
            background: var(--table-header-bg);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background var(--transition-fast);
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-header:hover { background: var(--table-row-hover); }
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-weight: 600;
            font-size: 1rem;
        }
        .section-actions {
            display: flex;
            gap: 8px;
        }
        .collapse-icon { font-size: 1.2rem; transition: transform 0.3s ease; }
        .collapse-icon.collapsed { transform: rotate(-90deg); }
        .section-content { padding: 1.5rem; border-top: 1px solid var(--border-color); }
        .section-content.hidden { display: none; }
        
        /* Grid for trip details - 2 column on mobile like 3104form.html */
        .details-grid-inner {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 640px) {
            .details-grid-inner {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
        }
        
        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-color);
        }
        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }
        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            word-break: break-word;
            color: var(--text-primary);
        }

        .incomplete-section {
            border-left: 4px solid var(--warning);
        }
        .warning-badge {
            background: var(--warning);
            color: #1e293b;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        /* Modal Styles - Scrollable without visible scrollbar */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center;
            z-index: 2000; visibility: hidden; opacity: 0; transition: all var(--transition-normal);
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: var(--card-bg); width: 92%; max-width: 1000px; max-height: 85vh;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-box::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 10; color: white;
        }
        .modal-header h3 { font-size: 1.3rem; font-weight: 700; }
        .close-modal { background: none; border: none; font-size: 2rem; cursor: pointer; color: white; transition: transform var(--transition-fast); line-height: 1; }
        .close-modal:hover { transform: rotate(90deg); }
        .modal-body { 
            padding: 1.5rem; 
            overflow-y: auto; 
            max-height: calc(85vh - 70px);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-body::-webkit-scrollbar {
            display: none;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }
        .field input, .field select, .field textarea {
            padding: 12px 16px; border-radius: 16px; border: 2px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-primary); font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .fullwidth { grid-column: 1 / -1; }
        .calculated-field {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.05));
            font-weight: 600;
        }
        
        /* Time input styling */
        input[type="time"] {
            font-family: inherit;
            cursor: pointer;
        }
        [data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
            position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg);
            border-radius: 16px; max-height: 200px; overflow-y: auto; z-index: 9999;
            display: none; box-shadow: var(--shadow-lg); margin-top: 6px; border: 1px solid var(--border-color);
        }
        .autocomplete-item { padding: 12px 16px; cursor: pointer; transition: all var(--transition-fast); color: var(--text-primary); }
        .autocomplete-item:hover { background: var(--primary); color: white; }
        
        .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--border-color); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }
		/* ======================== MODAL Z-INDEX FIX ======================== */
/* Ensure global modal appears above all other modals */

/* Ensure holiday modal stays below global modal */

.modal-overlay {
    z-index: 2000;
}

/* Global modal gets highest z-index */
#globalModal.modal-overlay {
    z-index: 9999 !important;
}
    </style>
</head>

    /* ======================== DARK MODE SYNC ======================== */
    function syncThemeWithParent() {
        const localTheme = localStorage.getItem('user-theme-preference');
        if (localTheme) {
            document.body.setAttribute('data-theme', localTheme);
            document.documentElement.setAttribute('data-theme', localTheme);
        } else {
            try {
                if (window.parent && window.parent.document.body) {
                    const parentTheme = window.parent.document.body.getAttribute('data-theme');
                    if (parentTheme) {
                        document.body.setAttribute('data-theme', parentTheme);
                        document.documentElement.setAttribute('data-theme', parentTheme);
                    }
                }
            } catch(e) { }
        }
    }

    function isValidDateYYYYMMDD(dateStr) {
        if (!dateStr) return false;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return false;
        
        const [year, month, day] = dateStr.split('-').map(Number);
        const date = new Date(year, month - 1, day);
        
        return date.getFullYear() === year && 
               date.getMonth() === month - 1 && 
               date.getDate() === day;
    }

    function formatToDDMMYYYY(dateInput) {
        if (!dateInput || dateInput === '') return '—';
        
        try {
            if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
                if (isValidDateYYYYMMDD(dateInput)) {
                    const [year, month, day] = dateInput.split('-');
                    return `${day}/${month}/${year}`;
                }
                return '—';
            }
            
            if (typeof dateInput === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(dateInput)) {
                const [day, month, year] = dateInput.split('/');
                const testDate = new Date(year, month - 1, day);
                if (testDate.getFullYear() == year && 
                    testDate.getMonth() == month - 1 && 
                    testDate.getDate() == day) {
                    return dateInput;
                }
                return '—';
            }
            
            const dateObj = new Date(dateInput);
            if (!isNaN(dateObj.getTime())) {
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${day}/${month}/${year}`;
            }
            
            return '—';
        } catch (error) {
            console.error('Date display formatting error:', error);
            return '—';
        }
    }

    function convertToYYYYMMDD(dateString) {
        if (!dateString || dateString === '') return '';
        
        try {
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                if (isValidDateYYYYMMDD(dateString)) {
                    return dateString;
                }
                return '';
            }
            
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) {
                const [day, month, year] = dateString.split('/');
                const testDate = new Date(year, month - 1, day);
                if (testDate.getFullYear() == year && 
                    testDate.getMonth() == month - 1 && 
                    testDate.getDate() == day) {
                    return `${year}-${month}-${day}`;
                }
                return '';
            }
            
            const dateObj = new Date(dateString);
            if (!isNaN(dateObj.getTime())) {
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            
            return '';
        } catch (error) {
            console.error('Date conversion error:', error);
            return '';
        }
    }

    function formatDisplayDate(dateInput) {
        if (!dateInput) return '—';
        const formatted = formatToDDMMYYYY(dateInput);
        return formatted || '—';
    }
    
    /* ======================== TIME FORMATTING FUNCTIONS ======================== */
    
    function convertToTimeInput(timeStr) {
        if (!timeStr) return '';
        let match = timeStr.match(/(\d+)[.:](\d+)\s*(AM|PM)/i);
        if (match) {
            let hour = parseInt(match[1]);
            let minute = parseInt(match[2]);
            let isPM = match[3].toUpperCase() === 'PM';
            if (isPM && hour !== 12) hour += 12;
            if (!isPM && hour === 12) hour = 0;
            return `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
        }
        if (timeStr.match(/^\d{1,2}:\d{2}$/)) return timeStr;
        return '';
    }
    
    function convertToDisplayTime(timeVal) {
        if (!timeVal) return '';
        let [hour, minute] = timeVal.split(':');
        let h = parseInt(hour);
        let ampm = h >= 12 ? 'PM' : 'AM';
        let displayHour = h % 12 || 12;
        return `${displayHour}.${minute} ${ampm}`;
    }

    function escapeHtml(str) { 
        if (!str) return ''; 
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); 
    }

    async function loadHolidays(forceRefresh = false) {
        try {
            const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`;
            
            // ✅ If force refresh, bypass cache
            if (forceRefresh) {
                localStorage.removeItem(HOLIDAY_CACHE_KEY);
            }
            
            const cached = localStorage.getItem(HOLIDAY_CACHE_KEY);
            let cachedData = null;
            
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TTL) {
                        cachedData = data;
                    }
                } catch (e) { }
            }
            
            let data = cachedData;
            if (!data || forceRefresh) {
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    data = result.data;
                    localStorage.setItem(HOLIDAY_CACHE_KEY, JSON.stringify({
                        data: data,
                        timestamp: Date.now()
                    }));
                }
            }
            
            if (data && Array.isArray(data)) {
                holidayData = data.map((row, idx) => {
                    const hasHolidayDate = row['Holiday Date'] && row['Holiday Date'].toString().trim() !== '';
                    const hasHolidayName = row['Holiday Name'] && row['Holiday Name'].toString().trim() !== '';
                    if (hasHolidayDate && hasHolidayName) {
                        return {
                            ...row,
                            _actualRowIndex: idx + 2,
                            _displayIndex: idx + 1
                        };
                    }
                    return null;
                }).filter(row => row !== null);
            } else {
                holidayData = [];
            }
            
            console.log('✅ Loaded holidays with actual row indices:', holidayData.length);
            return holidayData;
        } catch (err) {
            console.error('Error loading holidays:', err);
            holidayData = [];
            return [];
        }
    }

    function setupHolidayAutocomplete(inputId, listId, optionsArray) {
        const input = document.getElementById(inputId);
        const listEl = document.getElementById(listId);
        if (!input || !listEl) return;
        
        function showOptions(filterVal = '') {
            const term = filterVal.toLowerCase();
            const filtered = optionsArray.filter(opt => opt.toLowerCase().includes(term));
            if (filtered.length > 0) {
                listEl.innerHTML = filtered.map(opt => 
                    `<div class="autocomplete-item" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`
                ).join('');
                listEl.style.display = 'block';
                listEl.style.position = 'absolute';
                listEl.style.top = '100%';
                listEl.style.left = '0';
                listEl.style.right = '0';
                listEl.style.zIndex = '9999';
                listEl.style.maxHeight = '200px';
                listEl.style.overflowY = 'auto';
                listEl.style.background = 'var(--card-bg)';
                listEl.style.borderRadius = '16px';
                listEl.style.boxShadow = 'var(--shadow-lg)';
                listEl.style.marginTop = '6px';
                listEl.style.border = '1px solid var(--border-color)';
                
                listEl.querySelectorAll('.autocomplete-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        input.value = item.getAttribute('data-value');
                        listEl.style.display = 'none';
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                    });
                });
            } else {
                listEl.style.display = 'none';
            }
        }
        
        input.addEventListener('input', (e) => showOptions(e.target.value));
        input.addEventListener('focus', () => showOptions(input.value));
        input.addEventListener('blur', () => setTimeout(() => listEl.style.display = 'none', 200));
        document.addEventListener('click', (e) => {
            if (!listEl.contains(e.target) && e.target !== input) listEl.style.display = 'none';
        });
    }

    async function fetchWithCache(url, cacheKey, ttl) {
        const cached = localStorage.getItem(cacheKey);
        let cachedData = null;
        
        if (cached) {
            try {
                const { data, timestamp } = JSON.parse(cached);
                if (Date.now() - timestamp < ttl) {
                    cachedData = data;
                }
            } catch (e) { }
        }
        
        if (cachedData) {
            fetchFreshDataInBackground(url, cacheKey);
            return cachedData;
        }
        
        try {
            const response = await fetch(url);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                localStorage.setItem(cacheKey, JSON.stringify({
                    data: result.data,
                    timestamp: Date.now()
                }));
                return result.data;
            }
            return [];
        } catch (err) {
            console.error("Fetch error:", err);
            return cachedData || [];
        }
    }

    async function fetchFreshDataInBackground(url, cacheKey) {
        try {
            const response = await fetch(url);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                localStorage.setItem(cacheKey, JSON.stringify({
                    data: result.data,
                    timestamp: Date.now()
                }));
                
                if (cacheKey === CACHE_KEY) {
                    allTrips = result.data;
                    renderTablePage1(document.getElementById('searchInput')?.value || "");
                }
                if (cacheKey === DETAILS_CACHE_KEY) {
                    updateDropdownOptionsFromData(result.data);
                }
                if (cacheKey === HOLIDAY_CACHE_KEY) {
                    holidayData = result.data.map((row, idx) => {
                        const hasHolidayDate = row['Holiday Date'] && row['Holiday Date'].toString().trim() !== '';
                        const hasHolidayName = row['Holiday Name'] && row['Holiday Name'].toString().trim() !== '';
                        if (hasHolidayDate && hasHolidayName) {
                            return {
                                ...row,
                                _actualRowIndex: idx + 2,
                                _displayIndex: idx + 1
                            };
                        }
                        return null;
                    }).filter(row => row !== null);
                    renderHolidayTable();
                }
            }
        } catch (err) {
            console.warn("Background fetch failed:", err);
        }
    }

    async function saveToDetailsSheet(type, value) {
        if (!value || value.trim() === '') return false;
        
        const trimmedValue = value.trim();
        let columnName = '';
        if (type === 'consignee') columnName = 'Name';
        else if (type === 'from') columnName = 'From Location';
        else if (type === 'destination') columnName = 'Destination';
        else return false;
        
        console.log(`📝 Saving ${type} "${trimmedValue}" to column "${columnName}"`);
        
        try {
            const url = `${SCRIPT_URL}?spreadsheetId=${DETAILS_SHEET_ID}&sheetName=${DETAILS_SHEET_NAME}&_=${Date.now()}`;
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.status !== "success" || !Array.isArray(result.data)) {
                console.error('Failed to fetch Details sheet data');
                return false;
            }
            
            const data = result.data;
            console.log(`📊 Fetched ${data.length} rows from Details sheet`);
            
            const columnIndex = data.length > 0 ? Object.keys(data[0]).indexOf(columnName) : -1;
            if (columnIndex === -1) {
                console.error(`Column "${columnName}" not found in Details sheet`);
                return false;
            }
            
            const exists = data.some(row => {
                const cellValue = row[columnName];
                return cellValue && cellValue.toString().trim().toLowerCase() === trimmedValue.toLowerCase();
            });
            
            if (exists) {
                console.log(`✅ Value "${trimmedValue}" already exists in column "${columnName}"`);
                return true;
            }
            
            let targetRowIndex = null;
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                const cellValue = row[columnName];
                if (!cellValue || cellValue.toString().trim() === '') {
                    targetRowIndex = i + 2;
                    console.log(`🔍 Found empty cell in column "${columnName}" at row ${targetRowIndex}`);
                    break;
                }
            }
            
            if (targetRowIndex === null) {
                targetRowIndex = data.length + 2;
                console.log(`📝 No empty row found, creating new row at ${targetRowIndex}`);
                
                const params = new URLSearchParams();
                params.append("action", "insert");
                params.append("spreadsheetId", DETAILS_SHEET_ID);
                params.append("sheetName", DETAILS_SHEET_NAME);
                params.append(columnName, trimmedValue);
                
                const insertResponse = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString()
                });
                
                const insertResult = await insertResponse.json();
                if (insertResult.status === "success") {
                    console.log(`✅ New row created with "${trimmedValue}" in column "${columnName}"`);
                    localStorage.removeItem(DETAILS_CACHE_KEY);
                    await loadDropdownOptions();
                    return true;
                } else {
                    console.error('Failed to create new row:', insertResult);
                    return false;
                }
            }
            
            const updateParams = new URLSearchParams();
            updateParams.append("action", "update");
            updateParams.append("spreadsheetId", DETAILS_SHEET_ID);
            updateParams.append("sheetName", DETAILS_SHEET_NAME);
            updateParams.append("rowIndex", targetRowIndex);
            updateParams.append(columnName, trimmedValue);
            
            console.log(`📤 Updating row ${targetRowIndex}, column "${columnName}" with "${trimmedValue}"`);
            
            const updateResponse = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: updateParams.toString()
            });
            
            const updateResult = await updateResponse.json();
            if (updateResult.status === "success") {
                console.log(`✅ Successfully updated row ${targetRowIndex} with "${trimmedValue}"`);
                localStorage.removeItem(DETAILS_CACHE_KEY);
                await loadDropdownOptions();
                return true;
            } else {
                console.error('Update failed:', updateResult);
                return false;
            }
            
        } catch (err) {
            console.error(`Error saving ${type}:`, err);
            return false;
        }
    }

    /* ======================== RENDER FUNCTIONS ======================== */
    
    function renderTablePage1(filter = "") {
        let tbody = document.getElementById('tableBody');
        let searchLower = filter.toLowerCase();
        let mainTrips = [];
        
        for (let i = 0; i < allTrips.length; i++) {
            if (isMainTrip(allTrips[i])) {
                let totalBoxes = calculateTotalBoxes(i);
                mainTrips.push({ ...allTrips[i], _totalBoxes: totalBoxes });
            }
        }
        
        let filtered = mainTrips.filter(t => 
            (t['Trip No']?.toString().toLowerCase().includes(searchLower)) ||
            (t['LR No']?.toString().toLowerCase().includes(searchLower)) ||
            (t['Consignment No']?.toString().toLowerCase().includes(searchLower))
        );
        
        if (!filtered.length) { 
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">✨ No trips found</td></tr>'; 
            return; 
        }
        
        let fragment = document.createDocumentFragment();
        filtered.forEach(t => {
            let row = document.createElement('tr');
            const displayDate = formatDisplayDate(t['Date']);
            row.innerHTML = `
                <td><strong>${escapeHtml(t['Trip No'] || '')}</strong></td>
                <td>${escapeHtml(displayDate)}</td>
                <td>${escapeHtml(t['LR No'] || '')}</td>
                <td><strong>${escapeHtml(t._totalBoxes || '0')}</strong></td>
                <td><button class="btn btn-sm btn-outline viewBtn" data-rowindex="${t._rowIndex}">👁️ View</button></td>
            `;
            fragment.appendChild(row);
        });
        tbody.innerHTML = ''; 
        tbody.appendChild(fragment);
        
        document.querySelectorAll('.viewBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                let rowIndex = parseInt(btn.getAttribute('data-rowindex'));
                let found = allTrips.find(t => t._rowIndex === rowIndex);
                if (found) {
                    currentTrip = found;
                    currentRowIndex = rowIndex;
                    showPage2Details(found);
                }
            });
        });
    }

    function generateDetailCards(trip) {
        let nonEmptyFields = allFields.filter(field => {
            let val = trip[field];
            return val !== undefined && val !== null && val !== '';
        });
        
        return nonEmptyFields.map(field => {
            let val = trip[field];
            if (field === "Date") val = formatDisplayDate(val);
            return `
                <div class="detail-card">
                    <div class="detail-label">${fieldLabels[field]}</div>
                    <div class="detail-value">${escapeHtml(val)}</div>
                </div>
            `;
        }).join('');
    }

    function generateTripSection(trip, isIncomplete = false, sectionIndex = 0, totalBoxes = null) {
        if (!hasTripData(trip)) {
            return '';
        }
        
        const isCompleteMain = isMainTrip(trip);
        const titleText = isCompleteMain ? `Trip #${escapeHtml(trip['Trip No'] || '—')}` : `Additional Entry ${sectionIndex + 1}`;
        const dateText = trip['Date'] ? ` | Date: ${escapeHtml(formatDisplayDate(trip['Date']))}` : '';
        const lrText = trip['LR No'] ? ` | LR: ${escapeHtml(trip['LR No'])}` : '';
        const boxesText = trip['Boxes'] ? ` | Boxes: ${escapeHtml(trip['Boxes'])}` : '';
        const totalBoxesText = totalBoxes !== null ? ` | Total Boxes: ${totalBoxes}` : '';
        const warningBadge = isIncomplete ? '<span class="warning-badge">⚠️ Incomplete</span>' : '';
        
        return `
            <div class="trip-section ${isIncomplete ? 'incomplete-section' : ''}" data-section-index="${sectionIndex}" data-rowindex="${trip._rowIndex}">
                <div class="section-header" onclick="toggleSection(this)">
                    <div class="section-title">
                        <span class="collapse-icon">▼</span>
                        <strong>${titleText}</strong>${dateText}${lrText}${boxesText}${totalBoxesText}
                        ${warningBadge}
                    </div>
                    <div class="section-actions" onclick="event.stopPropagation()">
                        <button class="btn btn-xs btn-warning edit-section-btn" data-rowindex="${trip._rowIndex}">✏️ Edit</button>
                        <button class="btn btn-xs btn-danger delete-section-btn" data-rowindex="${trip._rowIndex}">🗑 Delete</button>
                    </div>
                </div>
                <div class="section-content">
                    <div class="details-grid-inner">
                        ${generateDetailCards(trip)}
                    </div>
                </div>
            </div>
        `;
    }

    function showPage2Details(selectedTrip) {
        let container = document.getElementById('detailsContainer');
        if (!container) return;
        
        let selectedIndex = allTrips.findIndex(t => t._rowIndex === selectedTrip._rowIndex);
        
        if (selectedIndex === -1) {
            container.innerHTML = '<p>Error: Trip not found</p>';
            return;
        }
        
        let relatedTrips = [];
        for (let i = selectedIndex; i < allTrips.length; i++) {
            let trip = allTrips[i];
            if (i !== selectedIndex && isMainTrip(trip)) {
                break;
            }
            relatedTrips.push(trip);
        }
        
        let mainTrip = relatedTrips[0];
        let additionalTrips = relatedTrips.slice(1);
        let totalBoxes = calculateTotalBoxes(selectedIndex);
        
        let html = '';
        if (hasTripData(mainTrip)) {
            html += generateTripSection(mainTrip, false, 0, totalBoxes);
        }
        
        additionalTrips.forEach((trip, idx) => {
            if (hasTripData(trip)) {
                html += generateTripSection(trip, true, idx + 1, null);
            }
        });
        
        if (!html) {
            html = '<p style="text-align:center; padding: 40px; color: var(--text-secondary);">No trip data available</p>';
        }
        
        container.innerHTML = html;
        
        document.querySelectorAll('.edit-section-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                let rowIndex = parseInt(btn.getAttribute('data-rowindex'));
                let tripToEdit = allTrips.find(t => t._rowIndex === rowIndex);
                if (tripToEdit) openTripModal(true, tripToEdit);
            });
        });
        
        document.querySelectorAll('.delete-section-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                let rowIndex = parseInt(btn.getAttribute('data-rowindex'));
                let tripToDelete = allTrips.find(t => t._rowIndex === rowIndex);
                if (tripToDelete) deleteSingleTrip(tripToDelete);
            });
        });
        
        document.getElementById('page1')?.classList.remove('active-page');
        document.getElementById('page2')?.classList.add('active-page');
    }

    /* ======================== TRIP OPERATIONS ======================== */
    
    async function deleteSingleTrip(tripToDelete) {
        let tripIdentifier = tripToDelete['Trip No'] ? `Trip #${tripToDelete['Trip No']}` : 'this entry';
        showModal(`⚠️ Are you sure you want to delete ${tripIdentifier}?`, "Confirm Delete", true, async () => {
            let params = new URLSearchParams();
            params.append("action", "delete");
            params.append("spreadsheetId", SPREADSHEET_ID);
            params.append("sheetName", SHEET_NAME);
            params.append("rowIndex", tripToDelete._rowIndex);
            try {
                let resp = await fetch(SCRIPT_URL, { 
                    method: "POST", 
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }, 
                    body: params 
                });
                let result = await resp.json();
                if (result.status === "success") {
                    showModal("✅ Entry deleted successfully!", "Success", false, null, 1500);
                    await refreshAllData();
                    if (currentTrip) {
                        let refreshed = allTrips.find(t => t._rowIndex === currentTrip._rowIndex);
                        if (refreshed) showPage2Details(refreshed);
                        else goToPage1();
                    } else goToPage1();
                } else showModal("Delete failed: " + (result.message || "unknown"), "Error");
            } catch(err) { 
                showModal("Error: "+err.message, "Error"); 
            }
        });
    }

    function goToPage1() {
        document.getElementById('page2')?.classList.remove('active-page');
        document.getElementById('page1')?.classList.add('active-page');
        currentTrip = null;
        currentRowIndex = null;
    }

    async function refreshAllData() {
        let btn = document.getElementById('refreshBtnP1');
        if (btn) showSpinner(btn, true);
        try {
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(DETAILS_CACHE_KEY);
            localStorage.removeItem(HOLIDAY_CACHE_KEY);
            await loadDropdownOptions();
            await loadTrips();
            await loadHolidays(true);
            renderTablePage1(document.getElementById('searchInput')?.value || "");
            renderHolidayTable();
        } catch(err) {
            showModal("Refresh failed: "+err.message, "Error");
        } finally {
            if (btn) showSpinner(btn, false);
        }
    }

    /* ======================== AUTOCOMPLETE FUNCTIONS ======================== */
    
    function setupAutocomplete(inputId, listId, optionsArray, type) {
        let input = document.getElementById(inputId);
        let listEl = document.getElementById(listId);
        if (!input || !listEl) return;
        
        let saveTimeout = null;
        
        let wrapper = input.closest('.autocomplete-wrap');
        if (wrapper) {
            wrapper.style.position = 'relative';
        }
        
        function showOptions(filterVal = '') {
            let term = filterVal.toLowerCase();
            let filtered = optionsArray.filter(opt => opt.toLowerCase().includes(term));
            if (filtered.length) {
                listEl.innerHTML = filtered.map(opt => 
                    `<div class="autocomplete-item" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`
                ).join('');
                listEl.style.display = 'block';
                listEl.style.position = 'absolute';
                listEl.style.top = '100%';
                listEl.style.left = '0';
                listEl.style.right = '0';
                listEl.style.zIndex = '9999';
                listEl.style.maxHeight = '200px';
                listEl.style.overflowY = 'auto';
                listEl.style.background = 'var(--card-bg)';
                listEl.style.borderRadius = '16px';
                listEl.style.boxShadow = 'var(--shadow-lg)';
                listEl.style.marginTop = '6px';
                listEl.style.border = '1px solid var(--border-color)';
                
                listEl.querySelectorAll('.autocomplete-item').forEach(item => {
                    item.addEventListener('click', () => {
                        input.value = item.getAttribute('data-value');
                        listEl.style.display = 'none';
                        input.dispatchEvent(new Event('input'));
                    });
                });
            } else { 
                listEl.style.display = 'none'; 
            }
        }
        
        input.addEventListener('input', (e) => {
            showOptions(e.target.value);
            
            if (saveTimeout) clearTimeout(saveTimeout);
            
            let newValue = e.target.value.trim();
            if (newValue && !optionsArray.includes(newValue)) {
                saveTimeout = setTimeout(async () => {
                    let saved = await saveToDetailsSheet(type, newValue);
                    if (saved) {
                        await loadDropdownOptions();
                        if (type === 'consignee') consigneeOptions.push(newValue);
                        else if (type === 'from') fromOptions.push(newValue);
                        else if (type === 'destination') destinationOptions.push(newValue);
                        console.log(`New ${type} "${newValue}" saved to Details sheet`);
                    }
                }, 1000);
            }
        });
        
        input.addEventListener('focus', () => showOptions(input.value));
        input.addEventListener('blur', () => setTimeout(() => listEl.style.display = 'none', 200));
        document.addEventListener('click', (e) => { 
            if(!listEl.contains(e.target) && e.target !== input) listEl.style.display = 'none'; 
        });
    }

                            <div class="table-wrapper">
                                <table class="data-table" style="font-size: 0.85rem;">
                                    <thead>
                                        <tr>
                                            <th style="width: 60px;">Sr. No</th>
                                            <th>Date</th>

                                            <th style="width: 120px;">Action</th>

                                    <tbody id="holidayTableBody">

        `;
        document.body.insertAdjacentHTML('beforeend', holidayModalHTML);
        
        document.getElementById('closeHolidayModalBtn')?.addEventListener('click', closeHolidayModal);
        document.getElementById('holidayCancelBtn')?.addEventListener('click', cancelHolidayEdit);
        document.getElementById('holidayForm')?.addEventListener('submit', handleHolidaySubmit);

            const modal = document.getElementById('holidayModal');

    async function fastInit() {
    addHolidayModalHTML();
    
    const desktopButtons = document.querySelector('.card-header .desktop-buttons');
    const mobileButtons = document.querySelector('.mobile-buttons');
    
    // ===== DESKTOP BUTTONS (Visible only on desktop > 768px) =====
    
    // 1. Add Holiday Button to Desktop
    const holidayBtn = document.createElement('button');
    holidayBtn.className = 'btn btn-primary';
    holidayBtn.innerHTML = '📅 Holiday';
    holidayBtn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
    holidayBtn.addEventListener('click', openHolidayModal);
    desktopButtons?.appendChild(holidayBtn);
    
    // 2. Add "Add Trip" button to desktop
    let addBtn = document.createElement('button'); 
    addBtn.className = 'btn btn-primary'; 
    addBtn.innerHTML = '<span>➕</span> Add Trip'; 
    addBtn.style.marginLeft = 'auto';
    addBtn.addEventListener('click', () => openTripModal(false));
    desktopButtons?.appendChild(addBtn);
    
    // ===== MOBILE BUTTONS (Visible only on mobile ≤ 768px) =====
    
    // 1. Add Holiday Button to Mobile
    const mobileHolidayBtn = document.createElement('button');
    mobileHolidayBtn.className = 'btn btn-primary';
    mobileHolidayBtn.innerHTML = '📅 Holiday';
    mobileHolidayBtn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
    mobileHolidayBtn.style.width = '100%';
    mobileHolidayBtn.style.justifyContent = 'center';
    mobileHolidayBtn.style.padding = '12px 16px';
    mobileHolidayBtn.style.fontSize = '0.85rem';
    mobileHolidayBtn.addEventListener('click', openHolidayModal);
    mobileButtons?.appendChild(mobileHolidayBtn);
    
    // 2. Style existing mobile refresh button
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    if (mobileRefreshBtn) {
        mobileRefreshBtn.style.width = '100%';
        mobileRefreshBtn.style.justifyContent = 'center';
        mobileRefreshBtn.style.padding = '12px 16px';
        mobileRefreshBtn.style.fontSize = '0.85rem';
    }
    
    // 3. Style existing mobile add button or create it
    let mobileAddBtn = document.getElementById('mobileAddBtn');
    if (mobileAddBtn) {
        mobileAddBtn.style.width = '100%';
        mobileAddBtn.style.justifyContent = 'center';
        mobileAddBtn.style.padding = '12px 16px';
        mobileAddBtn.style.fontSize = '0.85rem';
    } else {
        // Create mobile add button if it doesn't exist
        let mobileAdd = document.createElement('button'); 
        mobileAdd.id = 'mobileAddBtn';
        mobileAdd.className = 'btn btn-primary'; 
        mobileAdd.innerHTML = '<span>➕</span> Add Trip'; 
        mobileAdd.style.width = '100%';
        mobileAdd.style.justifyContent = 'center';
        mobileAdd.style.padding = '12px 16px';
        mobileAdd.style.fontSize = '0.85rem';
        mobileAdd.addEventListener('click', () => openTripModal(false));
        mobileButtons?.appendChild(mobileAdd);
    }
    
    // ===== EVENT LISTENERS =====
    
    document.getElementById('refreshBtnP1')?.addEventListener('click', refreshAllData);
    document.getElementById('mobileRefreshBtn')?.addEventListener('click', refreshAllData);
    document.getElementById('backToPage1Btn')?.addEventListener('click', goToPage1);
    
    document.getElementById('searchInput')?.addEventListener('input', (e) => {
        if (searchDebounce) clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => renderTablePage1(e.target.value), 300);
    });
    
    document.getElementById('closeGlobalModal')?.addEventListener('click', () => {
        document.getElementById('globalModal')?.classList.remove('active');
    });
    
    document.getElementById('closeTripModalBtn')?.addEventListener('click', () => {
        document.getElementById('tripModal')?.classList.remove('active');
    });
    
    // Close modals when clicking outside
    window.onclick = (e) => { 
        if (e.target.classList?.contains('modal-overlay')) {
            const modalId = e.target.id;
            if (modalId === 'globalModal' || modalId === 'tripModal' || modalId === 'holidayModal') {
                e.target.classList.remove('active');
            }
        }
    };
    
    // ===== LOAD INITIAL DATA =====
    
    await loadDropdownOptions();
    await loadTrips();
    await loadHolidays();
    renderTablePage1("");
    renderHolidayTable();
    
    // Background refresh after 5 seconds
    setTimeout(() => refreshAllData(), 5000);
}
    
    fastInit();
</script>
</body>
