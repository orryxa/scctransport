<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>3108 Fleet Manager | Smart Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ======================== CSS VARIABLES FOR THEMING ======================== */
        :root {
            /* Light Mode Colors */
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            /* Brand Colors */
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --secondary-dark: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fbbf24;
            --info: #06b6d4;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            
            /* Table Colors */
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            
            /* Animation */
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --transition-slow: 500ms ease;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            
            /* Table Colors Dark */
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
            position: relative;
        }

        /* App Container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Page animations */
        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page.active-page {
            display: block;
        }
        
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Cards */
        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .soft-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        /* Headers */
        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        /* Search Section */
        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        /* Buttons */
        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Desktop Buttons */
        .desktop-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Mobile Buttons Grid */
        .mobile-buttons {
            display: none;
        }

        /* Search Input */
        .search-wrapper {
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .search-wrapper input::placeholder {
            color: var(--text-light);
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        /* Table Styles - Enhanced for better display */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
            padding: 0;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        /* Enhanced Table Header with exact columns as requested */
        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 3px solid var(--primary);
            position: relative;
        }

        .data-table th:first-child {
            border-top-left-radius: 12px;
        }

        .data-table th:last-child {
            border-top-right-radius: 12px;
        }

        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
            transition: background var(--transition-fast);
            font-size: 0.9rem;
        }

        .data-table tr:hover td {
            background: var(--table-row-hover);
        }

        /* Total Badge styling */
        .total-badge {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.8rem;
            box-shadow: var(--shadow-sm);
            min-width: 85px;
            text-align: center;
        }

        /* Action button in table */
        .view-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .view-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            filter: brightness(1.05);
        }

        /* Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        @media (max-width: 640px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
        }

        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text-primary);
            word-break: break-word;
        }

        /* Action Row */
        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: white;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }

        .field input, 
        .field select, 
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .field input:focus, 
        .field select:focus, 
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .field input:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .fullwidth {
            grid-column: 1 / -1;
        }

        /* CNG Panel */
        .cng-panel {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .fix-toggle {
            background: var(--table-header-bg);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Autocomplete Styles */
        .autocomplete-wrap {
            position: relative;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            box-shadow: var(--shadow-lg);
            margin-top: 6px;
            border: 1px solid var(--border-color);
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition-fast);
            color: var(--text-primary);
        }

        .autocomplete-item:hover {
            background: var(--primary);
            color: white;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .card-header {
                padding: 1rem 1.2rem;
            }

            .card-header h2 {
                font-size: 1.3rem;
            }

            .search-section {
                padding: 1rem 1.2rem;
            }

            .desktop-buttons {
                display: none;
            }

            .mobile-buttons {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 16px;
                width: 100%;
            }

            .mobile-buttons .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 0.85rem;
            }

            .data-table th,
            .data-table td {
                padding: 12px 12px;
                font-size: 0.7rem;
            }

            .total-badge {
                padding: 4px 8px;
                font-size: 0.7rem;
                min-width: 65px;
            }

            .view-action-btn {
                padding: 4px 10px;
                font-size: 0.65rem;
            }

            .btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }

            .modal-box {
                width: 95%;
                border-radius: 1.5rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--table-header-bg);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Loading States */
        .loading-skeleton {
            background: linear-gradient(90deg, var(--border-color) 25%, var(--table-header-bg) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Hide scrollbars but keep scrolling */
        .table-wrapper::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar,
        .autocomplete-list::-webkit-scrollbar,
        .details-grid::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            background: transparent;
            display: none;
        }
        
        .table-wrapper,
        .modal-box,
        .autocomplete-list,
        .details-grid,
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
        }
        
        .modal-body {
            overflow-y: auto;
            max-height: calc(85vh - 70px);
            scrollbar-width: none;
        }
        
        @media (max-width: 768px) {
            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- PAGE 1 - LIST with Enhanced Table -->
        <div id="page1" class="page active-page">
            <div class="soft-card">
                <div class="card-header">
                    <h2>🚛 3108 · Fleet Manager</h2>
                    
                    <!-- Desktop Buttons -->
                    <div class="desktop-buttons">
                        <button id="refreshBtnP1" class="btn btn-outline">
                            <span>⟳</span> Refresh
                        </button>
                        <button id="addNewBtn" class="btn btn-primary">
                            <span>+</span> Add New Trip
                        </button>
                    </div>
                </div>
                
                <!-- Search Section -->
                <div class="search-section">
                    <div class="search-wrapper">
                        <input type="text" id="searchInput" placeholder="🔍 Search by LR No, Distributor, Sr No...">
                    </div>
                    
                    <!-- Mobile Buttons -->
                    <div class="mobile-buttons">
                        <button id="mobileRefreshBtn" class="btn btn-outline">
                            <span>⟳</span> Refresh
                        </button>
                        <button id="mobileAddBtn" class="btn btn-primary">
                            <span>+</span> Add Trip
                        </button>
                    </div>
                </div>
                
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Sr. No</th>
                                <th>Date</th>
                                <th>LR No</th>
                                <th>Total Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="5" style="text-align:center;">
                                    <div class="spinner"></div> Loading trips...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PAGE 2 - DETAIL -->
        <div id="page2" class="page">
            <div class="soft-card">
                <div class="card-header">
                    <h2>📋 Trip Details</h2>
                    <button id="backToPage1Btn" class="btn btn-outline">← Back</button>
                </div>
                <div id="detailsContainer" class="details-grid">
                    <div class="loading-skeleton" style="height: 200px;"></div>
                </div>
                <div class="action-row">
                    <button id="editFromDetailBtn" class="btn btn-primary">✏️ Edit</button>
                    <button id="deleteFromDetailBtn" class="btn btn-danger">🗑 Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Modal Alert -->
    <div id="globalModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 450px;">
            <div class="modal-header">
                <h3 id="modalTitle">Notice</h3>
                <button class="close-modal" id="closeGlobalModal">×</button>
            </div>
            <div class="modal-body">
                <p id="modalMsg" style="font-size: 1rem; line-height: 1.5;"></p>
                <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
                    <button id="confirmModalBtn" class="btn btn-primary">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Modal -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="formModalTitle">Add New Trip</h3>
                <button class="close-modal" id="closeFormModalBtn">×</button>
            </div>
            <div class="modal-body" id="formModalBody"></div>
        </div>
    </div>

    <script>
        /* ======================== DARK MODE SYNC ======================== */
        function syncThemeWithParent() {
            const localTheme = localStorage.getItem('user-theme-preference');
            if (localTheme) {
                document.body.setAttribute('data-theme', localTheme);
                document.documentElement.setAttribute('data-theme', localTheme);
            } else {
                try {
                    if (window.parent && window.parent.document.body) {
                        const parentTheme = window.parent.document.body.getAttribute('data-theme');
                        if (parentTheme) {
                            document.body.setAttribute('data-theme', parentTheme);
                            document.documentElement.setAttribute('data-theme', parentTheme);

        function formatToDDMMYYYY(dateInput) {
            if (!dateInput || dateInput === '') return '';
            
            try {
                // Handle DD/MM/YYYY format
                if (typeof dateInput === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(dateInput)) {
                    const [day, month, year] = dateInput.split('/');
                    const testDate = new Date(year, month - 1, day);
                    if (!isNaN(testDate.getTime()) && testDate.getDate() == day && testDate.getMonth() + 1 == month) {
                        return dateInput;
                    }
                }
                
                // Handle YYYY-MM-DD format (from date input)
                if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
                    const [year, month, day] = dateInput.split('-');
                    const testDate = new Date(year, month - 1, day);
                    if (!isNaN(testDate.getTime())) {
                        // Validate the date is correct
                        if (testDate.getFullYear() == year && testDate.getMonth() + 1 == month && testDate.getDate() == day) {
                            return `${day}/${month}/${year}`;
                        }
                    }
                }
                
                // Try to parse any other format
                const dateObj = new Date(dateInput);
                if (!isNaN(dateObj.getTime())) {
                    const year = dateObj.getFullYear();
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    return `${day}/${month}/${year}`;
                }
                
                console.error('Failed to parse date:', dateInput);
                return '';
            } catch (error) {
                console.error('Date formatting error:', error);
                return '';
            }
        }
        
        function formatToYYYYMMDD(dateString) {
            if (!dateString || dateString === '') return '';
            
            try {
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                    return dateString;
                }
                
                if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) {
                    const [day, month, year] = dateString.split('/');
                    const testDate = new Date(year, month - 1, day);
                    if (!isNaN(testDate.getTime())) {
                        return `${year}-${month}-${day}`;
                    }
                }
                return '';
            } catch (error) {
                console.error('Date conversion error:', error);
                return '';
            }
        }
        
        function formatDisplayDate(dateInput) {

        async function fetchWithBackgroundCache(url, cacheKey, ttl) {
            const cached = localStorage.getItem(cacheKey);
            let cachedData = null;
            
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < ttl) {
                        cachedData = data;
                    }
                } catch (e) { }
            }
            
            if (cachedData && !preloadInProgress) {
                fetchFreshDataInBackground(url, cacheKey);
                return cachedData;
            }
            
            try {
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    const formattedData = result.data.map(trip => {
                        if (trip['Date']) trip['Date'] = formatToDDMMYYYY(trip['Date']);
                        if (trip['NEFT Date']) trip['NEFT Date'] = formatToDDMMYYYY(trip['NEFT Date']);
                        return trip;
                    });
                    localStorage.setItem(cacheKey, JSON.stringify({
                        data: formattedData,
                        timestamp: Date.now()
                    }));
                    return formattedData;
                }
                return [];
            } catch (err) {
                console.error("Fetch error:", err);
                return cachedData || [];
            }
        }

        async function smartSaveToDistributorSheet(distributorVal, destinationVal, existingData) {
            const addedItems = [];
            let dataModified = false;
            if ((!distributorVal || distributorVal.trim() === "") && (!destinationVal || destinationVal.trim() === "")) {
                return { addedItems, dataModified: false };
            }
            
            let currentData = JSON.parse(JSON.stringify(existingData));
            const normalizedDist = distributorVal ? distributorVal.trim() : "";
            const normalizedDest = destinationVal ? destinationVal.trim() : "";
            
            const distExists = normalizedDist && currentData.some(row => row.Distributor === normalizedDist);
            const destExists = normalizedDest && currentData.some(row => row.Destination === normalizedDest);
            
            if (normalizedDist && normalizedDest && !distExists && !destExists) {
                const completelyEmptyRowIndex = currentData.findIndex(row => (!row.Distributor || row.Distributor === "") && (!row.Destination || row.Destination === ""));
                if (completelyEmptyRowIndex !== -1) {
                    const srNo = currentData[completelyEmptyRowIndex]['Sr. No'];
                    const success = await updateDistributorRow(srNo, normalizedDist, normalizedDest);
                    if (success) {
                        addedItems.push(`Added "${normalizedDist}" + "${normalizedDest}" to existing row`);
                        currentData[completelyEmptyRowIndex].Distributor = normalizedDist;
                        currentData[completelyEmptyRowIndex].Destination = normalizedDest;
                        dataModified = true;
                    }
                } else {
                    const maxSrNo = currentData.reduce((max, row) => Math.max(max, parseInt(row['Sr. No']) || 0), 0);
                    const newSrNo = maxSrNo + 1;
                    const success = await addRowToDistributorSheet(newSrNo, normalizedDist, normalizedDest);
                    if (success) {
                        addedItems.push(`Created new entry: "${normalizedDist}" + "${normalizedDest}"`);
                        currentData.push({ 'Sr. No': newSrNo.toString(), Distributor: normalizedDist, Destination: normalizedDest });
                        dataModified = true;
                    }
                }
            }
            else if (normalizedDist && !distExists) {
                let targetRowIndex = -1;
                if (normalizedDest) {
                    targetRowIndex = currentData.findIndex(row => (!row.Distributor || row.Distributor === "") && row.Destination === normalizedDest);
                }
                if (targetRowIndex === -1) {
                    targetRowIndex = currentData.findIndex(row => (!row.Distributor || row.Distributor === ""));
                }
                if (targetRowIndex !== -1) {
                    const srNo = currentData[targetRowIndex]['Sr. No'];
                    const existingDest = currentData[targetRowIndex].Destination || "";
                    const success = await updateDistributorRow(srNo, normalizedDist, existingDest);
                    if (success) {
                        addedItems.push(`Added Distributor "${normalizedDist}" to existing row`);
                        currentData[targetRowIndex].Distributor = normalizedDist;
                        dataModified = true;
                    }
                } else {
                    const maxSrNo = currentData.reduce((max, row) => Math.max(max, parseInt(row['Sr. No']) || 0), 0);
                    const newSrNo = maxSrNo + 1;
                    const success = await addRowToDistributorSheet(newSrNo, normalizedDist, "");
                    if (success) {
                        addedItems.push(`Created new Distributor entry: "${normalizedDist}"`);
                        currentData.push({ 'Sr. No': newSrNo.toString(), Distributor: normalizedDist, Destination: "" });
                        dataModified = true;
                    }
                }
            }
            else if (normalizedDest && !destExists) {
                let targetRowIndex = -1;
                if (normalizedDist) {
                    targetRowIndex = currentData.findIndex(row => (!row.Destination || row.Destination === "") && row.Distributor === normalizedDist);
                }
                if (targetRowIndex === -1) {
                    targetRowIndex = currentData.findIndex(row => (!row.Destination || row.Destination === ""));
                }
                if (targetRowIndex !== -1) {
                    const srNo = currentData[targetRowIndex]['Sr. No'];
                    const existingDist = currentData[targetRowIndex].Distributor || "";
                    const success = await updateDistributorRow(srNo, existingDist, normalizedDest);
                    if (success) {
                        addedItems.push(`Added Destination "${normalizedDest}" to existing row`);
                        currentData[targetRowIndex].Destination = normalizedDest;
                        dataModified = true;
                    }
                } else {
                    const maxSrNo = currentData.reduce((max, row) => Math.max(max, parseInt(row['Sr. No']) || 0), 0);
                    const newSrNo = maxSrNo + 1;
                    const success = await addRowToDistributorSheet(newSrNo, "", normalizedDest);
                    if (success) {
                        addedItems.push(`Created new Destination entry: "${normalizedDest}"`);
                        currentData.push({ 'Sr. No': newSrNo.toString(), Distributor: "", Destination: normalizedDest });
                        dataModified = true;
                    }
                }
            }
            
            if (dataModified) {
                localStorage.setItem(DIST_CACHE_KEY, JSON.stringify({
                    data: currentData,
                    timestamp: Date.now()

                updateDistributorOptionsFromData(currentData);

                        <div class="field"><label>CNG Rate</label><input type="number" step="0.01" id="editCngRate" value="${escapeHtml(def["CNG Rate"])}"></div>
                        <div class="field"><label>CNG Cost</label><input type="number" id="editCngCost" value="${escapeHtml(def["CNG Cost"])}"></div>
                        <div class="field autocomplete-wrap"><label>Destination</label><input type="text" id="editDestination" value="${escapeHtml(def["Destination"])}" autocomplete="off"><div id="destAutoList" class="autocomplete-list"></div></div>
                        <div class="field autocomplete-wrap"><label>Distributor</label><input type="text" id="editDistributor" value="${escapeHtml(def["Distributor"])}" autocomplete="off"><div id="distAutoList" class="autocomplete-list"></div></div>
                        <div class="field"><label>Unloading Charge</label><input type="number" id="editUnloadingCharge" value="${escapeHtml(def["Unloading Charge"])}"></div>
                        <div class="field"><label>EWay Bill No</label><input type="text" id="editEwayBill" value="${escapeHtml(def["EWay Bill No"])}"></div>
                        <div class="field"><label>NEFT Date</label><input type="date" id="editNeftDate" value="${neftDateValue}"></div>
                        <div class="field"><label>NEFT Amt</label><input type="number" id="editNeftAmt" value="${escapeHtml(def["NEFT Amt"])}"></div>
                        <div class="field fullwidth"><label>Note</label><textarea id="editNote" rows="2">${escapeHtml(def["Note"])}</textarea></div>
                    </div>
                    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1.5rem;">
                        <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                        <button type="submit" id="saveUpdateBtn" class="btn btn-primary">${isEdit ? "💾 Update Trip" : "💾 Save Trip"}</button>
                    </div>
                </form>
            `;
        }
        
        function setupAutocomplete(inputId, listId, optionsArray) {
            const input = document.getElementById(inputId);
            const listEl = document.getElementById(listId);
            if (!input || !listEl) return;
            function showOptions(filterVal = '') {
                const term = filterVal.toLowerCase();
                const filtered = optionsArray.filter(opt => opt.toLowerCase().includes(term));
                if (filtered.length > 0) {
                    listEl.innerHTML = filtered.map(opt => `<div class="autocomplete-item" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`).join('');
                    listEl.style.display = 'block';
                    listEl.querySelectorAll('.autocomplete-item').forEach(item => {
                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            input.value = item.getAttribute('data-value');
                            listEl.style.display = 'none';
                            input.dispatchEvent(new Event('input', { bubbles: true }));
                        });
                    });
                } else {
                    listEl.style.display = 'none';
                }
            }
            input.addEventListener('input', (e) => showOptions(e.target.value));
            input.addEventListener('focus', () => showOptions(input.value));
            input.addEventListener('blur', () => setTimeout(() => listEl.style.display = 'none', 200));
            document.addEventListener('click', (e) => {
                if (!listEl.contains(e.target) && e.target !== input) listEl.style.display = 'none';
            });
        }
        
        /* ======================== FIXED VALIDATION FUNCTION ======================== */
        function validateFormBeforeSubmit() {
            const dateField = document.getElementById('editDate');
            if (!dateField || !dateField.value || dateField.value.trim() === '') {
                showModal('❌ Please select a Date before saving. Date is required.', 'Validation Error');
                return false;
            }
            
            // Validate date is valid
            const dateValue = dateField.value;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                showModal('❌ Invalid date format. Please select a valid date.', 'Validation Error');
                return false;
            }
            
            const [year, month, day] = dateValue.split('-');
            const testDate = new Date(year, month - 1, day);
            if (isNaN(testDate.getTime()) || 
                testDate.getFullYear() != year || 
                testDate.getMonth() + 1 != month || 
                testDate.getDate() != day) {
                showModal('❌ Invalid date. Please select a valid date.', 'Validation Error');
                return false;
            }
            
            return true;
        }
        
        /* ======================== FIXED FORM ATTACHMENT ======================== */
        function attachFormEvents(isEdit, rowIdx) {
            const form = document.getElementById('dynamicTripForm');
            if (form) {
                // Remove any existing listener to avoid duplicates
                form.removeEventListener('submit', handleFormSubmit);
                form.addEventListener('submit', (e) => handleFormSubmit(e, isEdit, rowIdx));
            }
            document.getElementById('cancelFormBtn')?.addEventListener('click', () => dom.formModal?.classList.remove('active'));
            
            const start = document.getElementById('editStartKm');
            const end = document.getElementById('editEndKm');
            const distField = document.getElementById('editDistance');
            const updateDist = () => { 
                if (distField && start && end) {
                    const startVal = parseFloat(start.value) || 0;
                    const endVal = parseFloat(end.value) || 0;
                    distField.value = Math.max(0, endVal - startVal);
                }
            };
            start?.addEventListener('input', updateDist);
            end?.addEventListener('input', updateDist);
            
            const fixToggle = document.getElementById('editCngFixToggle');
            const manualLit = document.getElementById('editCngManualLiters');
            const rateF = document.getElementById('editCngRate');
            const costF = document.getElementById('editCngCost');
            const updateManualCost = () => { 
                if (!fixToggle?.checked && manualLit && rateF && costF) {
                    const liters = parseFloat(manualLit.value) || 0;
                    const rate = parseFloat(rateF.value) || 0;
                    costF.value = Math.round(liters * rate);
                }
            };
            fixToggle?.addEventListener('change', () => {
                if (fixToggle.checked) { 
                    manualLit.disabled = true; 
                    manualLit.value = ""; 
                    costF.disabled = false; 
                } else { 
                    manualLit.disabled = false; 
                    updateManualCost(); 
                    costF.disabled = true; 
                }
            });
            manualLit?.addEventListener('input', updateManualCost);
            rateF?.addEventListener('input', updateManualCost);
            updateDist();
        }
        
        /* ======================== COMPLETELY FIXED FORM SUBMIT HANDLER ======================== */
        async function handleFormSubmit(e, isEdit, rowIdx) {
            e.preventDefault();
            
            // Validate form before proceeding
            if (!validateFormBeforeSubmit()) {
                return;
            }
            
            const saveBtn = document.getElementById('saveUpdateBtn');
            showSpinner(saveBtn, true);
            
            // Capture all form values IMMEDIATELY (before any async operations)
            const formData = {
                tripNo: document.getElementById('editTripNo')?.value || "",
                date: document.getElementById('editDate')?.value || "",
                soNo: document.getElementById('editSoNo')?.value || "",
                lrNo: document.getElementById('editLrNo')?.value || "",
                startKm: document.getElementById('editStartKm')?.value || "0",
                endKm: document.getElementById('editEndKm')?.value || "0",
                foodAmt: document.getElementById('editFoodAmt')?.value || "0",
                advance: document.getElementById('editAdvance')?.value || "0",
                salary: document.getElementById('editSalary')?.value || "0",
                cngRate: document.getElementById('editCngRate')?.value || DEFAULT_CNG_RATE,
                cngCost: document.getElementById('editCngCost')?.value || "0",
                destination: document.getElementById('editDestination')?.value || "",
                distributor: document.getElementById('editDistributor')?.value || "",
                unloadingCharge: document.getElementById('editUnloadingCharge')?.value || "0",
                ewayBill: document.getElementById('editEwayBill')?.value || "",
                neftDate: document.getElementById('editNeftDate')?.value || "",
                neftAmt: document.getElementById('editNeftAmt')?.value || "0",
                note: document.getElementById('editNote')?.value || ""
            };
            
            const isFix = document.getElementById('editCngFixToggle')?.checked;
            let cngTank = isFix ? "FIX" : (document.getElementById('editCngManualLiters')?.value || "");
            
            // Calculate distance
            const distance = Math.max(0, (parseFloat(formData.endKm) || 0) - (parseFloat(formData.startKm) || 0));
            
            // Calculate CNG cost for manual mode
            let finalCngCost = parseFloat(formData.cngCost) || 0;
            if (!isFix) {
                const manualLiters = parseFloat(document.getElementById('editCngManualLiters')?.value || "0");
                const rate = parseFloat(formData.cngRate) || 0;
                finalCngCost = Math.round(manualLiters * rate);
            }
            
            // Format dates with validation logging
            console.log('Raw Date from form:', formData.date);
            console.log('Raw NEFT Date from form:', formData.neftDate);
            
            let formattedDate = '';
            let formattedNeftDate = '';
            
            if (formData.date && formData.date.trim() !== '') {
                formattedDate = formatToDDMMYYYY(formData.date);
                if (!formattedDate) {
                    showModal('❌ Invalid Date format. Please select a valid date.', 'Validation Error');
                    showSpinner(saveBtn, false);
                    return;
                }
                console.log('Formatted Date for saving:', formattedDate);
            } else {
                showModal('❌ Date is required. Please select a date.', 'Validation Error');
                showSpinner(saveBtn, false);
                return;
            }
            
            if (formData.neftDate && formData.neftDate.trim() !== '') {
                formattedNeftDate = formatToDDMMYYYY(formData.neftDate);
                if (!formattedNeftDate) {
                    showModal('❌ Invalid NEFT Date format. Please select a valid date.', 'Validation Error');
                    showSpinner(saveBtn, false);
                    return;
                }
                console.log('Formatted NEFT Date for saving:', formattedNeftDate);
            }
            
            // Build params for Google Sheets
            const params = new URLSearchParams();
            params.append("action", isEdit ? "update" : "insert");
            params.append("spreadsheetId", SPREADSHEET_ID);
            params.append("sheetName", SHEET_NAME);
            if (isEdit && rowIdx) params.append("rowIndex", rowIdx);
            params.append("Trip No", formData.tripNo);
            params.append("Date", formattedDate);
            params.append("SO No", formData.soNo);
            params.append("LR No", formData.lrNo);
            params.append("Start KM", formData.startKm);
            params.append("End KM", formData.endKm);
            params.append("Distance", distance);
            params.append("Food Amt", formData.foodAmt);
            params.append("Advance", formData.advance);
            params.append("Salary", formData.salary);
            params.append("CNG Tank", cngTank);
            params.append("CNG Rate", formData.cngRate);
            params.append("CNG Cost", finalCngCost);
            params.append("Destination", formData.destination);
            params.append("Distributor", formData.distributor);
            params.append("Unloading Charge", formData.unloadingCharge);
            params.append("EWay Bill No", formData.ewayBill);
            params.append("NEFT Date", formattedNeftDate);
            params.append("NEFT Amt", formData.neftAmt);
            params.append("Note", formData.note);
            
            // Log what we're sending
            console.log('Sending to Google Sheets:', {
                Date: formattedDate,
                NEFTDate: formattedNeftDate,
                action: isEdit ? "update" : "insert"
            });
            
            try {
                // Use AbortController for timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
                
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString(),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const result = await response.json();
                
                if (result.status === "success") {
                    let distributorMsg = "";
                    if (formData.distributor || formData.destination) {
                        try {
                            const existingData = await fetchExistingDistributorData(true);
                            const distResult = await smartSaveToDistributorSheet(formData.distributor, formData.destination, existingData);
                            if (distResult.addedItems.length > 0) distributorMsg = `<br><br>📌 ${distResult.addedItems.join('<br>')}`;
                            await loadDistributorFast();
                        } catch (err) { 
                            console.error('Distributor save error:', err);
                            distributorMsg = `<br><br>⚠️ Note: Trip saved, but Distributor sheet update failed.`; 
                        }
                    }
                    
                    showModal(`${isEdit ? "✅ Trip updated" : "✅ Trip saved"} successfully!${distributorMsg}`, "Success", false, null, 2000);
                    
                    // Close modal AFTER success
                    dom.formModal?.classList.remove('active');
                    
                    // Refresh data and go back to page 1
                    await refreshAllData();
                    goToPage1();
                } else { 
                    showModal("❌ Error: " + (result.message || "Unknown error"), "Error"); 
                }
            } catch (err) {
                console.error('Save error:', err);
                if (err.name === 'AbortError') {
                    showModal("❌ Request timeout. Please check your internet connection and try again.", "Error");
                } else {
                    showModal("❌ Error: " + err.message, "Error");
                }
            } finally { 
                showSpinner(saveBtn, false); 
            }
        }
        
        async function openAddModal() {
            if (!dom.formModalBody) return;
            dom.formModalBody.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="spinner"></div><p style="margin-top: 12px;">Loading form...</p></div>';
            dom.formModal.classList.add('active');
            dom.formModalTitle.innerHTML = "➕ Add New Trip";
            dom.formModalBody.innerHTML = buildFormHtml(null, false);
            setTimeout(() => {
                setupAutocomplete('editDestination', 'destAutoList', destinationOptions);
                setupAutocomplete('editDistributor', 'distAutoList', distributorOptions);
                attachFormEvents(false, null);
            }, 20);
        }
        
        async function openEditModal() {
            if (!currentViewTrip || !dom.formModalBody) return;
            const rowIdx = findRowIndexBySrNo(currentViewTrip["Sr. No"]);
            if (!rowIdx) { showModal("Row error", "Error"); return; }
            dom.formModalBody.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="spinner"></div><p style="margin-top: 12px;">Loading edit form...</p></div>';
            dom.formModal.classList.add('active');
            dom.formModalTitle.innerHTML = "✏️ Edit Trip";
            dom.formModalBody.innerHTML = buildFormHtml(currentViewTrip, true);
            setTimeout(() => {
                setupAutocomplete('editDestination', 'destAutoList', destinationOptions);
                setupAutocomplete('editDistributor', 'distAutoList', distributorOptions);
                attachFormEvents(true, rowIdx);
            }, 20);
        }
        
        async function fastInit() {
            cacheDomElements();
            if (dom.tableBody) dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><div class="spinner"></div> Loading trips...</td></tr>';
            const [tripsData] = await Promise.all([loadTripsFast(), loadDistributorFast()]);
            renderTablePage1("");
            setTimeout(() => { refreshInBackground(); loadDistributorFast(); }, 3000);
            dom.refreshBtn?.addEventListener('click', async () => { if (dom.refreshBtn) showSpinner(dom.refreshBtn, true); try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem(DIST_CACHE_KEY); allTrips = await loadTripsFast(); await loadDistributorFast(); renderTablePage1(dom.searchInput?.value || ""); } catch (err) { showModal("❌ Refresh failed: " + err.message, "Error"); } finally { if (dom.refreshBtn) showSpinner(dom.refreshBtn, false); } });
            if (dom.mobileRefreshBtn) dom.mobileRefreshBtn.addEventListener('click', async () => { if (dom.mobileRefreshBtn) showSpinner(dom.mobileRefreshBtn, true); try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem(DIST_CACHE_KEY); allTrips = await loadTripsFast(); await loadDistributorFast(); renderTablePage1(dom.searchInput?.value || ""); } catch (err) { showModal("❌ Refresh failed: " + err.message, "Error"); } finally { if (dom.mobileRefreshBtn) showSpinner(dom.mobileRefreshBtn, false); } });
            dom.addNewBtn?.addEventListener('click', openAddModal);
            if (dom.mobileAddBtn) dom.mobileAddBtn.addEventListener('click', () => dom.addNewBtn?.click());
            dom.backBtn?.addEventListener('click', goToPage1);
            dom.editBtn?.addEventListener('click', openEditModal);
            dom.deleteBtn?.addEventListener('click', deleteCurrentTrip);
            dom.searchInput?.addEventListener('input', (e) => { if (searchDebounceTimer) clearTimeout(searchDebounceTimer); searchDebounceTimer = setTimeout(() => renderTablePage1(e.target.value), 300); });
            document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal?.classList.remove('active'));
            document.getElementById('closeFormModalBtn')?.addEventListener('click', () => dom.formModal?.classList.remove('active'));
            window.onclick = (e) => { if (e.target.classList?.contains('modal-overlay')) e.target.classList.remove('active'); };
        }
        fastInit();
    </script>
