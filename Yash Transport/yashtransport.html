<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#667eea">
    <title>Yash Transport | Fleet Manager</title>

    <!-- ============================================================
         OPTIMIZATION #3: INLINE CRITICAL CSS
         All above-the-fold styles inlined — first paint without
         waiting for external stylesheets.
         ============================================================ -->
    <style>
        /* ---------- Reset (critical) ---------- */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* ---------- Theme tokens (critical) ---------- */
        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
        }
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
        }

        /* ---------- Base body (critical) ---------- */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container { max-width: 1400px; margin: 0 auto; }

        /* ---------- Page transitions ---------- */
        /* OPTIMIZATION #10: transform + opacity only (GPU accelerated) */
        .page { display: none; }
        .page.active-page {
            display: block;
            animation: fadeSlide 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translate3d(0, 16px, 0) scale(0.985); }
            to   { opacity: 1; transform: translate3d(0, 0, 0)     scale(1); }
        }

        /* ---------- Card shell (critical) ---------- */
        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            will-change: transform;
        }

        /* ---------- Card header (critical) ---------- */
        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }
        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        /* ---------- Buttons (critical) ---------- */
        /* OPTIMIZATION #10: no ::before ripple (layout trigger), no filter:brightness transition */
        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), opacity var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            will-change: transform;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: var(--shadow-sm); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-danger  { background: linear-gradient(135deg, var(--danger), #dc2626); color: #fff; }
        .btn-sm      { padding: 6px 16px; font-size: 0.75rem; }

        .btn-primary:hover,
        .btn-outline:hover,
        .btn-danger:hover {
            transform: translate3d(0, -2px, 0);
            box-shadow: var(--shadow-md);
        }
        .btn-outline:hover { background: var(--primary); color: #fff; }

        /* ---------- Search (critical) ---------- */
        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .search-wrapper input::placeholder { color: var(--text-light); }
        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* ---------- Table (critical) ---------- */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .table-wrapper::-webkit-scrollbar { display: none; }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }
        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 3px solid var(--primary);
        }
        .data-table th:first-child { border-top-left-radius: 12px; }
        .data-table th:last-child  { border-top-right-radius: 12px; }
        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
            transition: background var(--transition-fast);
            font-size: 0.9rem;
        }
        .data-table tr:hover td { background: var(--table-row-hover); }

        /* Total badge */
        .total-badge {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: #fff;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.8rem;
            box-shadow: var(--shadow-sm);
            min-width: 85px;
            text-align: center;
        }

        /* View button */
        .view-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            will-change: transform;
        }
        .view-action-btn:hover { transform: translate3d(0, -2px, 0); box-shadow: var(--shadow-sm); }

        /* ---------- Details grid ---------- */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }
        @media (max-width: 640px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
        }
        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
            border: 1px solid var(--border-color);
            cursor: pointer;
            will-change: transform;
        }
        .detail-card:hover {
            transform: translate3d(0, -2px, 0);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }
        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text-primary);
            word-break: break-word;
        }

        /* ---------- Action row ---------- */
        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* ---------- Modals ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: opacity var(--transition-normal), visibility var(--transition-normal);
            will-change: opacity;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .modal-box::-webkit-scrollbar { display: none; }
        .modal-overlay.active .modal-box { animation: modalPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop {
            from { transform: scale(0.94); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: #fff;
        }
        .modal-header h3 { font-size: 1.3rem; font-weight: 700; }
        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #fff;
            line-height: 1;
            transition: transform var(--transition-fast);
        }
        .close-modal:hover { transform: rotate(90deg); }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(85vh - 70px);
            scrollbar-width: none;
        }
        .modal-body::-webkit-scrollbar { display: none; }

        /* ---------- Forms ---------- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }
        .field input,
        .field select,
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .field input:disabled { background: var(--text-light); cursor: not-allowed; }

        /* ---------- Autocomplete ---------- */
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            box-shadow: var(--shadow-lg);
            margin-top: 6px;
            border: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .autocomplete-list::-webkit-scrollbar { display: none; }
        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-primary);
            transition: background var(--transition-fast), color var(--transition-fast);
        }
        .autocomplete-item:hover { background: var(--primary); color: #fff; }

        /* ---------- Spinner ---------- */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            will-change: transform;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Skeleton loader (used in initial HTML) ---------- */
        .skeleton-bar {
            height: 14px;
            border-radius: 8px;
            background: linear-gradient(90deg,
                var(--table-header-bg) 0%,
                var(--table-row-hover) 50%,
                var(--table-header-bg) 100%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.4s ease-in-out infinite;
            will-change: background-position;
        }
        @keyframes skeletonShimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-row td { padding: 16px 20px; border-bottom: 1px solid var(--table-border); }

        /* ---------- Responsive ---------- */
        .desktop-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .mobile-buttons  { display: none; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .card-header { padding: 1rem 1.2rem; }
            .card-header h2 { font-size: 1.3rem; }
            .search-section { padding: 1rem 1.2rem; }
            .desktop-buttons { display: none; }
            .mobile-buttons {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 16px;
                width: 100%;
            }
            .mobile-buttons .btn { width: 100%; justify-content: center; padding: 12px 16px; font-size: 0.85rem; }
            .data-table th, .data-table td { padding: 12px; font-size: 0.7rem; }
            .total-badge { padding: 4px 8px; font-size: 0.7rem; min-width: 65px; }
            .view-action-btn { padding: 4px 10px; font-size: 0.65rem; }
            .btn { padding: 8px 18px; font-size: 0.8rem; }
            .modal-box { width: 95%; border-radius: 1.5rem; }
            .form-grid { grid-template-columns: 1fr; gap: 1rem; }
        }

        /* ---------- Accessibility ---------- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- PAGE 1 – LIST -->
        <div id="page1" class="page active-page">
            <div class="soft-card">
                <div class="card-header">
                    <h2>🚛 Yash Transport · Fleet Manager</h2>
                    <div class="desktop-buttons">
                        <button id="refreshBtnP1" class="btn btn-outline"><span>⟳</span> Refresh</button>
                        <button id="addNewBtn" class="btn btn-primary"><span>+</span> Add New Entry</button>
                    </div>
                </div>
                <div class="search-section">
                    <div class="search-wrapper">
                        <input type="text" id="searchInput" placeholder="🔍 Search by LR No, Vendor Name, Vehicle No..." autocomplete="off" inputmode="search">
                    </div>
                    <div class="mobile-buttons">
                        <button id="mobileRefreshBtn" class="btn btn-outline"><span>⟳</span> Refresh</button>
                        <button id="mobileAddBtn" class="btn btn-primary"><span>+</span> Add Entry</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Sr. No</th>
                                <th>Date</th>
                                <th>Vendor Name (Source)</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <!-- OPTIMIZATION #9: Skeleton rows inline — visible immediately -->
                        <tbody id="tableBody">
                            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width:40%"></div></td><td><div class="skeleton-bar" style="width:70%"></div></td><td><div class="skeleton-bar" style="width:55%"></div></td><td><div class="skeleton-bar" style="width:60%"></div></td><td><div class="skeleton-bar" style="width:50%"></div></td></tr>
                            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width:35%"></div></td><td><div class="skeleton-bar" style="width:65%"></div></td><td><div class="skeleton-bar" style="width:50%"></div></td><td><div class="skeleton-bar" style="width:55%"></div></td><td><div class="skeleton-bar" style="width:45%"></div></td></tr>
                            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width:45%"></div></td><td><div class="skeleton-bar" style="width:75%"></div></td><td><div class="skeleton-bar" style="width:60%"></div></td><td><div class="skeleton-bar" style="width:50%"></div></td><td><div class="skeleton-bar" style="width:55%"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PAGE 2 – DETAIL -->
        <div id="page2" class="page">
            <div class="soft-card">
                <div class="card-header">
                    <h2>📋 Entry Details</h2>
                    <button id="backToPage1Btn" class="btn btn-outline">← Back</button>
                </div>
                <div id="detailsContainer" class="details-grid"></div>
                <div class="action-row">
                    <button id="editFromDetailBtn" class="btn btn-primary">✏️ Edit</button>
                    <button id="deleteFromDetailBtn" class="btn btn-danger">🗑 Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Global modal -->
    <div id="globalModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 450px;">
            <div class="modal-header">
                <h3 id="modalTitle">Notice</h3>
                <button class="close-modal" id="closeGlobalModal" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <p id="modalMsg" style="font-size: 1rem; line-height: 1.5;"></p>
                <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
                    <button id="confirmModalBtn" class="btn btn-primary">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Form modal -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="formModalTitle">Add New Entry</h3>
                <button class="close-modal" id="closeFormModalBtn" aria-label="Close">×</button>
            </div>
            <div class="modal-body" id="formModalBody"></div>
        </div>
    </div>

    <!-- ============================================================
         OPTIMIZATION #2: DEFER JS
         Parser is not blocked; DOM is guaranteed ready when script runs.
         ============================================================ -->
    <script defer>
        /* =========================================================
           DARK MODE SYNC (interval 1000 → 2000 ms; cleared on unload)
           ========================================================= */
        function syncThemeWithParent() {
            const localTheme = localStorage.getItem('user-theme-preference');
            if (localTheme) {
                document.body.setAttribute('data-theme', localTheme);
                document.documentElement.setAttribute('data-theme', localTheme);
            } else {
                try {
                    if (window.parent && window.parent.document.body) {
                        const pt = window.parent.document.body.getAttribute('data-theme');
                        if (pt) {
                            document.body.setAttribute('data-theme', pt);
                            document.documentElement.setAttribute('data-theme', pt);
                        }
                    }
                } catch (e) { /* cross-origin */ }
            }
        }

        window.addEventListener('DOMContentLoaded', syncThemeWithParent);
        window.addEventListener('storage', syncThemeWithParent);

        const themeInterval = setInterval(syncThemeWithParent, 2000);
        window.addEventListener('beforeunload', () => clearInterval(themeInterval));

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'themeChange') {
                const t = event.data.theme;
                if (t) {
                    document.body.setAttribute('data-theme', t);
                    document.documentElement.setAttribute('data-theme', t);
                }
            }
        });

        /* ======================== CONFIGURATION ======================== */
        const SCRIPT_URL         = "https://script.google.com/macros/s/AKfycbzoDds81u8M5N8micA_hoIBgCS7aCFm0NUmwW6XLH4m_fRJ8R9pGqjgFGMeBxBd2dSL/exec";
        const SPREADSHEET_ID     = "1ufYQniJ_0ke7O0Bd5zNGAimdNKBSvi4dGMeQp3CQjwY";
        const SHEET_NAME         = "Yash Transport";
        const SOURCE_SHEET       = "Source";
        const DESTINATION_SHEET  = "Destination";

        // OPTIMIZATION #7: cache TTL reduced to 5 minutes
        const CACHE_TTL = 5 * 60 * 1000;

        const CACHE_KEY       = "yash_transport_cache_v2";
        const SOURCE_CACHE_KEY= "yash_transport_source_cache_v2";
        const DEST_CACHE_KEY  = "yash_transport_dest_cache_v2";

        /* ---------- Shared state ---------- */
        let allEntries          = [];
        let currentViewEntry    = null;
        let sourceOptions       = [];
        let vehicleOptions      = [];
        let pickupOptions       = [];
        let destinationOptions  = [];
        let preloadInProgress   = false;
        let searchDebounceTimer = null;
        let saveInProgress      = false;

        const dom = {};

        function cacheDomElements() {
            dom.page1             = document.getElementById('page1');
            dom.page2             = document.getElementById('page2');
            dom.tableBody         = document.getElementById('tableBody');
            dom.searchInput       = document.getElementById('searchInput');
            dom.refreshBtn        = document.getElementById('refreshBtnP1');
            dom.addNewBtn         = document.getElementById('addNewBtn');

        /* ======================== UTILITIES ======================== */
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[m]));
        }

        function formatToDDMMYYYY(dateInput) {
            if (!dateInput || dateInput === '') return '—';
            try {
                if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
                    const [y, m, d] = dateInput.split('-');
                    return `${d}/${m}/${y}`;
                }
                if (typeof dateInput === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(dateInput)) return dateInput;
                const d = new Date(dateInput);
                if (isNaN(d.getTime())) return '—';
                const dd = String(d.getDate()).padStart(2, '0');
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                return `${dd}/${mm}/${d.getFullYear()}`;
            } catch { return '—'; }
        }

        function formatToYYYYMMDD(dateString) {
            if (!dateString) return '';
            try {
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) return dateString;
                if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) {
                    const [d, m, y] = dateString.split('/');
                    return `${y}-${m}-${d}`;
                }
                return '';
            } catch { return ''; }
        }

        function formatDisplayDate(d) {
            return d ? (formatToDDMMYYYY(d) || '—') : '—';
        }

        function showModal(msg, title = "Message", isConfirm = false, onConfirm = null, autoClose = 0) {
            if (!dom.globalModal) return;
            dom.modalTitle.textContent = title;
            dom.modalMsg.innerHTML = msg;
            const confirmBtn = document.getElementById('confirmModalBtn');
            if (confirmBtn) {
                confirmBtn.onclick = () => {
                    dom.globalModal.classList.remove('active');
                    if (isConfirm && onConfirm) onConfirm();
                };
            }
            dom.globalModal.classList.add('active');
            if (autoClose > 0) setTimeout(() => dom.globalModal.classList.remove('active'), autoClose);
        }

        function showSpinner(el, show, customHtml = null) {
            if (!el) return;
            if (show) {
                el.disabled = true;
                el.setAttribute('data-original-text', el.innerHTML);
                el.innerHTML = customHtml || '<span class="spinner"></span> Loading...';
            } else {
                el.disabled = false;
                const o = el.getAttribute('data-original-text');
                if (o) el.innerHTML = o;
            }
        }

        /* ======================== CACHE / FETCH ======================== */
        // OPTIMIZATION #1: cold-start skips cache and always fetches fresh.
        async function fetchWithBackgroundCache(url, cacheKey, { skipCache = false } = {}) {
            let cachedData = null;

            if (!skipCache) {
                const raw = localStorage.getItem(cacheKey);
                if (raw) {
                    try {
                        const { data, timestamp } = JSON.parse(raw);
                        if (Date.now() - timestamp < CACHE_TTL) cachedData = data;
                    } catch { /* corrupt cache */ }
                }
            }

            if (cachedData && !preloadInProgress) {
                fetchFreshDataInBackground(url, cacheKey);
                return cachedData;
            }

            try {
                const res  = await fetch(url);
                const json = await res.json();
                if (json.status === "success" && Array.isArray(json.data)) {
                    try {
                        localStorage.setItem(cacheKey, JSON.stringify({ data: json.data, timestamp: Date.now() }));
                    } catch { /* quota */ }
                    return json.data;
                }
                return [];
            } catch (err) {
                console.error("Fetch error:", err);
                return cachedData || [];
            }
        }

        async function fetchFreshDataInBackground(url, cacheKey) {
            preloadInProgress = true;
            try {
                const res  = await fetch(url);
                const json = await res.json();
                if (json.status === "success" && Array.isArray(json.data)) {
                    try {
                        localStorage.setItem(cacheKey, JSON.stringify({ data: json.data, timestamp: Date.now() }));
                    } catch { /* quota */ }

                    if (cacheKey === CACHE_KEY && json.data.length !== allEntries.length) {
                        allEntries = json.data;
                        renderTablePage1(dom.searchInput?.value || "");
                    }
                    if (cacheKey === SOURCE_CACHE_KEY) updateSourceOptionsFromData(json.data);
                    if (cacheKey === DEST_CACHE_KEY)   updateDestinationOptionsFromData(json.data);
                }
            } catch (err) {
                console.warn("Background fetch failed:", err);
            } finally {
                preloadInProgress = false;
            }
        }

        // OPTIMIZATION #6: batch all three sheet fetches with Promise.all.
        async function fetchAllSources({ skipCache = false } = {}) {
            const entriesUrl = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`;
            const sourceUrl  = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SOURCE_SHEET}&_=${Date.now()}`;
            const destUrl    = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${DESTINATION_SHEET}&_=${Date.now()}`;

            const [entries, source, dest] = await Promise.all([
                fetchWithBackgroundCache(entriesUrl, CACHE_KEY,        { skipCache }),
                fetchWithBackgroundCache(sourceUrl,  SOURCE_CACHE_KEY, { skipCache }),
                fetchWithBackgroundCache(destUrl,    DEST_CACHE_KEY,   { skipCache })
            ]);

            allEntries = entries;
            updateSourceOptionsFromData(source);
            updateDestinationOptionsFromData(dest);
            return { entries, source, dest };
        }

        function updateSourceOptionsFromData(data) {
            const sources = new Set();
            const vehicles = new Set();
            (data || []).forEach(row => {
                if (row["Vendor Name"] && String(row["Vendor Name"]).trim()) sources.add(String(row["Vendor Name"]).trim());
                if (row["Vehicle No"]  && String(row["Vehicle No"]).trim())  vehicles.add(String(row["Vehicle No"]).trim());
            });
            sourceOptions  = Array.from(sources);
            vehicleOptions = Array.from(vehicles);
        }

        function updateDestinationOptionsFromData(data) {
            const pickups = new Set();
            const dests   = new Set();
            (data || []).forEach(row => {
                if (row["Pickup Name"]  && String(row["Pickup Name"]).trim())  pickups.add(String(row["Pickup Name"]).trim());
                if (row["Destination"]  && String(row["Destination"]).trim())  dests.add(String(row["Destination"]).trim());
            });
            pickupOptions      = Array.from(pickups);
            destinationOptions = Array.from(dests);
        }

                    body: new URLSearchParams(params).toString()
                });
                const json = await res.json();
                return json.status === "success";
            } catch (err) {
                console.error("POST error:", err);
                return false;
            }
        }

        /* ======================== SMART SAVE: SOURCE ======================== */
        async function smartSaveToSourceSheet(vendorName, vehicleNo, existingData) {
            const addedItems = [];
            let dataModified = false;

            const normVendor  = vendorName ? String(vendorName).trim() : "";
            const normVehicle = vehicleNo  ? String(vehicleNo).trim()  : "";

            if (!normVendor && !normVehicle) return { addedItems, dataModified };

            const data = JSON.parse(JSON.stringify(existingData));
            const vendorExists  = normVendor  && data.some(r => r["Vendor Name"] === normVendor);
            const vehicleExists = normVehicle && data.some(r => r["Vehicle No"]  === normVehicle);

            const isEmptyBoth = r => (!r["Vendor Name"] || r["Vendor Name"] === "") &&
                                     (!r["Vehicle No"]  || r["Vehicle No"]  === "");
            const isEmptyVendor  = r => (!r["Vendor Name"] || r["Vendor Name"] === "");
            const isEmptyVehicle = r => (!r["Vehicle No"]  || r["Vehicle No"]  === "");

            const maxSr = () => data.reduce((m, r) => Math.max(m, parseInt(r["Sr. No"]) || 0), 0);

            // Case 1: both new
            if (normVendor && normVehicle && !vendorExists && !vehicleExists) {
                const idx = data.findIndex(isEmptyBoth);
                if (idx !== -1) {
                    const srNo = data[idx]["Sr. No"];
                    const rowIndex = parseInt(srNo) + 1;
                    const ok = await updateSourceRow(rowIndex, srNo, normVendor, normVehicle);
                    if (ok) {
                        addedItems.push(`Added "${normVendor}" + "${normVehicle}" to existing empty row (Sr. No ${srNo})`);
                        data[idx]["Vendor Name"] = normVendor;
                        data[idx]["Vehicle No"]  = normVehicle;
                        dataModified = true;
                    }
                } else {
                    const newSr = maxSr() + 1;
                    const ok = await addRowToSourceSheet(newSr, normVendor, normVehicle);
                    if (ok) {
                        addedItems.push(`Created new entry: "${normVendor}" + "${normVehicle}" (Sr. No ${newSr})`);
                        data.push({ "Sr. No": String(newSr), "Vendor Name": normVendor, "Vehicle No": normVehicle });
                        dataModified = true;
                    }
                }
            }
            // Case 2: only vendor new
            else if (normVendor && !vendorExists) {
                let idx = -1;
                if (normVehicle) idx = data.findIndex(r => isEmptyVendor(r) && r["Vehicle No"] === normVehicle);
                if (idx === -1)  idx = data.findIndex(isEmptyVendor);
                if (idx !== -1) {
                    const srNo = data[idx]["Sr. No"];
                    const rowIndex = parseInt(srNo) + 1;
                    const exVeh = data[idx]["Vehicle No"] || "";
                    const ok = await updateSourceRow(rowIndex, srNo, normVendor, exVeh);
                    if (ok) {
                        addedItems.push(`Added Vendor "${normVendor}" to existing row (Sr. No ${srNo})`);
                        data[idx]["Vendor Name"] = normVendor;
                        dataModified = true;
                    }
                } else {
                    const newSr = maxSr() + 1;
                    const ok = await addRowToSourceSheet(newSr, normVendor, normVehicle || "");
                    if (ok) {
                        addedItems.push(`Created new Vendor entry: "${normVendor}" (Sr. No ${newSr})`);
                        data.push({ "Sr. No": String(newSr), "Vendor Name": normVendor, "Vehicle No": normVehicle || "" });
                        dataModified = true;
                    }
                }
            }
            // Case 3: only vehicle new
            else if (normVehicle && !vehicleExists) {
                let idx = -1;
                if (normVendor) idx = data.findIndex(r => isEmptyVehicle(r) && r["Vendor Name"] === normVendor);
                if (idx === -1)  idx = data.findIndex(isEmptyVehicle);
                if (idx !== -1) {
                    const srNo = data[idx]["Sr. No"];
                    const rowIndex = parseInt(srNo) + 1;
                    const exVen = data[idx]["Vendor Name"] || "";
                    const ok = await updateSourceRow(rowIndex, srNo, exVen, normVehicle);
                    if (ok) {
                        addedItems.push(`Added Vehicle "${normVehicle}" to existing row (Sr. No ${srNo})`);
                        data[idx]["Vehicle No"] = normVehicle;
                        dataModified = true;
                    }
                } else {
                    const newSr = maxSr() + 1;
                    const ok = await addRowToSourceSheet(newSr, normVendor || "", normVehicle);
                    if (ok) {
                        addedItems.push(`Created new Vehicle entry: "${normVehicle}" (Sr. No ${newSr})`);
                        data.push({ "Sr. No": String(newSr), "Vendor Name": normVendor || "", "Vehicle No": normVehicle });
                        dataModified = true;
                    }
                }
            }

            if (dataModified) {
                try {
                    localStorage.setItem(SOURCE_CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
                } catch { /* quota */ }
                updateSourceOptionsFromData(data);
            }
            return { addedItems, dataModified };
        }

        /* ======================== SMART SAVE: DESTINATION ======================== */
        async function smartSaveToDestinationSheet(pickupName, destination, existingData) {
            const addedItems = [];
            let dataModified = false;

            const normPickup = pickupName  ? String(pickupName).trim()  : "";
            const normDest   = destination ? String(destination).trim() : "";

            if (!normPickup && !normDest) return { addedItems, dataModified };

            const data = JSON.parse(JSON.stringify(existingData));
            const pickupExists = normPickup && data.some(r => r["Pickup Name"] === normPickup);
            const destExists   = normDest   && data.some(r => r["Destination"] === normDest);

            const isEmptyBoth     = r => (!r["Pickup Name"] || r["Pickup Name"] === "") && (!r["Destination"] || r["Destination"] === "");
            const isEmptyPickup   = r => (!r["Pickup Name"] || r["Pickup Name"] === "");
            const isEmptyDest     = r => (!r["Destination"] || r["Destination"] === "");

            const maxSr = () => data.reduce((m, r) => Math.max(m, parseInt(r["Sr. No"]) || 0), 0);

            // Case 1: both new
            if (normPickup && normDest && !pickupExists && !destExists) {
                const idx = data.findIndex(isEmptyBoth);
                if (idx !== -1) {
                    const srNo = data[idx]["Sr. No"];
                    const rowIndex = parseInt(srNo) + 1;
                    const ok = await updateDestinationRow(rowIndex, srNo, normPickup, normDest);
                    if (ok) {
                        addedItems.push(`Added "${normPickup}" + "${normDest}" to existing empty row (Sr. No ${srNo})`);
                        data[idx]["Pickup Name"] = normPickup;
                        data[idx]["Destination"] = normDest;
                        dataModified = true;
                    }
                } else {
                    const newSr = maxSr() + 1;
                    const ok = await addRowToDestinationSheet(newSr, normPickup, normDest);
                    if (ok) {
                        addedItems.push(`Created new entry: "${normPickup}" + "${normDest}" (Sr. No ${newSr})`);
                        data.push({ "Sr. No": String(newSr), "Pickup Name": normPickup, "Destination": normDest });
                        dataModified = true;
                    }
                }
            }
            // Case 2: only pickup new
            else if (normPickup && !pickupExists) {
                let idx = -1;
                if (normDest) idx = data.findIndex(r => isEmptyPickup(r) && r["Destination"] === normDest);
                if (idx === -1) idx = data.findIndex(isEmptyPickup);
                if (idx !== -1) {
                    const srNo = data[idx]["Sr. No"];
                    const rowIndex = parseInt(srNo) + 1;
                    const exDest = data[idx]["Destination"] || "";
                    const ok = await updateDestinationRow(rowIndex, srNo, normPickup, exDest);
                    if (ok) {
                        addedItems.push(`Added Pickup Name "${normPickup}" to existing row (Sr. No ${srNo})`);
                        data[idx]["Pickup Name"] = normPickup;
                        dataModified = true;
                    }
                } else {
                    const newSr = maxSr() + 1;
                    const ok = await addRowToDestinationSheet(newSr, normPickup, normDest || "");
                    if (ok) {
                        addedItems.push(`Created new Pickup Name entry: "${normPickup}" (Sr. No ${newSr})`);
                        data.push({ "Sr. No": String(newSr), "Pickup Name": normPickup, "Destination": normDest || "" });
                        dataModified = true;
                    }
                }
            }
            // Case 3: only destination new
            else if (normDest && !destExists) {
                let idx = -1;
                if (normPickup) idx = data.findIndex(r => isEmptyDest(r) && r["Pickup Name"] === normPickup);
                if (idx === -1) idx = data.findIndex(isEmptyDest);
                if (idx !== -1) {
                    const srNo = data[idx]["Sr. No"];
                    const rowIndex = parseInt(srNo) + 1;
                    const exPickup = data[idx]["Pickup Name"] || "";
                    const ok = await updateDestinationRow(rowIndex, srNo, exPickup, normDest);
                    if (ok) {
                        addedItems.push(`Added Destination "${normDest}" to existing row (Sr. No ${srNo})`);
                        data[idx]["Destination"] = normDest;
                        dataModified = true;
                    }
                } else {
                    const newSr = maxSr() + 1;
                    const ok = await addRowToDestinationSheet(newSr, normPickup || "", normDest);
                    if (ok) {
                        addedItems.push(`Created new Destination entry: "${normDest}" (Sr. No ${newSr})`);
                        data.push({ "Sr. No": String(newSr), "Pickup Name": normPickup || "", "Destination": normDest });
                        dataModified = true;
                    }
                }
            }

            if (dataModified) {
                try {
                    localStorage.setItem(DEST_CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
                } catch { /* quota */ }
                updateDestinationOptionsFromData(data);
            }
            return { addedItems, dataModified };
        }

        /* ======================== RENDER (STRING-BUILT DOM) ======================== */
        // OPTIMIZATION #8: build HTML as a single string, write once, delegate clicks.
        function renderTablePage1(filter = "") {
            if (!dom.tableBody) return;
            const q = filter.toLowerCase();

            const filtered = allEntries.filter(t => {
                const lr      = (t["LR No"] || "").toString().toLowerCase();
                const vendor  = (t["Vendor Name (Source)"] || "").toString().toLowerCase();
                const vehicle = (t["Vehicle No"] || "").toString().toLowerCase();
                const sr      = (t["Sr. No"] || "").toString().toLowerCase();
                return lr.includes(q) || vendor.includes(q) || vehicle.includes(q) || sr.includes(q);
            });

            if (!filtered.length) {
                dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">✨ No entries found</td></tr>';
                return;
            }

            const rowsHtml = filtered.map(t => {
                const amount = parseFloat(t["Amount"] || 0).toLocaleString();
                const date   = formatDisplayDate(t["Date"]);
                return `<tr>
                    <td><strong>${escapeHtml(t["Sr. No"] || "")}</strong></td>
                    <td>${escapeHtml(date)}</td>
                    <td>${escapeHtml(t["Vendor Name (Source)"] || "")}</td>
                    <td><span class="total-badge">₹ ${amount}</span></td>
                    <td><button class="view-action-btn" data-sr="${escapeHtml(t["Sr. No"] || "")}">👁️ View</button></td>
                </tr>`;
            }).join('');

            dom.tableBody.innerHTML = rowsHtml;
        }

        function attachTableDelegation() {
            if (!dom.tableBody) return;
            dom.tableBody.addEventListener('click', (e) => {
                const btn = e.target.closest('.view-action-btn');
                if (!btn) return;
                e.stopPropagation();
                const srVal = btn.getAttribute('data-sr');
                const found = allEntries.find(tr => String(tr["Sr. No"]) === String(srVal));
                if (found) {
                    currentViewEntry = found;
                    showPage2(found);
                }
            });

        function showPage2(entry) {
            if (!dom.detailsContainer) return;
            const fields = [
                "Sr. No", "Date", "Vendor Name (Source)", "Vehicle No",
                "Pickup Location", "Destination (Draft) Location",
                "Weight (KG)", "LR No", "Package Name", "Amount", "Note"
            ];

            const html = fields.map(f => {
                let val = entry[f] !== undefined ? entry[f] : '';
                if (f === 'Date') val = formatDisplayDate(val);
                return `<div class="detail-card">
                    <div class="detail-label">${escapeHtml(f)}</div>
                    <div class="detail-value">${escapeHtml(String(val)) || '—'}</div>

            dom.detailsContainer.innerHTML = html;
            dom.page1?.classList.remove('active-page');

            dom.page2?.classList.remove('active-page');
            dom.page1?.classList.add('active-page');

        /* ======================== REFRESH ======================== */
        // OPTIMIZATION #1: on cold start and manual refresh, wipe cache + fetch fresh.
        async function refreshAllData() {
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(SOURCE_CACHE_KEY);
            localStorage.removeItem(DEST_CACHE_KEY);
            await fetchAllSources({ skipCache: true });
            renderTablePage1(dom.searchInput?.value || "");
        }

        function findRowIndexBySrNo(sr) {
            const idx = allEntries.findIndex(t => String(t["Sr. No"]) === String(sr));
            return idx !== -1 ? idx + 2 : null;
        }

        /* ======================== DELETE ======================== */
        async function deleteCurrentEntry() {
            if (!currentViewEntry) return;
            const sr = currentViewEntry["Sr. No"];
            const rowIdx = findRowIndexBySrNo(sr);
            if (!rowIdx) { showModal("Row error", "Error"); return; }

            showModal(`⚠️ Do you want to delete Entry No ${sr}?`, "Confirm Delete", true, async () => {
                showSpinner(dom.deleteBtn, true);
                try {
                    const ok = await postToSheet({
                        action: "delete",
                        spreadsheetId: SPREADSHEET_ID,
                        sheetName: SHEET_NAME,
                        rowIndex: String(rowIdx)
                    });
                    if (ok) {
                        showModal("✅ Deleted successfully!", "Success", false, null, 1200);
                        await refreshAllData();
                        goToPage1();
                    } else {
                        showModal("Delete failed", "Error");
                    }
                } catch (err) {
                    showModal("Error: " + err.message, "Error");
                } finally {
                    showSpinner(dom.deleteBtn, false);
                }
            });
        }

                <form id="dynamicEntryForm">
                    <div class="form-grid">
                        <div class="field"><label>Date *</label><input type="date" id="editDate" value="${dateValue}" required></div>
                        <div class="field autocomplete-wrap"><label>Vendor Name (Source)</label>
                            <input type="text" id="editVendorName" value="${escapeHtml(def["Vendor Name (Source)"])}" autocomplete="off">
                            <div id="vendorAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field autocomplete-wrap"><label>Vehicle No</label>
                            <input type="text" id="editVehicleNo" value="${escapeHtml(def["Vehicle No"])}" autocomplete="off">
                            <div id="vehicleAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field autocomplete-wrap"><label>Pickup Location</label>
                            <input type="text" id="editPickupLocation" value="${escapeHtml(def["Pickup Location"])}" autocomplete="off">
                            <div id="pickupAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field autocomplete-wrap"><label>Destination (Draft) Location</label>
                            <input type="text" id="editDestination" value="${escapeHtml(def["Destination (Draft) Location"])}" autocomplete="off">
                            <div id="destAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field"><label>Weight (KG)</label><input type="number" id="editWeight" value="${escapeHtml(def["Weight (KG)"])}"></div>
                        <div class="field"><label>LR No</label><input type="number" id="editLrNo" value="${escapeHtml(def["LR No"])}"></div>
                        <div class="field"><label>Package Name</label><input type="text" id="editPackageName" value="${escapeHtml(def["Package Name"])}"></div>
                        <div class="field"><label>Amount</label><input type="number" id="editAmount" value="${escapeHtml(def["Amount"])}"></div>
                        <div class="field fullwidth"><label>Note</label><textarea id="editNote" rows="3">${escapeHtml(def["Note"])}</textarea></div>
                    </div>
                    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1.5rem;">
                        <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                        <button type="submit" id="saveUpdateBtn" class="btn btn-primary">${isEdit ? "💾 Update Entry" : "💾 Save Entry"}</button>
                    </div>
                </form>
            `;
        }

        /* ======================== AUTOCOMPLETE ======================== */
        // OPTIMIZATION #5: debounce the input handler (180 ms) + single delegated click.
        function setupAutocomplete(inputId, listId, optionsArray) {
            const input  = document.getElementById(inputId);
            const listEl = document.getElementById(listId);
            if (!input || !listEl) return;

            let debounceId = null;

            function render(filterVal = '') {
                const term = filterVal.toLowerCase();
                const filtered = term
                    ? optionsArray.filter(o => o.toLowerCase().includes(term))
                    : optionsArray;

                if (!filtered.length) { listEl.style.display = 'none'; return; }

                listEl.innerHTML = filtered.map(opt =>
                    `<div class="autocomplete-item" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`
                ).join('');
                listEl.style.display = 'block';
            }

            input.addEventListener('input', (e) => {
                if (debounceId) clearTimeout(debounceId);
                debounceId = setTimeout(() => render(e.target.value), 180);
            });
            input.addEventListener('focus', () => render(input.value));
            input.addEventListener('blur',  () => setTimeout(() => listEl.style.display = 'none', 180));

            listEl.addEventListener('click', (e) => {
                const item = e.target.closest('.autocomplete-item');
                if (!item) return;
                input.value = item.getAttribute('data-value');
                listEl.style.display = 'none';
                input.dispatchEvent(new Event('input', { bubbles: true }));
            });

            document.addEventListener('click', (e) => {
                if (!listEl.contains(e.target) && e.target !== input) listEl.style.display = 'none';
            });
        }

        function attachFormEvents(isEdit, rowIdx) {
            const form = document.getElementById('dynamicEntryForm');
            if (form) form.onsubmit = (e) => handleFormSubmit(e, isEdit, rowIdx);
            document.getElementById('cancelFormBtn')?.addEventListener('click', () =>
                dom.formModal?.classList.remove('active'));
        }

        /* ======================== FORM SUBMIT ======================== */
        async function handleFormSubmit(e, isEdit, rowIdx) {
            e.preventDefault();
            if (saveInProgress) return;
            saveInProgress = true;

            const dateInput = document.getElementById('editDate');
            if (dateInput) dateInput.blur();

            const saveBtn = document.getElementById('saveUpdateBtn');
            showSpinner(saveBtn, true);

            const dateValue = dateInput?.value || "";
            if (!dateValue || !/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                showModal('❌ Date is required and must be valid.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            const [year, month, day] = dateValue.split('-');
            const testDate = new Date(year, month - 1, day);
            if (isNaN(testDate.getTime()) ||
                testDate.getFullYear() != year ||
                testDate.getMonth() + 1 != month ||
                testDate.getDate() != day) {
                showModal('❌ Invalid date. Please select a valid date.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }

            const formData = {
                vendorName:      document.getElementById('editVendorName')?.value || "",
                vehicleNo:       document.getElementById('editVehicleNo')?.value || "",
                pickupLocation:  document.getElementById('editPickupLocation')?.value || "",
                destination:     document.getElementById('editDestination')?.value || "",
                weight:          document.getElementById('editWeight')?.value || "0",
                lrNo:            document.getElementById('editLrNo')?.value || "",
                packageName:     document.getElementById('editPackageName')?.value || "",
                amount:          document.getElementById('editAmount')?.value || "0",
                note:            document.getElementById('editNote')?.value || ""
            };

            const params = new URLSearchParams();
            params.append("action", isEdit ? "update" : "insert");
            params.append("spreadsheetId", SPREADSHEET_ID);
            params.append("sheetName", SHEET_NAME);
            if (isEdit && rowIdx) params.append("rowIndex", rowIdx);
            params.append("Date", dateValue);
            params.append("Vendor Name (Source)", formData.vendorName);
            params.append("Vehicle No", formData.vehicleNo);
            params.append("Pickup Location", formData.pickupLocation);
            params.append("Destination (Draft) Location", formData.destination);
            params.append("Weight (KG)", formData.weight);
            params.append("LR No", formData.lrNo);
            params.append("Package Name", formData.packageName);
            params.append("Amount", formData.amount);
            params.append("Note", formData.note);

            try {
                const controller = new AbortController();
                const timeoutId  = setTimeout(() => controller.abort(), 30000);

                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString(),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const result = await response.json();

                if (result.status === "success") {
                    // OPTIMIZATION #6: run Source & Destination smart-saves in PARALLEL.
                    let sourceMsg = "";
                    let destMsg   = "";

                    const tasks = [];

                    if (formData.vendorName || formData.vehicleNo) {
                        tasks.push((async () => {
                            try {
                                const existing = await fetchExistingSourceData(true);
                                const r = await smartSaveToSourceSheet(formData.vendorName, formData.vehicleNo, existing);
                                if (r.addedItems.length > 0) sourceMsg = `<br><br>📌 Source: ${r.addedItems.join('<br>')}`;
                            } catch (err) {
                                console.error('Source save error:', err);
                                sourceMsg = `<br><br>⚠️ Note: Entry saved, but Source sheet update failed.`;
                            }
                        })());
                    }

                    if (formData.pickupLocation || formData.destination) {
                        tasks.push((async () => {
                            try {
                                const existing = await fetchExistingDestinationData(true);
                                const r = await smartSaveToDestinationSheet(formData.pickupLocation, formData.destination, existing);
                                if (r.addedItems.length > 0) destMsg = `<br><br>📌 Destination: ${r.addedItems.join('<br>')}`;
                            } catch (err) {
                                console.error('Destination save error:', err);
                                destMsg = `<br><br>⚠️ Note: Entry saved, but Destination sheet update failed.`;
                            }
                        })());
                    }

                    await Promise.all(tasks);

                    showModal(`${isEdit ? "✅ Entry updated" : "✅ Entry saved"} successfully!${sourceMsg}${destMsg}`, "Success", false, null, 3000);

                    // OPTIMIZATION: skip the 500 ms delay — modal close + refresh can happen immediately.
                    dom.formModal?.classList.remove('active');
                    await refreshAllData();
                    goToPage1();
                } else {
                    showModal("❌ Error: " + (result.message || "Unknown error"), "Error");
                }
            } catch (err) {
                console.error('Save error:', err);
                if (err.name === 'AbortError') {
                    showModal("❌ Request timeout. Please check your internet connection and try again.", "Error");
                } else {
                    showModal("❌ Error: " + err.message, "Error");
                }
            } finally {
                saveInProgress = false;
                showSpinner(saveBtn, false);
            }
        }

        /* ======================== MODAL OPENERS ======================== */
        async function openAddModal() {
            if (!dom.formModalBody) return;
            dom.formModalBody.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;">Loading form...</p></div>';
            dom.formModal.classList.add('active');
            dom.formModalTitle.textContent = "➕ Add New Entry";
            dom.formModalBody.innerHTML = buildFormHtml(null, false);
            // OPTIMIZATION: rAF instead of setTimeout — runs after paint, no artificial 20 ms delay.
            requestAnimationFrame(() => {
                setupAutocomplete('editVendorName',     'vendorAutoList',  sourceOptions);
                setupAutocomplete('editVehicleNo',      'vehicleAutoList', vehicleOptions);
                setupAutocomplete('editPickupLocation', 'pickupAutoList',  pickupOptions);
                setupAutocomplete('editDestination',    'destAutoList',    destinationOptions);
                attachFormEvents(false, null);
            });
        }

        async function openEditModal() {
            if (!currentViewEntry || !dom.formModalBody) return;
            const rowIdx = findRowIndexBySrNo(currentViewEntry["Sr. No"]);
            if (!rowIdx) { showModal("Row error", "Error"); return; }
            dom.formModalBody.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;">Loading edit form...</p></div>';
            dom.formModal.classList.add('active');
            dom.formModalTitle.textContent = "✏️ Edit Entry";
            dom.formModalBody.innerHTML = buildFormHtml(currentViewEntry, true);
            requestAnimationFrame(() => {
                setupAutocomplete('editVendorName',     'vendorAutoList',  sourceOptions);
                setupAutocomplete('editVehicleNo',      'vehicleAutoList', vehicleOptions);
                setupAutocomplete('editPickupLocation', 'pickupAutoList',  pickupOptions);
                setupAutocomplete('editDestination',    'destAutoList',    destinationOptions);
                attachFormEvents(true, rowIdx);
            });
        }

        /* ======================== INIT ======================== */
        async function fastInit() {
            cacheDomElements();
            attachTableDelegation();

            // OPTIMIZATION #1: cold start always fetches fresh (skip cache).
            // OPTIMIZATION #6: parallel fetch of entries + source + destination.
            try {
                await fetchAllSources({ skipCache: true });
            } catch (err) {
                console.error("Initial load failed:", err);
                if (dom.tableBody) {
                    dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger);">⚠️ Failed to load data. Tap Refresh.</td></tr>';
                }
            }
            renderTablePage1("");

            // Consolidated refresh handler for desktop + mobile buttons.
            // OPTIMIZATION: single async function, no duplicate logic.
            const doRefresh = async (btn) => {
                showSpinner(btn, true);
                try { await refreshAllData(); }
                catch (err) { showModal("❌ Refresh failed: " + err.message, "Error"); }
                finally { showSpinner(btn, false); }
            };
            dom.refreshBtn?.addEventListener('click',       () => doRefresh(dom.refreshBtn));
            dom.mobileRefreshBtn?.addEventListener('click', () => doRefresh(dom.mobileRefreshBtn));

            dom.addNewBtn?.addEventListener('click', openAddModal);
            dom.mobileAddBtn?.addEventListener('click', () => dom.addNewBtn?.click());

            dom.backBtn?.addEventListener('click', goToPage1);
            dom.editBtn?.addEventListener('click', openEditModal);
            dom.deleteBtn?.addEventListener('click', deleteCurrentEntry);

            // OPTIMIZATION #5: debounce search input (250 ms).
            dom.searchInput?.addEventListener('input', (e) => {
                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => renderTablePage1(e.target.value), 250);
            });

            document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal?.classList.remove('active'));
            document.getElementById('closeFormModalBtn')?.addEventListener('click', () => dom.formModal?.classList.remove('active'));

            window.addEventListener('click', (e) => {
                if (e.target.classList?.contains('modal-overlay')) e.target.classList.remove('active');
            });
        }

        // `defer` guarantees DOM is ready before this runs.
        fastInit();
    </script>
</body>
