<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="description" content="GST Tax Invoice — Universal English Medium High School">
    <title>🧾 GST Tax Invoice | Universal English Medium High School</title>

    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://script.google.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <!-- CRITICAL CSS -->
    <style id="critical-css">
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#f0f6ff;color:#0f172a;-webkit-font-smoothing:antialiased}
        #appLoading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f0f6ff;z-index:9999;flex-direction:column;gap:1.5rem}
        #appLoading.hidden{display:none!important}
        #appLoading .spinner{width:50px;height:50px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
        #appLoading p{color:#475569;font-weight:500;font-size:.9rem}
        @keyframes spin{to{transform:rotate(360deg)}}
        [data-theme="dark"] #appLoading{background:#0a1a3a}
        [data-theme="dark"] #appLoading .spinner{border-color:#1e3a8a;border-top-color:#facc15}
        [data-theme="dark"] #appLoading p{color:#facc15}
        #mainContent{display:none}
        #mainContent.visible{display:block}
        *{scrollbar-width:none;-ms-overflow-style:none}
        *::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
        html,body{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
    </style>

    <!-- FULL STYLESHEET -->
    <style id="main-css" media="print" onload="this.media='all'">
        :root {
            --bg-body: #f0f6ff;
            --bg-body-gradient:
                radial-gradient(1200px 600px at 10% -10%, rgba(37, 99, 235, 0.08), transparent 60%),
                radial-gradient(900px 500px at 110% 20%, rgba(37, 99, 235, 0.06), transparent 55%),
                #f0f6ff;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #1e40af;
            --text-light: #3b82f6;
            --border-color: #dbeafe;
            --border-light: #e8f0fc;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #60a5fa;
            --primary-soft: #eff6ff;
            --primary-soft-2: #dbeafe;
            --accent: #eab308;
            --accent-soft: rgba(234, 179, 8, 0.12);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #06b6d4;
            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --gradient-header: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            --table-header-bg: #eff6ff;
            --table-row-hover: #f5f9ff;
            --table-border: #e0eaff;
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
        }
        [data-theme="dark"] {
            --bg-body: #0a1a3a;
            --bg-body-gradient:
                radial-gradient(1200px 600px at 10% -10%, rgba(37, 99, 235, 0.22), transparent 60%),
                radial-gradient(900px 500px at 110% 20%, rgba(250, 204, 21, 0.10), transparent 55%),
                #0a1a3a;
            --bg-card: #10254a;
            --bg-header: #10254a;
            --text-main: #ffffff;
            --text-secondary: #facc15;
            --text-light: #e5e7eb;
            --border-color: #1e3a8a;
            --border-light: #1a2f66;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.4);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.6);
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --primary-soft-2: rgba(59, 130, 246, 0.25);
            --accent: #facc15;
            --accent-soft: rgba(250, 204, 21, 0.15);
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --info: #22d3ee;
            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            --gradient-header: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            --table-header-bg: #142b56;
            --table-row-hover: #183468;
            --table-border: #1e3a8a;
        }

        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
        @keyframes modalPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        body{
            background: var(--bg-body-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px;
            transition: background-color var(--transition-normal), color var(--transition-normal);
        }
        #mainContent.visible{animation: fadeIn .4s ease-out}
        .app-container{max-width: 1400px; margin: 0 auto}

        .card-header{
            background: var(--bg-header);
            border-radius: 20px;
            padding: 1.2rem 1.6rem;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 10px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            contain: layout style;
        }
        .card-header::before{
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }
        [data-theme="dark"] .card-header::before{
            background: linear-gradient(90deg, #2563eb, #facc15, #2563eb);
        }
        .header-title-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
        .card-header h2{
            font-size: 1.5rem; font-weight: 800;
            color: var(--primary-dark);
            display: flex; align-items: center; gap: 10px;
            min-width: 0; line-height: 1.2;
        }
        .card-header h2 i{
            color: #fff;
            background: var(--gradient-primary);
            padding: 8px; border-radius: 12px;
            font-size: 1rem; flex-shrink: 0;
        }
        [data-theme="dark"] .card-header h2{color:#facc15;text-shadow:0 1px 2px rgba(0,0,0,0.4)}
        [data-theme="dark"] .card-header h2 i{background:linear-gradient(135deg,#facc15,#eab308);color:#1e3a8a}
        .card-header h2 .title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .header-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0}

        .btn-back{
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px; border-radius: 60px;
            font-weight: 600; font-size: .82rem; cursor: pointer;
            transition: transform var(--transition-fast), background-color var(--transition-fast);
            background: var(--primary); border: 2px solid var(--primary); color: #fff;
            white-space: nowrap; font-family: inherit; flex-shrink: 0;
            min-height: 38px;
        }
        .btn-back:hover{background:var(--primary-dark);border-color:var(--primary-dark);transform:translateX(-2px)}
        .btn-back i{transition:transform var(--transition-fast)}
        .btn-back:hover i{transform:translateX(-3px)}
        [data-theme="dark"] .btn-back{background:#facc15;border-color:#facc15;color:#1e3a8a}
        [data-theme="dark"] .btn-back:hover{background:#eab308;border-color:#eab308}

        .soft-card{
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: 20px;
            contain: layout style;
        }
        .search-section{
            padding: 1.2rem 1.6rem;
            border-bottom: 1px solid var(--border-color);
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            background: var(--primary-soft);
        }
        [data-theme="dark"] .search-section{background:rgba(59,130,246,0.08)}
        .search-wrapper{flex:1;min-width:200px}
        .search-wrapper input{
            width: 100%; padding: 12px 20px;
            border: 2px solid var(--border-color); border-radius: 60px;
            background: var(--bg-card); color: var(--text-main);
            font-size: .9rem; font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .search-wrapper input::placeholder{color:var(--text-light)}
        .search-wrapper input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.1)}
        [data-theme="dark"] .search-wrapper input{background:#0a1a3a;color:#ffffff;border-color:#1e3a8a}
        [data-theme="dark"] .search-wrapper input:focus{border-color:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.15)}
        [data-theme="dark"] .search-wrapper input::placeholder{color:#94a3b8}

        .btn{
            border: none; padding: 10px 20px; border-radius: 60px;
            font-weight: 600; font-size: .85rem; cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; text-decoration: none; white-space: nowrap;
            min-height: 40px; will-change: transform;
        }
        .btn-primary{background:var(--gradient-primary);color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px -6px rgba(37,99,235,.6)}
        [data-theme="dark"] .btn-primary:hover{box-shadow:0 10px 24px -6px rgba(250,204,21,.35)}
        .btn-outline{background:#fff;border:2px solid var(--primary);color:var(--primary)}
        .btn-outline:hover{background:var(--primary);color:#fff;transform:translateY(-2px)}
        [data-theme="dark"] .btn-outline{background:transparent;border-color:#facc15;color:#facc15}
        [data-theme="dark"] .btn-outline:hover{background:#facc15;color:#1e3a8a}
        .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
        .btn-danger:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
        .btn-sm{padding:6px 14px;font-size:.75rem;min-height:34px}
        .btn:disabled{opacity:.6;cursor:not-allowed;transform:none !important}

        .table-wrapper{overflow-x:auto;overflow-y:visible;padding:0;-webkit-overflow-scrolling:touch}
        .data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.875rem;min-width:480px}
        .data-table th{
            text-align: left; padding: 14px 18px;
            background: var(--table-header-bg); color: var(--primary-dark);
            font-weight: 800; font-size: .75rem;
            text-transform: uppercase; letter-spacing: .6px;
            border-bottom: 2px solid var(--primary); white-space: nowrap;
            position: sticky; top: 0; z-index: 2;
        }
        .data-table td{
            padding: 14px 18px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-main); font-size: .9rem;
            transition: background-color var(--transition-fast);
        }
        .data-table tr:hover td{background:var(--table-row-hover)}
        .data-table .sr-col{width:60px;text-align:center;font-weight:700;color:var(--text-secondary)}
        .data-table .action-col{width:100px;text-align:center;white-space:nowrap}
        [data-theme="dark"] .data-table th{color:#facc15;border-bottom-color:#facc15}
        [data-theme="dark"] .data-table td{color:#ffffff}
        [data-theme="dark"] .data-table .sr-col{color:#cbd5e1}

        .view-action-btn{
            background: var(--gradient-primary); color: #fff;
            border: none; padding: 6px 14px; border-radius: 30px;
            font-size: .72rem; font-weight: 600; cursor: pointer;
            transition: transform var(--transition-fast), filter var(--transition-fast);
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .view-action-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}

        .skeleton-row td{padding:16px 18px}
        .skeleton{
            background: linear-gradient(90deg,
                var(--border-color) 25%,
                var(--primary-soft) 50%,
                var(--border-color) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s linear infinite;
            border-radius: 8px; height: 16px;
        }
        .skeleton.sm{width:60%}
        .skeleton.md{width:80%}
        .skeleton.lg{width:95%}

        .mobile-buttons{display:none;gap:10px;margin-top:10px;width:100%}
        .mobile-buttons .btn{flex:1;justify-content:center}

        .modal-overlay{
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, .5);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            visibility: hidden; opacity: 0;
            transition: opacity var(--transition-normal), visibility var(--transition-normal);
            padding: 16px;
        }
        .modal-overlay.active{visibility:visible;opacity:1}
        .modal-box{
            background: var(--bg-card);
            width: 100%; max-width: 1180px; max-height: 92vh;
            border-radius: 24px;
            overflow-y: auto; overflow-x: hidden;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
            -webkit-overflow-scrolling: touch;
            transform: scale(.94);
            transition: transform var(--transition-normal);
            will-change: transform;
        }
        .modal-overlay.active .modal-box{animation:modalPop .28s cubic-bezier(.34,1.56,.64,1) forwards}
        [data-theme="dark"] .modal-box{background:#10254a;border-color:#1e3a8a}
        .modal-header{
            background: var(--gradient-header);
            padding: 1.1rem 1.4rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 10;
            color: #fff; gap: 10px;
        }
        .modal-header h3{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0;flex:1}
        .modal-header h3 i{flex-shrink:0}
        [data-theme="dark"] .modal-header{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%)}
        [data-theme="dark"] .modal-header h3{color:#facc15}
        .close-modal{
            background: rgba(255, 255, 255, .2); border: none;
            width: 32px; height: 32px; border-radius: 50%;
            font-size: 1.3rem; cursor: pointer; color: #fff;
            transition: transform var(--transition-fast), background-color var(--transition-fast);
            line-height: 1; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .close-modal:hover{transform:rotate(90deg);background:rgba(255,255,255,.3)}
        [data-theme="dark"] .close-modal{color:#facc15;background:rgba(250,204,21,.15)}
        [data-theme="dark"] .close-modal:hover{background:rgba(250,204,21,.3)}
        .modal-body{padding:1.4rem}

        .form-grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .field{display:flex;flex-direction:column;gap:6px}
        .field label{
            font-size: .7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .5px;
            color: var(--primary-dark);
        }
        .field input,
        .field select,
        .field textarea{
            padding: 11px 14px; border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-card); color: var(--text-main);
            font-size: .9rem; font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            width: 100%;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.1)}
        .field input::placeholder,
        .field textarea::placeholder{color:var(--text-light)}
        .field input[readonly],
        .field input[disabled]{
            background: var(--primary-soft);
            cursor: not-allowed;
            color: var(--text-secondary);
            font-weight: 700;
        }
        [data-theme="dark"] .field label{color:#facc15}
        [data-theme="dark"] .field input,
        [data-theme="dark"] .field select,
        [data-theme="dark"] .field textarea{background:#0a1a3a;color:#ffffff;border-color:#1e3a8a}
        [data-theme="dark"] .field input:focus,
        [data-theme="dark"] .field select:focus,
        [data-theme="dark"] .field textarea:focus{border-color:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.15)}
        [data-theme="dark"] .field input::placeholder,
        [data-theme="dark"] .field textarea::placeholder{color:#94a3b8}
        [data-theme="dark"] .field input[readonly],
        [data-theme="dark"] .field input[disabled]{background:rgba(250,204,21,0.06);color:#facc15}
        .field .hint{color:var(--text-light);font-size:.7rem;margin-top:2px}
        [data-theme="dark"] .field .hint{color:#94a3b8}
        .fullwidth{grid-column:1 / -1}

        .form-section-title{
            grid-column: 1 / -1;
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-dark);
            padding: 4px 0 2px;
            border-bottom: 1px dashed var(--border-color);
            margin-top: 6px;
            display: flex; align-items: center; gap: 8px;
        }
        [data-theme="dark"] .form-section-title{color:#facc15;border-bottom-color:#1e3a8a}

        /* ================================================================
           SERVICES TABLE (horizontal)
           ================================================================ */
        .services-wrap{
            grid-column: 1 / -1;
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            -webkit-overflow-scrolling: touch;
        }
        [data-theme="dark"] .services-wrap{border-color:#1e3a8a}

        .services-table{
            width: 100%;
            min-width: 780px;
            border-collapse: separate;
            border-spacing: 0;
            font-size: .85rem;
        }
        .services-table thead th{
            background: var(--table-header-bg);
            color: var(--primary-dark);
            font-weight: 800;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .6px;
            padding: 12px 10px;
            text-align: left;
            border-bottom: 2px solid var(--primary);
            white-space: nowrap;
            position: sticky; top: 0; z-index: 2;
        }
        [data-theme="dark"] .services-table thead th{
            background:#142b56;color:#facc15;border-bottom-color:#facc15;
        }
        .services-table tbody td{
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        [data-theme="dark"] .services-table tbody td{border-bottom-color:#1e3a8a}
        .services-table tbody tr:last-child td{border-bottom: none}
        .services-table tbody tr:hover td{background: var(--table-row-hover)}
        [data-theme="dark"] .services-table tbody tr:hover td{background:#183468}

        .services-table .col-sr{width: 60px; text-align: center; font-weight: 800; color: var(--text-secondary)}
        .services-table .col-desc{min-width: 200px}
        .services-table .col-hsn{width: 130px}
        .services-table .col-qty{width: 110px}
        .services-table .col-rate{width: 120px}
        .services-table .col-amt{width: 140px}
        .services-table .col-act{width: 60px; text-align: center}
        [data-theme="dark"] .services-table .col-sr{color:#cbd5e1}

        .services-table input{
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: .85rem;
            font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .services-table input:focus{
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }
        .services-table input[readonly],
        .services-table input[disabled]{
            background: var(--primary-soft);
            color: var(--primary-dark);
            font-weight: 700;
            cursor: not-allowed;
            text-align: right;
        }
        [data-theme="dark"] .services-table input{
            background:#0a1a3a;color:#fff;border-color:#1e3a8a;
        }
        [data-theme="dark"] .services-table input:focus{
            border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,.15);
        }
        [data-theme="dark"] .services-table input[readonly],
        [data-theme="dark"] .services-table input[disabled]{
            background:rgba(250,204,21,0.08);color:#facc15;
        }

        .remove-service-btn{
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            width: 28px; height: 28px;
            border-radius: 50%;
            font-size: .72rem;
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }
        .remove-service-btn:hover{background:var(--danger);color:#fff}

        .add-service-wrap{
            grid-column: 1 / -1;
            display: flex; justify-content: center;
            margin-top: 12px;
        }
        .add-service-btn{
            background: transparent;
            border: 2px dashed var(--primary);
            color: var(--primary);
            border-radius: 60px;
            padding: 9px 22px;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;

const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const HTML_ESCAPE_REGEX = /[&<>"']/g;
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(HTML_ESCAPE_REGEX, m => HTML_ESCAPES[m]);
}

function showToast(msg, type = 'info') {
    const box = document.getElementById('alertBox');
    const txt = document.getElementById('alertText');
    const icon = box.firstElementChild;
    if (!box || !txt) return;
    txt.textContent = msg;
    box.className = `alert-popup ${type} show`;
    const iconMap = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    icon.className = `fas ${iconMap[type] || iconMap.info}`;
    if (box._timeout) clearTimeout(box._timeout);
    box._timeout = setTimeout(() => box.classList.remove('show'), 3000);
}

function showModal(msg, title = "Notice", isConfirm = false, onConfirm = null, confirmText = "OK") {
    const modal = document.getElementById('globalModal');
    document.getElementById('modalTitle').innerHTML =
        `<i class="fas ${isConfirm ? 'fa-exclamation-triangle' : 'fa-info-circle'}" aria-hidden="true"></i> ${title}`;
    document.getElementById('modalMsg').innerHTML = msg;
    const confirmBtn = document.getElementById('confirmModalBtn');
    const cancelBtn  = document.getElementById('cancelModalBtn');
    confirmBtn.textContent = confirmText;
    if (isConfirm) {
        cancelBtn.style.display = 'inline-flex';
        cancelBtn.onclick = () => modal.classList.remove('active');
    } else {
        cancelBtn.style.display = 'none';
    }
    confirmBtn.onclick = () => {
        modal.classList.remove('active');
        if (isConfirm && onConfirm) onConfirm();
    };
    modal.classList.add('active');
}

function debounce(fn, wait = 250) {
    let timer = null;
    return function(...args) {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { timer = null; fn.apply(this, args); }, wait);
    };
}

const scheduleIdle = window.requestIdleCallback
    ? (fn) => window.requestIdleCallback(fn, { timeout: 1500 })
    : (fn) => setTimeout(fn, 1);

function showSpinner(el, show, customHtml = null) {
    if (!el) return;
    if (show) {
        el.disabled = true;
        if (!el.hasAttribute('data-original')) el.setAttribute('data-original', el.innerHTML);
        el.innerHTML = customHtml || '<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;"></span>';
    } else {
        el.disabled = false;
        const orig = el.getAttribute('data-original');
        if (orig) { el.innerHTML = orig; el.removeAttribute('data-original'); }
    }
}

function formatDateDDMMYYYY(input) {
    if (!input) return '';
    if (typeof input === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(input.trim())) {
        return input.trim();
    }
    let d;
    if (typeof input === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(input)) {
        const [y, m, dd] = input.split('-').map(Number);
        d = new Date(y, m - 1, dd);
    } else {
        d = new Date(input);
    }
    if (isNaN(d)) return '';
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = d.getFullYear();
    return `${dd}/${mm}/${yy}`;
}

function formatDateDDMMMYY(input) {
    if (!input) return '';
    let d;
    if (typeof input === 'string') {
        const s = input.trim();
        let m;
        if ((m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/))) {
            d = new Date(+m[3], +m[2] - 1, +m[1]);
        } else if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) {
            d = new Date(+m[1], +m[2] - 1, +m[3]);
        } else {
            d = new Date(s);
        }
    } else {
        d = new Date(input);
    }
    if (isNaN(d)) return '';
    const dd = String(d.getDate()).padStart(2, '0');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const mmm = months[d.getMonth()];
    const yy = String(d.getFullYear()).slice(-2);
    return `${dd}-${mmm}-${yy}`;
}

function ddmmyyyyToInputDate(s) {
    if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return '';
    return `${m[3]}-${m[2]}-${m[1]}`;
}

function todayInputDate() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const INR_FORMATTER = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function formatINR(n) {
    const v = parseFloat(n);
    if (isNaN(v)) return '0.00';
    return INR_FORMATTER.format(v);
}

/* ── Number to Words (Indian numbering) ── */
function numberToWordsIndian(num) {
    num = Math.round((parseFloat(num) || 0) * 100) / 100;
    const rupees = Math.floor(num);
    const paise  = Math.round((num - rupees) * 100);

    const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
                  'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen',
                  'Seventeen','Eighteen','Nineteen'];
    const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

    const twoDigits = (n) => {
        if (n < 20) return ones[n];
        const t = Math.floor(n / 10);
        const o = n % 10;
        return tens[t] + (o ? ' ' + ones[o] : '');
    };
    const threeDigits = (n) => {
        const h = Math.floor(n / 100);
        const r = n % 100;
        let s = '';
        if (h) s += ones[h] + ' Hundred';
        if (r) s += (h ? ' ' : '') + twoDigits(r);
        return s;
    };

    const toWords = (n) => {
        if (n === 0) return 'Zero';
        let out = '';
        const crore = Math.floor(n / 10000000);
        const lakh  = Math.floor((n % 10000000) / 100000);
        const thou  = Math.floor((n % 100000) / 1000);
        const rest  = n % 1000;

        if (crore) out += threeDigits(crore) + ' Crore ';
        if (lakh)  out += threeDigits(lakh)  + ' Lakh ';
        if (thou)  out += threeDigits(thou)  + ' Thousand ';
        if (rest)  out += threeDigits(rest);

        return out.trim();
    };

    let words = '';
    if (rupees > 0) words += toWords(rupees) + ' Rupees';
    else            words += 'Zero Rupees';
    if (paise > 0)  words += ' and ' + twoDigits(paise) + ' Paise';
    return words + ' Only';
}

/* =====================================================================
   SECTION 5 — CACHE
   ===================================================================== */

function getCache(key = CACHE_KEY) {
    try {
        const raw = sessionStorage.getItem(key);
        if (!raw) return null;
        const { data, ts } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) {
            sessionStorage.removeItem(key);
            return null;
        }
        return data;
    } catch (e) { return null; }
}

function setCache(data, key = CACHE_KEY) {
    try {
        sessionStorage.setItem(key, JSON.stringify({ data, ts: Date.now() }));
    } catch (e) {
        try { sessionStorage.removeItem(key); } catch (_) {}
    }
}

function invalidateCache(key = CACHE_KEY) {
    try { sessionStorage.removeItem(key); } catch (e) {}
}

function renderSkeleton(rows = 5) {
    let html = '';
    for (let i = 0; i < rows; i++) {
        const w1 = i % 2 ? 'md' : 'sm';
        const w2 = i % 2 ? 'lg' : 'md';
        html += `<tr class="skeleton-row">` +
            `<td><div class="skeleton sm"></div></td>` +
            `<td><div class="skeleton ${w2}"></div></td>` +
            `<td><div class="skeleton ${w1}"></div></td>` +
            `<td><div class="skeleton sm"></div></td>` +
            `</tr>`;
    }
    return html;
}

/* =====================================================================
   SECTION 8 — DATA FETCHING: INVOICES
   ===================================================================== */

async function loadInvoices(options = {}) {
    const { forceRefresh = false, silent = false } = options;
    if (isFetching && !forceRefresh) return;

    const tbody = document.getElementById('tableBody');

    if (!forceRefresh) {
        const cached = getCache();
        if (cached && Array.isArray(cached)) {
            allInvoices = cached.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            renderTable();
            lastFetchTime = Date.now();
            scheduleIdle(() => silentRefresh());
            return;
        }
    }

    if (!silent) tbody.innerHTML = renderSkeleton(6);
    isFetching = true;

    if (activeFetchController) activeFetchController.abort();
    activeFetchController = new AbortController();

    try {
        const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}` +
                    `&sheetName=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
        const response = await fetch(url, {
            signal: activeFetchController.signal,
            cache: 'default'
        });
        const result = await response.json();

        if (result.status === 'success' && Array.isArray(result.data)) {
            allInvoices = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(result.data);
            lastFetchTime = Date.now();
            renderTable();
        } else {
            throw new Error(result.message || 'Failed to load data');
        }
    } catch (err) {
        if (err.name === 'AbortError') { isFetching = false; return; }
        console.error('Load error:', err);
        tbody.innerHTML = `
            <tr><td colspan="4">
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
                    <p>Failed to load invoices</p>
                    <p class="sub-text">${escapeHtml(err.message)}</p>
                    <button class="btn btn-primary btn-sm" data-retry="1" style="margin-top:12px;">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            </td></tr>`;
        if (!silent) showToast('❌ Failed to load invoices', 'error');
    } finally {
        isFetching = false;
    }
}

async function silentRefresh() {
    if (isFetching) return;
    if (Date.now() - lastFetchTime < CACHE_TTL) return;
    try {
        const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}` +
                    `&sheetName=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();
        if (result.status === 'success' && Array.isArray(result.data)) {
            const newHash = JSON.stringify(result.data);
            const oldHash = JSON.stringify(allInvoices.map(i => {
                const { _rowIndex, ...rest } = i;
                return rest;
            }));
            if (newHash !== oldHash) {
                allInvoices = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
                setCache(result.data);
                renderTable();
                lastFetchTime = Date.now();
                console.log('🔄 Background refresh updated invoices');
            } else {
                lastFetchTime = Date.now();
            }
        }
    } catch (err) {
        console.log('Background refresh skipped:', err.message);
    }
}

/* =====================================================================
   SECTION 9 — PARTY OPTIONS
   ===================================================================== */

async function loadPartyOptions(options = {}) {
    const { forceRefresh = false } = options;

    if (!forceRefresh) {
        const cached = getCache(PARTY_CACHE_KEY);
        if (Array.isArray(cached) && cached.length) {
            partyOptions = cached;
            return;
        }
    }

    try {
        const url = `${SCRIPT_URL}?spreadsheetId=${SOURCE_SPREADSHEET_ID}` +
                    `&sheetName=${encodeURIComponent(PARTY_SHEET_NAME)}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status !== 'success' || !Array.isArray(result.data)) {
            console.warn('Party_Address fetch failed:', result.message);
            partyOptions = [];
            return;
        }

        const rows = result.data;
        if (!rows.length) { partyOptions = []; return; }

        const headers = Object.keys(rows[0] || {});
        const findKey = (exact) => headers.find(h =>
            String(h).toLowerCase().replace(/[\s._-]/g, '') === exact.toLowerCase().replace(/[\s._-]/g, '')
        );
        const partyKey = findKey('Party Name');
        const cgstKey  = findKey('CGST (%)')  || findKey('CGST');
        const sgstKey  = findKey('SGST (%)')  || findKey('SGST');
        const igstKey  = findKey('IGST (%)')  || findKey('IGST');

        if (!partyKey) {
            console.warn('"Party Name" header not found. Headers:', headers);
            partyOptions = [];
            return;
        }

        const seen = new Set();
        const list = [];
        for (const row of rows) {
            const raw = row[partyKey];
            if (raw === null || raw === undefined) continue;
            const name = String(raw).trim();
            if (!name) continue;
            const key = name.toLowerCase();
            if (seen.has(key)) continue;
            seen.add(key);

            const toNumOrNull = (v) => {
                if (v === null || v === undefined || String(v).trim() === '') return null;
                const n = parseFloat(v);
                return isNaN(n) ? null : n;
            };

            list.push({
                name,
                cgst: cgstKey ? toNumOrNull(row[cgstKey]) : null,
                sgst: sgstKey ? toNumOrNull(row[sgstKey]) : null,
                igst: igstKey ? toNumOrNull(row[igstKey]) : null
            });
        }
        list.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

        partyOptions = list;
        setCache(list, PARTY_CACHE_KEY);
        console.log(`✅ Loaded ${list.length} party option(s)`);
    } catch (err) {
        console.warn('Party options fetch failed:', err.message);
    }
}

function buildPartySelectOptions(selectedName = '') {
    let html = `<option value="">-- Select Party --</option>`;
    for (const p of partyOptions) {
        const sel = (p.name === selectedName) ? ' selected' : '';
        html += `<option value="${escapeHtml(p.name)}"${sel}>${escapeHtml(p.name)}</option>`;
    }
    return html;
}

/* =====================================================================
   SECTION 10 — YASH TRANSPORT RECORDS
   ===================================================================== */

async function loadYashRecords(options = {}) {
    const { forceRefresh = false } = options;

    if (!forceRefresh) {
        const cached = getCache(YASH_CACHE_KEY);
        if (Array.isArray(cached)) {
            yashRecords = cached;
            return;
        }
    }

    try {
        const url = `${SCRIPT_URL}?spreadsheetId=${SOURCE_SPREADSHEET_ID}` +
                    `&sheetName=${encodeURIComponent(YASH_SHEET_NAME)}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status !== 'success' || !Array.isArray(result.data)) {
            console.warn('Yash Transport fetch failed:', result.message);
            yashRecords = [];
            return;
        }
        yashRecords = result.data;
        setCache(result.data, YASH_CACHE_KEY);
        console.log(`✅ Loaded ${yashRecords.length} Yash Transport row(s)`);
    } catch (err) {
        console.warn('Yash Transport fetch failed:', err.message);
        yashRecords = [];
    }
}

function sumYashAmountForParty(partyName) {
    if (!partyName || !yashRecords.length) return 0;
    const target = partyName.trim().toLowerCase();
    const headers = Object.keys(yashRecords[0] || {});
    const norm = (s) => String(s).toLowerCase().replace(/[\s._-]/g, '');

    const vendorKey = headers.find(h => norm(h) === 'vendornamesource')
                   || headers.find(h => norm(h).includes('vendor') && norm(h).includes('source'))
                   || headers.find(h => norm(h).includes('vendor'))
                   || headers.find(h => norm(h).includes('party'));

    const amountKey = headers.find(h => norm(h) === 'amount')
                   || headers.find(h => norm(h).includes('amount'));

    if (!vendorKey || !amountKey) {
        console.warn('Yash Transport: vendor/amount column not found. Headers:', headers);
        return 0;
    }

    let total = 0;
    for (const row of yashRecords) {
        const v = String(row[vendorKey] ?? '').trim().toLowerCase();
        if (v !== target) continue;
        const a = parseFloat(row[amountKey]);
        if (!isNaN(a)) total += a;
    }
    return total;
}

/* =====================================================================
   SECTION 11 — TABLE RENDERING
   ===================================================================== */

let renderRafHandle = null;
let pendingFilter = '';

function scheduleRender(filter = '') {
    pendingFilter = filter;
    if (renderRafHandle) return;
    renderRafHandle = requestAnimationFrame(() => {
        renderRafHandle = null;
        renderTable(pendingFilter);
    });
}

function renderTable(filter = '') {
    const tbody = document.getElementById('tableBody');
    const searchLower = filter.toLowerCase().trim();

    let filtered = allInvoices;
    if (searchLower) {
        filtered = allInvoices.filter(item => {
            const party   = String(item['Party Name'] || '').toLowerCase();
            const invoice = String(item['Invoice No'] || '').toLowerCase();
            const date    = String(item['Date'] || '').toLowerCase();
            return party.indexOf(searchLower) !== -1 ||
                   invoice.indexOf(searchLower) !== -1 ||
                   date.indexOf(searchLower) !== -1;
        });
    }

    if (!filtered.length) {
        tbody.innerHTML = `
            <tr><td colspan="4">
                <div class="empty-state">
                    <i class="fas fa-file-invoice"></i>
                    <p>${searchLower ? 'No matching invoices found' : 'No invoices yet'}</p>
                    <p class="sub-text">${searchLower ? 'Try a different search' : 'Click "Add Invoice" to create one'}</p>
                </div>
            </td></tr>`;
        return;
    }

    const rows = new Array(filtered.length);
    for (let i = 0; i < filtered.length; i++) {
        const item = filtered[i];
        const srNo    = item['Sr. No'] || (i + 1);
        const party   = item['Party Name'] || '—';
        const dateVal = formatDateDDMMYYYY(item['Date']) || '—';
        const actualIndex = allInvoices.indexOf(item);

        rows[i] =
            `<tr>` +
            `<td class="sr-col">${escapeHtml(srNo)}</td>` +
            `<td>${escapeHtml(party)}</td>` +
            `<td>${escapeHtml(dateVal)}</td>` +
            `<td class="action-col">` +
                `<button class="view-action-btn" data-srno="${escapeHtml(srNo)}" data-index="${actualIndex}">` +
                    `<i class="fas fa-eye" aria-hidden="true"></i> View` +
                `</button>` +
            `</td>` +
            `</tr>`;
    }
    tbody.innerHTML = rows.join('');
}

/* =====================================================================
   SECTION 12 — DETAIL VIEW
   ===================================================================== */

function showDetailView(item) {
    const cards = [];

    cards.push(cardHtml('Sr. No', item['Sr. No'] || '—'));
    cards.push(cardHtml('Party Name', item['Party Name'] || '—'));
    cards.push(cardHtml('Invoice No', item['Invoice No'] || '—'));
    cards.push(cardHtml('Date', formatDateDDMMYYYY(item['Date']) || '—'));

    const serviceRows = [];
    for (let i = 1; i <= MAX_SERVICES; i++) {
        const desc = item[`Description of Service ${i}`];
        const hsn  = item[`HSN/SAC ${i}`];
        const qty  = item[`Quantity ${i}`];
        const rate = item[`Rate ${i}`];
        const amt  = item[`Amount ${i}`];
        const hasAny = [desc, hsn, qty, rate, amt].some(v => v !== undefined && v !== null && String(v).trim() !== '');
        if (!hasAny) continue;
        serviceRows.push(
            `<tr>` +
            `<td>${i}</td>` +
            `<td>${escapeHtml(desc || '—')}</td>` +
            `<td>${escapeHtml(hsn || '—')}</td>` +
            `<td>${escapeHtml(qty || '—')}</td>` +
            `<td>${escapeHtml(rate || '—')}</td>` +
            `<td>${escapeHtml(amt !== undefined && amt !== '' ? formatINR(amt) : '—')}</td>` +
            `</tr>`
        );
    }
    if (serviceRows.length) {
        cards.push(
            `<div class="detail-card fullwidth">` +
                `<div class="detail-label">Services</div>` +
                `<table class="detail-services-table">` +
                    `<thead><tr>` +
                        `<th>#</th><th>Description</th><th>HSN/SAC</th><th>Qty</th><th>Rate</th><th>Amount</th>` +
                    `</tr></thead>` +
                    `<tbody>${serviceRows.join('')}</tbody>` +
                `</table>` +
            `</div>`
        );
    }

    const taxRows = [];
    const pushTax = (label, pctKey, amtKey) => {
        const pct = item[pctKey];
        const amt = item[amtKey];
        if ((pct === undefined || pct === null || String(pct).trim() === '' || parseFloat(pct) === 0) &&
            (amt === undefined || amt === null || String(amt).trim() === '' || parseFloat(amt) === 0)) {
            return;
        }
        taxRows.push(cardHtml(`${label} (%)`, pct !== undefined && pct !== '' ? pct : '—'));
        taxRows.push(cardHtml(`${label} Amt`, amt !== undefined && amt !== '' ? `₹${formatINR(amt)}` : '—'));
    };
    pushTax('CGST', 'CGST (%)', 'CGST Amt');
    pushTax('SGST', 'SGST (%)', 'SGST Amt');
    pushTax('IGST', 'IGST (%)', 'IGST Amt');
    cards.push(...taxRows);

    const total = parseFloat(item['Total Amount']);
    cards.push(
        `<div class="total-row" style="grid-column:1/-1;">` +
            `<span class="total-label">Total Amount</span>` +
            `<span class="total-value">₹${formatINR(isNaN(total) ? 0 : total)}</span>` +
        `</div>`
    );

    document.getElementById('detailsContainer').innerHTML = cards.join('');
    showPage2();
}

function cardHtml(label, value, fullwidth = false) {
    return `<div class="detail-card${fullwidth ? ' fullwidth' : ''}">` +
        `<div class="detail-label">${escapeHtml(label)}</div>` +
        `<div class="detail-value">${escapeHtml(String(value))}</div>` +
        `</div>`;
}

/* =====================================================================
   SECTION 13 — FORM BUILDER (Services as horizontal table)
   ===================================================================== */

function buildServiceRowInner(index, values = {}) {
    const desc = values.desc ?? (index === 1 ? DEFAULT_DESCRIPTION : '');
    const hsn  = values.hsn  ?? (index === 1 ? DEFAULT_HSN : '');
    const qty  = values.qty  ?? '';
    const rate = values.rate ?? '';
    const amt  = values.amt  ?? '';

    return `
        <td class="col-sr">${index}</td>
        <td class="col-desc">
            <input type="text" id="fDesc${index}" data-field="desc" data-index="${index}"
                   value="${escapeHtml(desc)}" placeholder="e.g., Transport Charges" autocomplete="off">
        </td>
        <td class="col-hsn">
            <input type="text" id="fHsn${index}" data-field="hsn" data-index="${index}"
                   value="${escapeHtml(hsn)}" placeholder="996511" autocomplete="off" inputmode="numeric">
        </td>
        <td class="col-qty">
            <input type="number" id="fQty${index}" data-field="qty" data-index="${index}"
                   value="${escapeHtml(qty)}" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
        </td>
        <td class="col-rate">
            <input type="number" id="fRate${index}" data-field="rate" data-index="${index}"
                   value="${escapeHtml(rate)}" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
        </td>
        <td class="col-amt">
            <input type="text" id="fAmt${index}" data-field="amt" data-index="${index}"
                   value="${escapeHtml(amt)}" placeholder="0.00" readonly disabled>
        </td>
        <td class="col-act">
            ${index > 1
                ? `<button type="button" class="remove-service-btn" data-remove-service="${index}" title="Remove">
                       <i class="fas fa-times"></i>
                   </button>`
                : `<span style="opacity:.4;font-size:.8rem;">—</span>`}
        </td>
    `;
}

function buildFormHtml(item = null, isEdit = false) {
    const def = {
        'Sr. No': '',
        'Party Name': '',
        'Invoice No': '',
        'Date': isEdit ? '' : todayInputDate()
    };
    if (item) {
        for (const k in def) {
            if (item[k] !== undefined && item[k] !== null && item[k] !== '') def[k] = item[k];
        }
    }
    const dateInputValue = ddmmyyyyToInputDate(def['Date']) || (isEdit ? '' : todayInputDate());

    const serviceRows = [];
    for (let i = 1; i <= MAX_SERVICES; i++) {
        const values = {
            desc: item ? (item[`Description of Service ${i}`] ?? '') : undefined,
            hsn:  item ? (item[`HSN/SAC ${i}`] ?? '') : undefined,
            qty:  item ? (item[`Quantity ${i}`] ?? '') : undefined,
            rate: item ? (item[`Rate ${i}`] ?? '') : undefined,
            amt:  item ? (item[`Amount ${i}`] ?? '') : undefined
        };
        const hasData = [values.desc, values.hsn, values.qty, values.rate, values.amt]
            .some(v => v !== undefined && v !== null && String(v).trim() !== '');
        const visible = (i === 1) || (item ? hasData : false);
        serviceRows.push(
            `<tr data-service-row="${i}" ${visible ? '' : 'style="display:none"'}>
                ${buildServiceRowInner(i, values || {})}
             </tr>`
        );
    }

    const cgstPct = item?.['CGST (%)'] ?? '';
    const cgstAmt = item?.['CGST Amt'] ?? '';
    const sgstPct = item?.['SGST (%)'] ?? '';
    const sgstAmt = item?.['SGST Amt'] ?? '';
    const igstPct = item?.['IGST (%)'] ?? '';
    const igstAmt = item?.['IGST Amt'] ?? '';
    const totalAmt = item?.['Total Amount'] ?? '';

    return `<form id="invoiceForm" novalidate>
        <div class="form-grid">

            <div class="form-section-title">
                <i class="fas fa-file-invoice" aria-hidden="true"></i> Invoice Information
            </div>

            <div class="field">
                <label for="fSrNo">Sr. No (Auto)</label>
                <input type="text" id="fSrNo" value="${escapeHtml(def['Sr. No'])}" placeholder="Auto-generated" readonly>
                <span class="hint">Managed automatically by the server.</span>
            </div>

            <div class="field">
                <label for="fPartyName">Party Name</label>
                <select id="fPartyName" required>
                    ${buildPartySelectOptions(def['Party Name'])}
                </select>
                <span class="hint">Select from the list (typed entries not allowed).</span>
            </div>

            <div class="field">
                <label for="fInvoiceNo">Invoice No</label>
                <input type="number" id="fInvoiceNo" value="${escapeHtml(def['Invoice No'])}"
                       min="0" step="1" placeholder="e.g., 1001" inputmode="numeric">
            </div>

            <div class="field">
                <label for="fDate">Date (DD/MM/YYYY)</label>
                <input type="date" id="fDate" value="${escapeHtml(dateInputValue)}">
                <span class="hint">Saved in DD/MM/YYYY format.</span>
            </div>

            <div class="form-section-title">
                <i class="fas fa-list" aria-hidden="true"></i> Services
            </div>

            <div class="services-wrap">
                <table class="services-table">
                    <thead>
                        <tr>
                            <th class="col-sr">Sr. No</th>
                            <th class="col-desc">Description of Services</th>
                            <th class="col-hsn">HSN/SAC</th>
                            <th class="col-qty">Quantity</th>
                            <th class="col-rate">Rate</th>
                            <th class="col-amt">Amount</th>
                            <th class="col-act"></th>
                        </tr>
                    </thead>
                    <tbody id="servicesTbody">
                        ${serviceRows.join('')}
                    </tbody>
                </table>
            </div>

            <div class="add-service-wrap">
                <button type="button" id="addServiceBtn" class="add-service-btn">
                    <i class="fas fa-plus-circle"></i> Add More Services
                </button>
            </div>

            <div class="form-section-title">
                <i class="fas fa-percent" aria-hidden="true"></i> Tax Summary
            </div>

            <div class="tax-summary" id="taxSummary">
                <div class="field tax-cgst" id="taxCgstBlock">
                    <label for="fCgstPct">CGST (%)</label>
                    <input type="text" id="fCgstPct" value="${escapeHtml(cgstPct)}" readonly disabled>
                </div>
                <div class="field tax-cgst" id="taxCgstAmtBlock">
                    <label for="fCgstAmt">CGST Amt</label>
                    <input type="text" id="fCgstAmt" value="${cgstAmt !== '' ? formatINR(cgstAmt) : ''}" readonly disabled>
                </div>
                <div class="field tax-sgst" id="taxSgstBlock">
                    <label for="fSgstPct">SGST (%)</label>
                    <input type="text" id="fSgstPct" value="${escapeHtml(sgstPct)}" readonly disabled>
                </div>
                <div class="field tax-sgst" id="taxSgstAmtBlock">
                    <label for="fSgstAmt">SGST Amt</label>
                    <input type="text" id="fSgstAmt" value="${sgstAmt !== '' ? formatINR(sgstAmt) : ''}" readonly disabled>
                </div>
                <div class="field tax-igst" id="taxIgstBlock">
                    <label for="fIgstPct">IGST (%)</label>
                    <input type="text" id="fIgstPct" value="${escapeHtml(igstPct)}" readonly disabled>
                </div>
                <div class="field tax-igst" id="taxIgstAmtBlock">
                    <label for="fIgstAmt">IGST Amt</label>
                    <input type="text" id="fIgstAmt" value="${igstAmt !== '' ? formatINR(igstAmt) : ''}" readonly disabled>
                </div>
                <div class="field" style="grid-column:1/-1;">
                    <label for="fSubTotal">Sub Total</label>
                    <input type="text" id="fSubTotal" value="" readonly disabled>
                </div>
            </div>

            <div class="total-row">
                <span class="total-label">Total Amount</span>
                <span class="total-value placeholder" id="fTotalDisplay">₹0.00</span>
                <input type="hidden" id="fTotalHidden" value="${escapeHtml(totalAmt)}">
            </div>

        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--border-color);flex-wrap:wrap;">
            <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
            <button type="submit" id="saveFormBtn" class="btn btn-primary">
                <i class="fas fa-save" aria-hidden="true"></i> ${isEdit ? 'Update Invoice' : 'Save Invoice'}
            </button>
        </div>
    </form>`;
}

/* =====================================================================
   SECTION 14 — MODAL OPEN
   ===================================================================== */

function openAddModal() {
    const body = document.getElementById('formModalBody');
    document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-plus" aria-hidden="true"></i> Add New Invoice';
    body.innerHTML = buildFormHtml(null, false);

    const ensure = [];
    if (!partyOptions.length) ensure.push(loadPartyOptions());
    if (!yashRecords.length)  ensure.push(loadYashRecords());

    Promise.all(ensure).then(() => {
        const sel = document.getElementById('fPartyName');
        if (sel && document.getElementById('formModal').classList.contains('active')) {
            const current = sel.value;
            sel.innerHTML = buildPartySelectOptions(current);
        }
    });

    bindFormEvents(false, null);
    recalcAllAmounts();
    applyGstFromParty();

    document.getElementById('formModal').classList.add('active');
    requestAnimationFrame(() => document.getElementById('fPartyName')?.focus());

    const pre = document.getElementById('fPartyName')?.value;
    if (pre) autoFillAmount1ForParty();
}

function openEditModal() {
    if (!currentViewItem) { showToast('❌ No record selected', 'error'); return; }

    const body = document.getElementById('formModalBody');
    document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-edit" aria-hidden="true"></i> Edit Invoice';
    body.innerHTML = buildFormHtml(currentViewItem, true);

    bindFormEvents(true, currentViewRowIndex);

    for (let i = 2; i <= MAX_SERVICES; i++) recalcAmountForService(i);
    recalcTaxSummary();
    applyGstFromParty();

    document.getElementById('formModal').classList.add('active');
    requestAnimationFrame(() => document.getElementById('fPartyName')?.focus());
}

/* =====================================================================
   SECTION 15 — FORM BINDINGS
   ===================================================================== */

function bindFormEvents(isEdit, rowIdx) {
    const form = document.getElementById('invoiceForm');
    if (!form) return;

    document.getElementById('cancelFormBtn')?.addEventListener('click', () => {
        document.getElementById('formModal').classList.remove('active');
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        handleSubmit(e, isEdit, rowIdx);
    });

    const partySel = document.getElementById('fPartyName');
    if (partySel) {
        partySel.addEventListener('change', () => {
            applyGstFromParty();
            autoFillAmount1ForParty();
        });
    }

    form.addEventListener('input', (e) => {
        const t = e.target;
        if (!t || !t.dataset) return;
        if (t.dataset.field === 'qty' || t.dataset.field === 'rate') {
            const idx = parseInt(t.dataset.index, 10);
            if (idx === 1) {
                const qtyVal  = document.getElementById('fQty1')?.value.trim();
                const rateVal = document.getElementById('fRate1')?.value.trim();
                if (qtyVal || rateVal) {
                    const row = document.querySelector('[data-service-row="1"]');
                    row?.classList.remove('summing');
                    row?.querySelector('.calc-spinner')?.remove();
                }
            }
            recalcAmountForService(idx);
            recalcTaxSummary();
        }
    });

    document.getElementById('addServiceBtn')?.addEventListener('click', addNextService);

    form.addEventListener('click', (e) => {
        const btn = e.target.closest('.remove-service-btn');
        if (!btn) return;
        const idx = parseInt(btn.getAttribute('data-remove-service'), 10);
        removeService(idx);
    });
}

function addNextService() {
    for (let i = 2; i <= MAX_SERVICES; i++) {
        const row = document.querySelector(`[data-service-row="${i}"]`);
        if (row && row.style.display === 'none') {
            row.style.display = '';
            requestAnimationFrame(() => {
                document.getElementById(`fDesc${i}`)?.focus();
            });
            return;
        }
    }
    showToast('ℹ️ All 10 service rows are already visible', 'info');
}

function removeService(idx) {
    if (idx <= 1) return;
    const row = document.querySelector(`[data-service-row="${idx}"]`);
    if (!row) return;
    row.querySelectorAll('input').forEach(inp => { inp.value = ''; });
    row.style.display = 'none';
    recalcTaxSummary();
}

function numVal(id) {
    const el = document.getElementById(id);
    if (!el) return NaN;
    const v = parseFloat(el.value);
    return isNaN(v) ? NaN : v;
}

function recalcAmountForService(idx) {
    const qty  = numVal(`fQty${idx}`);
    const rate = numVal(`fRate${idx}`);
    const amtEl = document.getElementById(`fAmt${idx}`);
    if (!amtEl) return;
    if (!isNaN(qty) && !isNaN(rate)) {
        amtEl.value = formatINR(qty * rate);
    } else {
        amtEl.value = '';
    }
}

function recalcAllAmounts() {
    for (let i = 1; i <= MAX_SERVICES; i++) {
        recalcAmountForService(i);
    }
    recalcTaxSummary();
}

/* =====================================================================
   AMOUNT 1 AUTO-FILL FROM YASH TRANSPORT
   ===================================================================== */

async function autoFillAmount1ForParty() {
    const partySel = document.getElementById('fPartyName');
    const amt1     = document.getElementById('fAmt1');
    const qty1El   = document.getElementById('fQty1');
    const rate1El  = document.getElementById('fRate1');
    const row1     = document.querySelector('[data-service-row="1"]');
    if (!partySel || !amt1) return;

    const partyName = (partySel.value || '').trim();

    const clearBusyState = () => {
        row1?.classList.remove('summing');
        const sp = amt1.parentElement?.querySelector('.calc-spinner');
        if (sp) sp.remove();
    };

    const qtyVal  = qty1El?.value.trim() || '';
    const rateVal = rate1El?.value.trim() || '';
    if (qtyVal || rateVal) {
        clearBusyState();
        recalcAmountForService(1);
        recalcTaxSummary();
        return;
    }

    if (!partyName) {
        clearBusyState();
        amt1.value = '';
        recalcTaxSummary();
        return;
    }

    row1?.classList.add('summing');
    amt1.value = '';
    if (!amt1.parentElement.querySelector('.calc-spinner')) {
        const sp = document.createElement('span');
        sp.className = 'calc-spinner';
        amt1.parentElement.appendChild(sp);
    }

    try {
        if (!yashRecords.length) {
            await loadYashRecords();
        }

        if (!yashRecords.length) {
            clearBusyState();
            amt1.value = '';
            recalcTaxSummary();
            return;
        }

        const total = sumYashAmountForParty(partyName);
        await new Promise(r => setTimeout(r, 300));

        clearBusyState();
        amt1.value = total > 0 ? formatINR(total) : '';
        recalcTaxSummary();

        if (total > 0) {
            console.log(`💰 Amount 1 auto-filled for "${partyName}": ₹${formatINR(total)}`);
        }
    } catch (err) {
        console.warn('autoFillAmount1ForParty failed:', err.message);
        clearBusyState();
        amt1.value = '';
        recalcTaxSummary();
    }
}

function applyGstFromParty() {
    const partyName = document.getElementById('fPartyName')?.value || '';
    const found = partyOptions.find(p => p.name === partyName);

    const setField = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.value = (value === null || value === undefined || value === '' || value === 0) ? '' : value;
    };
    setField('fCgstPct', found?.cgst ?? '');
    setField('fSgstPct', found?.sgst ?? '');
    setField('fIgstPct', found?.igst ?? '');

    recalcTaxSummary();
}

function sumServiceAmounts() {
    let total = 0;
    for (let i = 1; i <= MAX_SERVICES; i++) {
        const row = document.querySelector(`[data-service-row="${i}"]`);
        if (!row || row.style.display === 'none') continue;
        const el = document.getElementById(`fAmt${i}`);
        if (!el) continue;
        const v = parseFloat(String(el.value).replace(/,/g, ''));
        if (!isNaN(v)) total += v;
    }
    return total;
}

function recalcTaxSummary() {
    const subTotal = sumServiceAmounts();
    const subEl = document.getElementById('fSubTotal');
    if (subEl) subEl.value = formatINR(subTotal);

    const cgstPct = parseFloat(document.getElementById('fCgstPct')?.value);
    const sgstPct = parseFloat(document.getElementById('fSgstPct')?.value);
    const igstPct = parseFloat(document.getElementById('fIgstPct')?.value);

    const hasCgst = !isNaN(cgstPct) && cgstPct > 0;
    const hasSgst = !isNaN(sgstPct) && sgstPct > 0;
    const hasIgst = !isNaN(igstPct) && igstPct > 0;

    const cgstAmt = hasCgst ? (subTotal * cgstPct / 100) : 0;
    const sgstAmt = hasSgst ? (subTotal * sgstPct / 100) : 0;
    const igstAmt = hasIgst ? (subTotal * igstPct / 100) : 0;

    const cgstAmtEl = document.getElementById('fCgstAmt');
    const sgstAmtEl = document.getElementById('fSgstAmt');
    const igstAmtEl = document.getElementById('fIgstAmt');
    if (cgstAmtEl) cgstAmtEl.value = hasCgst ? formatINR(cgstAmt) : '';
    if (sgstAmtEl) sgstAmtEl.value = hasSgst ? formatINR(sgstAmt) : '';
    if (igstAmtEl) igstAmtEl.value = hasIgst ? formatINR(igstAmt) : '';

    document.getElementById('taxCgstBlock')?.classList.toggle('tax-hidden', !hasCgst);
    document.getElementById('taxCgstAmtBlock')?.classList.toggle('tax-hidden', !hasCgst);
    document.getElementById('taxSgstBlock')?.classList.toggle('tax-hidden', !hasSgst);
    document.getElementById('taxSgstAmtBlock')?.classList.toggle('tax-hidden', !hasSgst);
    document.getElementById('taxIgstBlock')?.classList.toggle('tax-hidden', !hasIgst);
    document.getElementById('taxIgstAmtBlock')?.classList.toggle('tax-hidden', !hasIgst);

    const total = subTotal + cgstAmt + sgstAmt + igstAmt;

    const totalDisplay = document.getElementById('fTotalDisplay');
    const totalHidden  = document.getElementById('fTotalHidden');
    if (totalDisplay) {
        totalDisplay.textContent = `₹${formatINR(total)}`;
        totalDisplay.classList.toggle('placeholder', total === 0);
    }
    if (totalHidden) totalHidden.value = total.toFixed(2);
}

/* =====================================================================
   SECTION 16 — SUBMIT
   ===================================================================== */

async function handleSubmit(e, isEdit, rowIdx) {
    e.preventDefault();
    if (saveInProgress) return;

    const partyName = document.getElementById('fPartyName')?.value || '';
    const invoiceNo = document.getElementById('fInvoiceNo')?.value.trim() || '';
    const dateInput = document.getElementById('fDate')?.value || '';

    if (!partyName) {
        showToast('⚠️ Please select a Party Name', 'warning');
        document.getElementById('fPartyName')?.focus();
        return;
    }
    if (!invoiceNo) {
        showToast('⚠️ Invoice No is required', 'warning');
        document.getElementById('fInvoiceNo')?.focus();
        return;
    }
    if (!dateInput) {
        showToast('⚠️ Date is required', 'warning');
        document.getElementById('fDate')?.focus();
        return;
    }

    const dateDDMMYYYY = formatDateDDMMYYYY(dateInput);

    const services = [];
    for (let i = 1; i <= MAX_SERVICES; i++) {
        const row = document.querySelector(`[data-service-row="${i}"]`);
        const visible = row && row.style.display !== 'none';
        if (!visible) {
            services.push({ desc:'', hsn:'', qty:'', rate:'', amt:'' });
            continue;
        }
        const desc = document.getElementById(`fDesc${i}`)?.value.trim() || '';
        const hsn  = document.getElementById(`fHsn${i}`)?.value.trim() || '';
        const qty  = document.getElementById(`fQty${i}`)?.value || '';
        const rate = document.getElementById(`fRate${i}`)?.value || '';
        const amt  = (document.getElementById(`fAmt${i}`)?.value || '').replace(/,/g, '').trim();
        services.push({ desc, hsn, qty, rate, amt });
    }

    const hasAnyService = services.some(s => s.desc || s.hsn || s.qty || s.rate || s.amt);
    if (!hasAnyService) {
        showToast('⚠️ Please fill at least one service row', 'warning');
        return;
    }

    const cgstPct = document.getElementById('fCgstPct')?.value || '';
    const cgstAmt = (document.getElementById('fCgstAmt')?.value || '').replace(/,/g, '');
    const sgstPct = document.getElementById('fSgstPct')?.value || '';
    const sgstAmt = (document.getElementById('fSgstAmt')?.value || '').replace(/,/g, '');
    const igstPct = document.getElementById('fIgstPct')?.value || '';
    const igstAmt = (document.getElementById('fIgstAmt')?.value || '').replace(/,/g, '');
    const totalAmt = document.getElementById('fTotalHidden')?.value || '0.00';

    saveInProgress = true;
    const saveBtn = document.getElementById('saveFormBtn');
    showSpinner(saveBtn, true);

    try {
        const params = new URLSearchParams();
        params.append('action', isEdit ? 'update' : 'insert');
        params.append('spreadsheetId', SPREADSHEET_ID);
        params.append('sheetName', SHEET_NAME);
        if (isEdit && rowIdx) params.append('rowIndex', rowIdx);

        params.append('Party Name', partyName);
        params.append('Invoice No', invoiceNo);
        params.append('Date', dateDDMMYYYY);

        for (let i = 1; i <= MAX_SERVICES; i++) {
            const s = services[i - 1];
            params.append(`Description of Service ${i}`, s.desc);
            params.append(`HSN/SAC ${i}`, s.hsn);
            params.append(`Quantity ${i}`, s.qty);
            params.append(`Rate ${i}`, s.rate);
            params.append(`Amount ${i}`, s.amt);
        }
        params.append('CGST (%)', cgstPct);
        params.append('CGST Amt', cgstAmt);
        params.append('SGST (%)', sgstPct);
        params.append('SGST Amt', sgstAmt);
        params.append('IGST (%)', igstPct);
        params.append('IGST Amt', igstAmt);
        params.append('Total Amount', totalAmt);

        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        });
        const result = await response.json();

        if (result.status === 'success') {
            invalidateCache();
            showToast(`✅ Invoice ${isEdit ? 'updated' : 'saved'} successfully!`, 'success');
            document.getElementById('formModal').classList.remove('active');
            await loadInvoices({ forceRefresh: true });
            if (isEdit) showPage1();
        } else {
            throw new Error(result.message || 'Unknown error');
        }
    } catch (err) {
        console.error('Submit error:', err);
        showToast('❌ ' + err.message, 'error');
    } finally {
        saveInProgress = false;
        showSpinner(saveBtn, false);
    }
}

/* =====================================================================
   SECTION 17 — DELETE
   ===================================================================== */

function deleteInvoice() {
    if (!currentViewItem || !currentViewRowIndex) {
        showToast('❌ No record selected', 'error'); return;
    }

    const party   = currentViewItem['Party Name'] || 'this record';
    const invoice = currentViewItem['Invoice No'] || '';

    showModal(
        `Are you sure you want to delete invoice <strong>${escapeHtml(invoice || party)}</strong>` +
        (party ? ` for <strong>${escapeHtml(party)}</strong>` : '') +
        `?<br><br>This action cannot be undone.`,
        'Confirm Delete',
        true,
        async () => {
            const btn = document.getElementById('deleteFromDetailBtn');
            showSpinner(btn, true);
            try {
                const params = new URLSearchParams();
                params.append('action', 'delete');
                params.append('spreadsheetId', SPREADSHEET_ID);
                params.append('sheetName', SHEET_NAME);
                params.append('rowIndex', currentViewRowIndex);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
                const result = await response.json();

                if (result.status === 'success') {
                    invalidateCache();
                    showToast('✅ Invoice deleted!', 'success');
                    currentViewItem = null;
                    currentViewRowIndex = null;
                    await loadInvoices({ forceRefresh: true });
                    showPage1();
                } else {
                    throw new Error(result.message || 'Unknown error');
                }
            } catch (err) {
                console.error('Delete error:', err);
                showToast('❌ Delete failed: ' + err.message, 'error');
            } finally {
                showSpinner(btn, false);
            }
        },
        'Delete'
    );
}

/* =====================================================================
   SECTION 18 — PRINT TAX INVOICE
   ===================================================================== */

let __partyDetailCache = {};

async function fetchPartyFullDetail(partyName) {
    if (!partyName) return null;
    const key = partyName.trim().toLowerCase();
    if (__partyDetailCache[key]) return __partyDetailCache[key];

    try {
        const url = `${SCRIPT_URL}?spreadsheetId=${SOURCE_SPREADSHEET_ID}` +
                    `&sheetName=${encodeURIComponent(PARTY_SHEET_NAME)}&_=${Date.now()}`;
        const res  = await fetch(url);
        const json = await res.json();
        if (json.status !== 'success' || !Array.isArray(json.data)) return null;

        const rows = json.data;
        if (!rows.length) return null;

        const headers = Object.keys(rows[0] || {});
        const norm = (s) => String(s).toLowerCase().replace(/[\s._-]/g, '');
        const findKey = (exact) => headers.find(h => norm(h) === norm(exact));

        const keyPartyName = findKey('Party Name');
        if (!keyPartyName) return null;

        const wantKeys = {
            Address:  findKey('Address'),
            GSTIN:    findKey('GSTIN/UIN') || findKey('GSTIN') || findKey('GST UIN'),
            State:    findKey('State Name') || findKey('State'),
            Code:     findKey('Code'),
            Email:    findKey('E-Mail') || findKey('Email')
        };

        for (const row of rows) {
            const name = String(row[keyPartyName] ?? '').trim();
            if (name.toLowerCase() !== key) continue;
            const detail = {
                Address: wantKeys.Address ? String(row[wantKeys.Address] ?? '').trim() : '',
                GSTIN:   wantKeys.GSTIN   ? String(row[wantKeys.GSTIN]   ?? '').trim() : '',
                State:   wantKeys.State   ? String(row[wantKeys.State]   ?? '').trim() : '',
                Code:    wantKeys.Code    ? String(row[wantKeys.Code]    ?? '').trim() : '',
                Email:   wantKeys.Email   ? String(row[wantKeys.Email]   ?? '').trim() : ''
            };
            __partyDetailCache[key] = detail;
            return detail;
        }
    } catch (err) {
        console.warn('fetchPartyFullDetail failed:', err.message);
    }
    return null;
}

function buildInlineTaxBlock(invoice) {
    const cgstPct = parseFloat(invoice['CGST (%)']) || 0;
    const cgstAmt = parseFloat(invoice['CGST Amt']) || 0;
    const sgstPct = parseFloat(invoice['SGST (%)']) || 0;
    const sgstAmt = parseFloat(invoice['SGST Amt']) || 0;
    const igstPct = parseFloat(invoice['IGST (%)']) || 0;
    const igstAmt = parseFloat(invoice['IGST Amt']) || 0;

    const lines = [];
    if (cgstPct > 0 || cgstAmt > 0) {
        lines.push(`
            <div class="line">
                <span class="lbl">CGST</span>
                <span class="pct">${cgstPct ? cgstPct + ' %' : ''}</span>
                <span class="amt">${cgstAmt ? formatINR(cgstAmt) : ''}</span>
            </div>
        `);
    }
    if (sgstPct > 0 || sgstAmt > 0) {
        lines.push(`
            <div class="line">
                <span class="lbl">SGST</span>
                <span class="pct">${sgstPct ? sgstPct + ' %' : ''}</span>
                <span class="amt">${sgstAmt ? formatINR(sgstAmt) : ''}</span>
            </div>
        `);
    }
    if (igstPct > 0 || igstAmt > 0) {
        lines.push(`
            <div class="line">
                <span class="lbl">IGST</span>
                <span class="pct">${igstPct ? igstPct + ' %' : ''}</span>
                <span class="amt">${igstAmt ? formatINR(igstAmt) : ''}</span>
            </div>
        `);
    }
    if (!lines.length) return '';
    return `<div class="inline-tax">${lines.join('')}</div>`;
}
