async function printTaxInvoice() {
    if (!currentViewItem) {
        showToast('❌ No invoice selected', 'error');
        return;
    }

    const printBtn = document.getElementById('printFromDetailBtn');
    showSpinner(printBtn, true, '<i class="fas fa-spinner fa-spin"></i> Preparing...');

    try {
        const partyName = currentViewItem['Party Name'] || '';
        const partyDetail = await fetchPartyFullDetail(partyName);
        const html = buildPrintHtml(currentViewItem, partyDetail);

        const container = document.getElementById('printContainer');
        container.innerHTML = html;

        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        setTimeout(() => { window.print(); }, 150);
    } catch (err) {
        console.error('Print failed:', err);
        showToast('❌ Print failed: ' + err.message, 'error');
    } finally {
        setTimeout(() => showSpinner(printBtn, false), 400);
    }
}

/* =====================================================================
   SECTION 19 — EVENT DELEGATION
   ===================================================================== */

function handleTableClick(e) {
    const btn = e.target.closest('.view-action-btn');
    if (!btn) {
        const retry = e.target.closest('[data-retry]');
        if (retry) loadInvoices({ forceRefresh: true });
        return;
    }

    const srNo = btn.getAttribute('data-srno');
    const index = parseInt(btn.getAttribute('data-index'), 10);

    let found = null;
    if (srNo) found = allInvoices.find(item => String(item['Sr. No']) === String(srNo));
    if (!found && !isNaN(index) && index >= 0 && index < allInvoices.length) {
        found = allInvoices[index];
    }

    if (found) {
        currentViewItem = found;
        currentViewRowIndex = found._rowIndex;
        showDetailView(found);
    } else {
        showToast('❌ Record not found', 'error');
    }
}

/* =====================================================================
   SECTION 20 — AUTO BACKGROUND UPDATE
   ===================================================================== */

function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => {
        if (document.visibilityState === 'visible') {
            silentRefresh();
        }
    }, AUTO_REFRESH_INTERVAL);
}

function stopAutoRefresh() {
    if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        if (Date.now() - lastFetchTime > CACHE_TTL) scheduleIdle(() => silentRefresh());
        startAutoRefresh();
    } else {
        stopAutoRefresh();
    }
});

/* =====================================================================
   SECTION 21 — INITIALIZATION
   ===================================================================== */

function initApp() {
    if (initDone) return;
    initDone = true;

    const refreshBtn = document.getElementById('refreshBtn');
    const addNewBtn  = document.getElementById('addNewBtn');
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    const mobileAddBtn = document.getElementById('mobileAddBtn');

    const doRefresh = async (btn) => {
        showSpinner(btn, true);
        invalidateCache();
        invalidateCache(PARTY_CACHE_KEY);
        invalidateCache(YASH_CACHE_KEY);
        await Promise.all([
            loadInvoices({ forceRefresh: true, silent: true }),
            loadPartyOptions({ forceRefresh: true }),
            loadYashRecords({ forceRefresh: true })
        ]);
        showSpinner(btn, false);
        showToast('🔄 Data refreshed', 'success');
    };

    refreshBtn?.addEventListener('click', () => doRefresh(refreshBtn));
    mobileRefreshBtn?.addEventListener('click', () => doRefresh(mobileRefreshBtn));
    addNewBtn?.addEventListener('click', openAddModal);
    mobileAddBtn?.addEventListener('click', openAddModal);

    document.getElementById('backToPage1Btn')?.addEventListener('click', showPage1);
    document.getElementById('editFromDetailBtn')?.addEventListener('click', openEditModal);
    document.getElementById('printFromDetailBtn')?.addEventListener('click', printTaxInvoice);
    document.getElementById('deleteFromDetailBtn')?.addEventListener('click', deleteInvoice);

    document.getElementById('closeFormModalBtn')?.addEventListener('click', () => {
        document.getElementById('formModal').classList.remove('active');
    });
    document.getElementById('closeGlobalModal')?.addEventListener('click', () => {
        document.getElementById('globalModal').classList.remove('active');
    });

    document.addEventListener('click', (e) => {
        if (e.target.classList && e.target.classList.contains('modal-overlay')) {
            e.target.classList.remove('active');
        }
    });

    document.getElementById('tableBody')?.addEventListener('click', handleTableClick);

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', debounce(function() {
            scheduleRender(this.value);
        }, 250));
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.active').forEach(m => {
                m.classList.remove('active');
            });
        }
    });

    window.addEventListener('storage', (e) => {
        if (e.key === 'user-theme-preference') syncThemeWithParent();
    });

    loadInvoices();
    loadPartyOptions();
    loadYashRecords();

    startAutoRefresh();

    console.log('✅ GST Tax Invoice ready');
}

/* =====================================================================
   SECTION 22 — BOOTSTRAP (no auth gate)
   ===================================================================== */

function bootstrap() {
    syncThemeWithParent();
    const main = document.getElementById('mainContent');
    const loading = document.getElementById('appLoading');
    if (loading) loading.classList.add('hidden');
    if (main) {
        main.style.display = 'block';
        main.classList.add('visible');
    }
    initApp();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
} else {
    bootstrap();
}
