<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fleet Management Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== HIDE SCROLLBAR GLOBALLY BUT KEEP SCROLLING ENABLED ===== */
        /* For Webkit browsers (Chrome, Safari, Edge) - hide scrollbar but allow scroll */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            background: transparent;
            display: none;
        }
        
        /* For Firefox - hide scrollbar while keeping scroll functionality */
        * {
            scrollbar-width: none;  /* Firefox: hides scrollbar */
            -ms-overflow-style: none;  /* IE/Edge legacy */
        }
        
        /* Ensure all scrollable containers remain functional */
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        body::-webkit-scrollbar {
            display: none;
        }
        
        /* All scrollable elements will have hidden scrollbars but scroll normally */
        .sidebar, .main-content, .embed-view, .view-container, iframe, .nav-menu {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .sidebar::-webkit-scrollbar,
        .main-content::-webkit-scrollbar,
        .embed-view::-webkit-scrollbar,
        .view-container::-webkit-scrollbar,
        iframe::-webkit-scrollbar {
            display: none;
            width: 0;
        }

        :root {
            --bg-primary: #f4f7fc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #5b6e8c;
            --accent-primary: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.2);
            --accent-hover: #1d4ed8;
            --border-light: #e2e8f0;
            --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            --card-border: 1px solid rgba(0, 0, 0, 0.05);
            --transition: 0.25s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #0a0f1c;
            --bg-sidebar: #111827;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #9ca3af;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --border-light: #1f2a3e;
            --card-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.5);
            --card-border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            transition: background var(--transition), color var(--transition);
        }

        /* ----- DESKTOP LAYOUT: SIDEBAR 25% / MAIN 75% (NO FOOTER) ----- */
        .app-dashboard {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar: exactly 25% width on desktop, scrollable but no visible scrollbar */
        .sidebar {
            width: 25%;
            max-width: 320px;
            min-width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.8rem 1.5rem;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), background var(--transition);
            z-index: 100;
            overflow-y: auto;
            overflow-x: hidden;
            /* Scrollbar hidden but functional */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .sidebar::-webkit-scrollbar {
            display: none;
            width: 0;
        }

        /* Main content fills remaining 75% */
        .main-content {
            flex: 1;
            width: 75%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Content viewport wrapper - scrollable with hidden scrollbar */
        #contentViewport {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        #contentViewport::-webkit-scrollbar {
            display: none;
            width: 0;
        }
        
        /* Embedded iframes also need hidden scrollbars */
        .view-container {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-primary);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .view-container::-webkit-scrollbar {
            display: none;
        }
        
        iframe {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        iframe::-webkit-scrollbar {
            display: none;
        }

        /* Embed view scrollable area inside viewport */
        .embed-view {
            padding: 2rem 2rem;
            overflow-y: auto;
            height: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .embed-view::-webkit-scrollbar {
            display: none;
        }

        /* ----- ATTRACTIVE TIME/DATE CARD (REVAMPED) ----- */
        .datetime-premium {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-sidebar) 100%);
            border-radius: 28px;
            padding: 1rem 1.2rem;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
            border: var(--card-border);
            transition: transform 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(2px);
        }

        .datetime-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 38px -12px rgba(0, 0, 0, 0.15);
        }

        .time-greeting {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-greeting i {
            font-size: 0.7rem;
        }

        .clock-large {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Inter', monospace;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1.2;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .clock-large span {
            background: var(--accent-glow);
            padding: 0.1rem 0.2rem;
            border-radius: 12px;
        }

        .date-elegant {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            border-top: 1px dashed var(--border-light);
            padding-top: 10px;
            flex-wrap: wrap;
        }

        .date-elegant i {
            color: var(--accent-primary);
            font-size: 0.9rem;
        }

        .day-badge {
            background: var(--accent-primary);
            color: white;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Brand header */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(120deg, var(--accent-primary), #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1.8rem;
        }

        .brand-logo i {
            background: none;
            color: var(--accent-primary);
            font-size: 1.7rem;
        }

        /* Navigation */
        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex: 1;
            overflow-y: visible;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.9rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item i {
            width: 24px;
            font-size: 1.2rem;
        }

        .nav-item:hover {
            background: var(--bg-primary);
            color: var(--accent-primary);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 6px 12px -6px rgba(37, 99, 235, 0.3);
        }

        /* Settings card */
        .settings-row {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 1.5rem;
            border: var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 550px;
            box-shadow: var(--card-shadow);
        }

        .switch-label strong {
            font-size: 1rem;
        }

        .switch {
            position: relative;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #cbd5e1;
            transition: 0.2s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-primary);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Mobile header (Title + time) */
        .mobile-header {
            display: none;
            background: var(--bg-sidebar);
            backdrop-filter: blur(8px);
            padding: 1rem 1.2rem;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 15;
        }

        .mobile-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-title-area i {
            font-size: 1.4rem;
            color: var(--accent-primary);
        }

        .mobile-title-area span {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.3px;
        }

        .mobile-clock-compact {
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .menu-toggle-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* Mobile overlay & sidebar offcanvas */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 98;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Dashboard cards styling */
        .dashboard-cards {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 1.5rem;
            flex: 1;
            min-width: 180px;
            border: var(--card-border);
            box-shadow: var(--card-shadow);
        }

        /* ---------- RESPONSIVE: MOBILE ---------- */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
                z-index: 200;
                box-shadow: 5px 0 25px rgba(0,0,0,0.2);
                border-right: none;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
                opacity: 1;
            }

            .main-content {
                width: 100%;
                flex: 1;
                height: 100%;
            }

            .mobile-header {
                display: flex;
            }
        }

        /* Utility - remove footer if any */
        footer, .footer {
            display: none;
        }
        
        /* Ensure all scroll containers are functional but invisible */
        .sidebar, .main-content, #contentViewport, .embed-view, iframe {
            overflow-y: auto;
            overflow-x: hidden;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="app-dashboard" id="appRoot">
        <!-- Overlay for mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar (25% desktop) - scrollable but no scrollbar visible -->
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="brand-logo">
                    <i class="fa-solid fa-truck-fast"></i> 
                    <span>FleetManager</span>
                </div>

                <!-- Enhanced time + date card (attractive view) -->
                <div class="datetime-premium" id="premiumDateTimeCard">
                    <div class="time-greeting">
                        <i class="fa-regular fa-clock"></i> LIVE FLEET TIME
                    </div>
                    <div class="clock-large" id="dynamicClockDisplay">
                        --:--:--
                    </div>
                    <div class="date-elegant" id="dynamicDateDisplay">
                        <i class="fa-regular fa-calendar-alt"></i> 
                        <span id="dateText">--</span>
                        <span class="day-badge" id="dayBadge">--</span>
                    </div>
                </div>
            </div>

            <nav class="nav-menu">
                <button class="nav-item active" data-view="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </button>
				<button class="nav-item" data-view="reporting">
                    <i class="fa-solid fa fa-file"></i> Reporting
                </button>
                <button class="nav-item" data-view="payment">
                    <i class="fa-solid fa-credit-card"></i> Payment Record
                </button>
                <button class="nav-item" data-view="driver-details">
                    <i class="fa-solid fa-id-card"></i> Driver Details
                </button>
                <button class="nav-item" data-view="driver-salary">
                    <i class="fa-solid fa-money-check-dollar"></i> Driver Salary
                </button>
				<button class="nav-item" data-view="driver-expenses">
                    <i class="fa-solid fa-donate"></i> Driver Expenses
                </button>
				<button class="nav-item" data-view="MIS-EV-Vehicle">
                    <i class="fa-solid fa fa-truck"></i> MIS EV vehicle
                </button>
                <button class="nav-item" data-view="rough-work">
                    <i class="fa-solid fa-pen-to-square"></i> Rough Work
                </button>
                <button class="nav-item" data-view="settings">
                    <i class="fa-solid fa-gear"></i> Settings
                </button>
            </nav>
            <div style="height: 10px;"></div>
        </aside>

        <!-- Main content area 75% -->
        <main class="main-content">
            <!-- Mobile header: Title "Fleet Management" + Time (compact) -->
            <div class="mobile-header">
                <div class="mobile-title-area">
                    <button class="menu-toggle-btn" id="menuOpenBtn">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <i class="fa-solid fa-ship"></i>
                    <span>Fleet Management</span>
                </div>
                <div class="mobile-clock-compact" id="mobileTimeHeader">
                    00:00
                </div>
            </div>

            <!-- Scrollable viewport with hidden scrollbar but fully functional scrolling -->
            <div id="contentViewport"></div>
        </main>
    </div>

    <script>
        // ------------------------------
        // VIEW CONFIGURATION (NO FOOTER, SCROLLABLE HIDDEN SCROLLBARS)
        // ------------------------------
        const VIEWS_CONFIG = {
            'dashboard': { 
                type: 'html', 
                content: `<div class="embed-view">
                    <div style="background: var(--bg-card); border-radius: 32px; padding: 2rem; border: var(--card-border); box-shadow: var(--card-shadow);">
                        <h2 class="view-title" style="margin-top:0;"><i class="fa-solid fa-chart-line"></i> Operational Overview</h2>
                        <p style="color: var(--text-muted); margin-top: 1rem;">Welcome to FleetManager — central command for logistics, payments, driver insights and real-time analytics. Scroll to explore more content (scrollbar hidden but functional).</p>
                        <div class="dashboard-cards">
                            <div class="stat-card"><i class="fa-solid fa-truck" style="font-size: 1.8rem; color: var(--accent-primary);"></i><h3 style="margin: 12px 0 4px;">24</h3><p style="color: var(--text-muted);">Active Vehicles</p></div>
                            <div class="stat-card"><i class="fa-solid fa-users" style="font-size: 1.8rem; color: var(--accent-primary);"></i><h3 style="margin: 12px 0 4px;">18</h3><p style="color: var(--text-muted);">Drivers Online</p></div>
                            <div class="stat-card"><i class="fa-solid fa-chart-simple" style="font-size: 1.8rem; color: var(--accent-primary);"></i><h3 style="margin: 12px 0 4px;">97%</h3><p style="color: var(--text-muted);">On-Time Delivery</p></div>
                        </div>
                        <div style="margin-top: 2rem; background: var(--bg-primary); border-radius: 24px; padding: 1.5rem;">
                            <h4><i class="fa-regular fa-bell"></i> Recent Activity</h4>
                            <ul style="margin-top: 1rem; list-style: none;">
                                <li style="padding: 0.75rem 0; border-bottom: 1px solid var(--border-light);">✓ Trip #FT-234 completed - New York</li>
                                <li style="padding: 0.75rem 0; border-bottom: 1px solid var(--border-light);">✓ Salary processed for 12 drivers</li>
                                <li style="padding: 0.75rem 0;">✓ Maintenance update for vehicle #V-882</li>
                            </ul>
                        </div>
                        <div style="margin-top: 1.5rem; height: 200px; background: linear-gradient(145deg, var(--bg-primary), transparent); border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                            <i class="fa-regular fa-chart-line"></i> Performance metrics preview (scroll works)
                        </div>
                    </div>
                </div>`
            },
			'reporting': { type: 'iframe', src: 'Reporting/Reporting.html' },
            'payment': { type: 'iframe', src: 'payment.html' },
            'driver-details': { type: 'iframe', src: 'Others/DriverDet.html' },
			'driver-expenses': { type: 'iframe', src: 'Others/DriverExp.html' },
			'MIS-EV-Vehicle': { type: 'iframe', src: 'MIS EV/dashboard.html' },
            'driver-salary': { type: 'iframe', src: 'Driver Salary/dashboard.html' },
            'rough-work': { type: 'iframe', src: 'Rough/dashboard.html' },
            'settings': { 
                type: 'html', 
                content: `
                <div class="embed-view">
                    <div style="max-width: 700px;">
                        <h2 class="view-title"><i class="fa-solid fa-sliders-h"></i> Preferences & Configuration</h2>
                        <div class="settings-row">
                            <div class="switch-label">
                                <strong>Dark Mode Interface</strong>
                                <span style="font-size: 0.75rem; color: var(--text-muted);">Toggle between light & dark themes</span>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="globalThemeToggle" ${document.body.getAttribute('data-theme') === 'dark' ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <p style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-muted);"><i class="fa-regular fa-circle-check"></i> Dashboard preferences saved locally. Scroll area is fully functional without visible scrollbar.</p>
                        <div style="margin-top: 2rem; background: var(--bg-card); border-radius: 24px; padding: 1.5rem; border: var(--card-border);">
                            <h4>System Info</h4>
                            <p style="margin-top: 0.5rem;">Version 2.0 • Fleet Management Suite</p>
                            <p style="margin-top: 0.5rem;">All scroll containers support native scrolling with hidden scrollbars for clean UI.</p>
                        </div>
                    </div>
                </div>`
            }
        };

        // DOM elements
        let activeViewKey = 'dashboard';
        const viewport = document.getElementById('contentViewport');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        // Enhanced time & date updater (attractive card)
        function updateDateTimePremium() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const timeString12hr = `${hours.toString()}:${minutes}:${seconds} ${ampm}`;
            
            const optionsDate = { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' };
            const fullDateStr = now.toLocaleDateString(undefined, optionsDate);
            const dayName = now.toLocaleDateString(undefined, { weekday: 'long' });
            
            const clockDisplayElem = document.getElementById('dynamicClockDisplay');
            const dateTextElem = document.getElementById('dateText');
            const dayBadgeElem = document.getElementById('dayBadge');
            if (clockDisplayElem) clockDisplayElem.innerHTML = `<span>${timeString12hr}</span>`;
            if (dateTextElem) dateTextElem.textContent = fullDateStr;
            if (dayBadgeElem) dayBadgeElem.textContent = dayName;
            
            const mobileTimeSpan = document.getElementById('mobileTimeHeader');
            if (mobileTimeSpan) {
                const mobileTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                mobileTimeSpan.textContent = mobileTime;
            }
        }
        
        // Load view manager (keeps scroll hidden but functional)
        function loadView(viewKey, clickedBtn = null) {
            if (!VIEWS_CONFIG[viewKey]) return;
            activeViewKey = viewKey;
            const config = VIEWS_CONFIG[viewKey];
            
            // Update active nav style
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-view') === viewKey) {
                    btn.classList.add('active');
                }
            });
            
            // Render content - scroll remains functional with hidden scrollbars
            if (config.type === 'iframe') {
                viewport.innerHTML = `<iframe class="view-container" src="${config.src}" title="Fleet Management Module" style="scrollbar-width: none; -ms-overflow-style: none;"></iframe>`;
                // Ensure iframe body also hides scrollbar (cross-origin limitation but applies to container)
                const iframeElem = viewport.querySelector('iframe');
                if (iframeElem) {
                    iframeElem.style.scrollbarWidth = 'none';
                    iframeElem.style.overflow = 'auto';
                }
            } else {
                viewport.innerHTML = config.content;
                // Force all scrollable containers inside embed-view to hide scrollbars
                const embedDivs = viewport.querySelectorAll('.embed-view');
                embedDivs.forEach(div => {
                    div.style.scrollbarWidth = 'none';
                    div.style.overflowY = 'auto';
                });
                // Re-attach theme toggle if settings view
                if (viewKey === 'settings') {
                    const themeToggle = document.getElementById('globalThemeToggle');
                    if (themeToggle) {
                        themeToggle.addEventListener('change', (e) => {
                            const newTheme = e.target.checked ? 'dark' : 'light';
                            document.body.setAttribute('data-theme', newTheme);
                            localStorage.setItem('user-theme-preference', newTheme);
                        });
                    }
                }
            }
            
            // Close sidebar on mobile after navigation
            if (window.innerWidth <= 992) {
                closeMobileSidebar();
            }
        }
        
        // Theme initialization
        function initTheme() {
            const stored = localStorage.getItem('user-theme-preference');
            if (stored) {
                document.body.setAttribute('data-theme', stored);
            } else {
                document.body.setAttribute('data-theme', 'dark');
            }
        }
        
        // Bind navigation events
        function bindNavEvents() {
            const navBtns = document.querySelectorAll('.nav-item');
            navBtns.forEach(btn => {
                btn.removeEventListener('click', navHandler);
                btn.addEventListener('click', navHandler);
            });
        }
        
        function navHandler(e) {
            const view = this.getAttribute('data-view');
            if (view) loadView(view, this);
        }
        
        // Mobile sidebar controls
        function openMobileSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        }
        
        function closeMobileSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
        
        // Swipe gestures for mobile
        function initSwipeGestures() {
            let touchStart = 0;
            const container = document.getElementById('appRoot');
            if (!container) return;
            container.addEventListener('touchstart', (e) => {
                touchStart = e.changedTouches[0].screenX;
            }, { passive: true });
            container.addEventListener('touchend', (e) => {
                const touchEnd = e.changedTouches[0].screenX;
                const diff = touchEnd - touchStart;
                const isMobile = window.innerWidth <= 992;
                if (!isMobile) return;
                if (diff > 70 && touchStart < 45) {
                    openMobileSidebar();
                } else if (diff < -70 && sidebar.classList.contains('open')) {
                    closeMobileSidebar();
                }
            });
        }
        
        // Initialize app
        function initializeApp() {
            initTheme();
            bindNavEvents();
            loadView('dashboard');
            updateDateTimePremium();
            setInterval(updateDateTimePremium, 1000);
            
            const menuBtn = document.getElementById('menuOpenBtn');
            if (menuBtn) menuBtn.addEventListener('click', openMobileSidebar);
            if (overlay) overlay.addEventListener('click', closeMobileSidebar);
            
            window.addEventListener('resize', () => {
                if (window.innerWidth > 992) {
                    closeMobileSidebar();
                }
            });
            
            initSwipeGestures();
            
            // Global theme sync for dynamically created toggle
            document.addEventListener('change', (e) => {
                if (e.target && e.target.id === 'globalThemeToggle') {
                    const isDark = e.target.checked;
                    document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                    localStorage.setItem('user-theme-preference', isDark ? 'dark' : 'light');
                }
            });
        }
        
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
