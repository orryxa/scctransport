<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>3108 Driver Salary | Smart Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ======================== CSS VARIABLES FOR THEMING ======================== */
        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --secondary-dark: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fbbf24;
            --info: #06b6d4;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --transition-slow: 500ms ease;
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page.active-page {
            display: block;
        }
        
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .soft-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .desktop-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mobile-buttons {
            display: none;
        }

        .search-wrapper {
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .search-wrapper input::placeholder {
            color: var(--text-light);
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
            padding: 0;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        .data-table th {
            text-align: left;
            padding: 16px 16px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--primary);
        }

        .data-table td {
            padding: 16px 16px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
            transition: background var(--transition-fast);
        }

        .data-table tr:hover td {
            background: var(--table-row-hover);
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            font-size: 14px;
            margin-left: 8px;
            cursor: help;
        }
        .sync-badge::after {
            content: "✓";
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        @media (max-width: 640px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
        }

        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .detail-card.negative {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border-left: 4px solid var(--danger);
        }

        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .detail-value.negative {
            color: var(--danger);
        }

        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: white;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }

        .field input, 
        .field select, 
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .field input:focus, 
        .field select:focus, 
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .field input:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .fullwidth {
            grid-column: 1 / -1;
        }

        .calculated-field {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.05));
            font-weight: 600;
        }

        .info-badge {
            display: inline-block;
            background: var(--primary-light);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .autocomplete-wrap {
            position: relative;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            box-shadow: var(--shadow-lg);
            margin-top: 6px;
            border: 1px solid var(--border-color);
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition-fast);
            color: var(--text-primary);
        }

        .autocomplete-item:hover {
            background: var(--primary);
            color: white;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .summary-table th,
        .summary-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .summary-table th {
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 700;
        }
        .summary-table tr:hover td {
            background: var(--table-row-hover);
        }
        .total-row {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            font-weight: 700;
        }
        .total-row td {
            border-top: 2px solid var(--primary);
            font-size: 1rem;
        }
        .amount-positive {
            color: var(--success);
            font-weight: 600;
        }
        .amount-negative {
            color: var(--danger);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .card-header { padding: 1rem 1.2rem; }
            .card-header h2 { font-size: 1.3rem; }
            .search-section { padding: 1rem 1.2rem; }
            .desktop-buttons { display: none; }
            .mobile-buttons { display: grid !important; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; width: 100%; }
            .mobile-buttons .btn { width: 100%; justify-content: center; padding: 12px 16px; font-size: 0.85rem; }
            .data-table th, .data-table td { padding: 12px 10px; font-size: 0.75rem; }
            .btn { padding: 8px 18px; font-size: 0.8rem; }
            .modal-box { width: 95%; border-radius: 1.5rem; }
            .form-grid { grid-template-columns: 1fr; gap: 1rem; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--table-header-bg); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        .table-wrapper::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar,
        .autocomplete-list::-webkit-scrollbar,
        .details-grid::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            background: transparent;
            display: none;
        }
        
        .table-wrapper, .modal-box, .autocomplete-list, .details-grid, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .table-wrapper { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }
        .modal-box { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        .autocomplete-list { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        .details-grid { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        .modal-body { overflow-y: auto; max-height: calc(85vh - 70px); scrollbar-width: none; }
        .modal-body::-webkit-scrollbar { display: none; }
        
        @media (max-width: 768px) {
            .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
    </style>
</head>
<body>

            <div class="modal-body" id="salaryModalBody"></div>

    <script>
        /* ======================== DARK MODE SYNC ======================== */
        function syncThemeWithParent() {
            const localTheme = localStorage.getItem('user-theme-preference');
            if (localTheme) {
                document.body.setAttribute('data-theme', localTheme);
                document.documentElement.setAttribute('data-theme', localTheme);
            } else {
                try {
                    if (window.parent && window.parent.document.body) {
                        const parentTheme = window.parent.document.body.getAttribute('data-theme');
                        if (parentTheme) {
                            document.body.setAttribute('data-theme', parentTheme);
                            document.documentElement.setAttribute('data-theme', parentTheme);
                        }
                    }
                } catch(e) { console.log("Cross-origin frame safety intercept setup complete."); }
            }
        }

        window.addEventListener('DOMContentLoaded', syncThemeWithParent);
        window.addEventListener('storage', syncThemeWithParent);
        setInterval(syncThemeWithParent, 1000);
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'themeChange') {
                const newTheme = event.data.theme;
                if (newTheme) { document.body.setAttribute('data-theme', newTheme); document.documentElement.setAttribute('data-theme', newTheme); }
            }
        });
        
        // ==================== CONFIGURATION ====================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoDds81u8M5N8micA_hoIBgCS7aCFm0NUmwW6XLH4m_fRJ8R9pGqjgFGMeBxBd2dSL/exec";
        const PRIMARY_SPREADSHEET_ID = "1fTQ7K6qvx1IBpaXA_okS90IDbCBhFzpVLkXneLJtiTY";
        const PRIMARY_SHEET_NAME = "Cam_Taloja_3108";
        const LEGACY_SPREADSHEET_ID = "1GaphoayNzhbQ8RV9z1D45Djr5hsRjUPgyKrtmkjjhGI";
        const LEGACY_SHEET_NAME = "Cam_Taloja_3108";
        const DRIVER_DETAILS_SHEET = "Driver Details";
        
        const CACHE_KEY = "salary_trips_cache_v3";
        const DIST_CACHE_KEY = "salary_dist_cache_v3";
        const CACHE_TTL = 15 * 60 * 1000;
        
        let allTrips = [];
        let currentViewTrip = null;
        let currentRowIndex = null;
        let vehicleOptions = [];
        let driverOptions = [];

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }
        
        function formatToDDMMYYYY(dateInput) {
            if (!dateInput) return '';
            try {
                let dateObj;
                if (dateInput instanceof Date) { dateObj = dateInput; }
                else if (typeof dateInput === 'string') {
                    if (dateInput.match(/^\d{2}\/\d{2}\/\d{4}$/)) return dateInput;
                    if (dateInput.match(/^\d{4}-\d{2}-\d{2}$/)) {
                        const [year, month, day] = dateInput.split('-');
                        return `${day}/${month}/${year}`;
                    }
                    dateObj = new Date(dateInput);
                    if (isNaN(dateObj.getTime())) return dateInput;
                } else { return ''; }
                const day = String(dateObj.getDate()).padStart(2, '0');
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const year = dateObj.getFullYear();
                return `${day}/${month}/${year}`;
            } catch (error) { return dateInput || ''; }
        }
        
        function convertToYYYYMMDD(dateStr) {
            if (!dateStr) return "";
            try {
                if (dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) return dateStr;
                if (dateStr.includes('/')) {
                    const parts = dateStr.split('/');
                    if (parts.length === 3) {
                        const day = parts[0].padStart(2, '0');
                        const month = parts[1].padStart(2, '0');
                        let year = parts[2];
                        if (year.length === 2) year = '20' + year;
                        return `${year}-${month}-${day}`;
                    }
                }
                const date = new Date(dateStr);
                if (!isNaN(date.getTime())) return date.toISOString().split('T')[0];
                return "";
            } catch (error) { return ""; }
        }
        
        function formatDisplayDate(dateInput) {
            if (!dateInput) return '—';
            const formatted = formatToDDMMYYYY(dateInput);
            return formatted || '—';
        }
        
        function cleanLrNumber(lr) {
            if (!lr) return "";
            return String(lr).replace(/,/g, '');
        }

            dom.globalModal.classList.add('active');
            if (autoClose > 0) setTimeout(() => dom.globalModal.classList.remove('active'), autoClose);
        }
        
        function showSpinner(element, show, customHtml = null) {
            if (!element) return;
            if (show) {
                element.disabled = true;
                const originalText = element.innerHTML;
                element.setAttribute('data-original-text', originalText);
                element.innerHTML = customHtml || '<span class="spinner"></span> Loading...';
            } else {
                element.disabled = false;
                const original = element.getAttribute('data-original-text');
                if (original) element.innerHTML = original;
            }
        }
        
        function calculateMileage(kmValue) {
            const km = parseFloat(kmValue) || 0;
            if (km <= 150) return "Fix";
            if (km > 150 && km <= 200) return "4";
            if (km > 200) return "5";
            return "Fix";
        }

        function calculateDieselAmt(mileageVal, kmValue, destinationVal, cngRate = 98) {
            const km = parseFloat(kmValue) || 0;
            const dest = (destinationVal || "").toLowerCase();
            if (dest === "bhiwandi" || dest === "421302") return 2300;
            if (mileageVal === "Fix" && km <= 150) return 3200;
            const mileage = parseFloat(mileageVal);
            if (!isNaN(mileage) && mileage > 0 && km > 0) {
                return Math.round((km / mileage) * cngRate);
            }
            return 0;
        }

        function calculateAllFields(formData) {
            const km = parseFloat(formData.Km) || 0;
            const destination = formData.Destination || "";
            const unloadingCharge = parseFloat(formData["L and UL"]) || 0;
            const salaryAdvance = parseFloat(formData["Salary Advance"]) || 0;
            const otherExp = parseFloat(formData["Other Exp"]) || 0;
            const actualIntent = parseFloat(formData["Actual Intent"]) || 0;
            const mileageValue = calculateMileage(km);
            const cngRate = 98;
            const dieselAmt = calculateDieselAmt(mileageValue, km, destination, cngRate);
            const subtotalBeforeBata = unloadingCharge + dieselAmt + salaryAdvance + otherExp;
            const driverBata = actualIntent - subtotalBeforeBata;
            const driverTakenAmt = dieselAmt + driverBata;
            const totalAmount = unloadingCharge + driverTakenAmt + salaryAdvance + otherExp;
            return {
                Mileage: mileageValue,
                "CNG OR Diesel Rate": cngRate,
                "Diesel Amt": dieselAmt,
                "Driver Bata": driverBata,
                "Driver Taken Amt": driverTakenAmt,
                "Total Amount": totalAmount
            };
        }
        
        // ==================== FAST CACHED FETCH (EXACT PATTERN FROM 3108form.html) ====================
        async function fetchWithBackgroundCache(url, cacheKey, ttl) {
            const cached = localStorage.getItem(cacheKey);
            let cachedData = null;
            
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < ttl) {
                        cachedData = data;
                    }
                } catch (e) { }
            }
            
            if (cachedData && !preloadInProgress) {
                fetchFreshDataInBackground(url, cacheKey);
                return cachedData;
            }
            
            try {
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    let formattedData = result.data;
                    if (cacheKey !== DIST_CACHE_KEY) {
                        formattedData = result.data.map(row => {
                            if (row['Date']) row['Date'] = formatToDDMMYYYY(row['Date']);
                            if (row['NEFT Date']) row['NEFT Date'] = formatToDDMMYYYY(row['NEFT Date']);
                            return row;
                        });
                    }
                    localStorage.setItem(cacheKey, JSON.stringify({ data: formattedData, timestamp: Date.now() }));
                    return formattedData;
                }
                return [];
            } catch (err) {
                console.error("Fetch error:", err);
                return cachedData || [];
            }
        }
        
        async function fetchFreshDataInBackground(url, cacheKey) {
            preloadInProgress = true;
            try {
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    let formattedData = result.data;
                    if (cacheKey !== DIST_CACHE_KEY) {
                        formattedData = result.data.map(row => {
                            if (row['Date']) row['Date'] = formatToDDMMYYYY(row['Date']);
                            if (row['NEFT Date']) row['NEFT Date'] = formatToDDMMYYYY(row['NEFT Date']);
                            return row;
                        });
                    }
                    localStorage.setItem(cacheKey, JSON.stringify({ data: formattedData, timestamp: Date.now() }));
                    
                    if (cacheKey === CACHE_KEY && formattedData.length !== allTrips.length) {
                        await loadAllTrips(true);
                        renderTablePage1(dom.searchInput?.value || "");
                    }
                    if (cacheKey === DIST_CACHE_KEY) {
                        updateDriverOptionsFromData(formattedData);
                    }
                }
            } catch (err) {
                console.warn("Background fetch failed:", err);
            } finally {
                preloadInProgress = false;
            }
        }
        
        async function loadTripsFast() {
            const url = `${SCRIPT_URL}?spreadsheetId=${PRIMARY_SPREADSHEET_ID}&sheetName=${PRIMARY_SHEET_NAME}&_=${Date.now()}`;
            const data = await fetchWithBackgroundCache(url, CACHE_KEY, CACHE_TTL);
            return data;

        async function loadLegacyFast() {
            const url = `${SCRIPT_URL}?spreadsheetId=${LEGACY_SPREADSHEET_ID}&sheetName=${LEGACY_SHEET_NAME}&_=${Date.now()}`;
            const data = await fetchWithBackgroundCache(url, `${CACHE_KEY}_legacy`, CACHE_TTL);

        async function loadDriverOptionsFast() {
            const url = `${SCRIPT_URL}?spreadsheetId=${PRIMARY_SPREADSHEET_ID}&sheetName=${DRIVER_DETAILS_SHEET}&_=${Date.now()}`;
            const data = await fetchWithBackgroundCache(url, DIST_CACHE_KEY, CACHE_TTL);
            updateDriverOptionsFromData(data);
            return { vehicleOptions, driverOptions };
        }
        
        function updateDriverOptionsFromData(data) {
            const vehicles = new Set();
            const drivers = new Set();
            if (data && Array.isArray(data)) {
                data.forEach(row => {
                    if (row["Vehicle No"]) vehicles.add(row["Vehicle No"].trim());
                    if (row["Driver Name"]) drivers.add(row["Driver Name"].trim());
                });
            }
            vehicleOptions = Array.from(vehicles);
            driverOptions = Array.from(drivers);
        }
        
        function processTripWithCalculations(rawTrip, isInPrimary = false) {
            const startKm = parseFloat(rawTrip["Start KM"] || rawTrip["Opening Km"]) || 0;
            const endKm = parseFloat(rawTrip["End KM"] || rawTrip["Closing Km"]) || 0;
            const km = parseFloat(rawTrip["Distance"] || rawTrip["Km"]) || Math.max(0, endKm - startKm);
            const unloadingCharge = parseFloat(rawTrip["Unloading Charge"] || rawTrip["L and UL"]) || 0;
            const salaryAdvance = parseFloat(rawTrip["Salary Advance"]) || 0;
            const otherExp = parseFloat(rawTrip["Other Exp"]) || 0;
            const actualIntent = parseFloat(rawTrip["Actual Intent"] || rawTrip["NEFT Amt"]) || 0;
            const mileageRaw = calculateMileage(km);
            const cngRate = 98;
            const dieselAmt = calculateDieselAmt(mileageRaw, km, rawTrip["Destination"], cngRate);
            const subtotalBeforeBata = unloadingCharge + dieselAmt + salaryAdvance + otherExp;
            const driverBata = actualIntent - subtotalBeforeBata;
            const driverTakenAmt = dieselAmt + driverBata;
            const totalAmount = unloadingCharge + driverTakenAmt + salaryAdvance + otherExp;
            let vehicleVal = rawTrip["Vehicles"] || "";
            let driverNameVal = rawTrip["Driver Name"] || "";
            if (!vehicleVal && vehicleOptions.length) vehicleVal = vehicleOptions[0];
            if (!driverNameVal && driverOptions.length) driverNameVal = driverOptions[0];
            return {
                "Sr. No": rawTrip["Sr. No"] || "",
                "Date": rawTrip["Date"] || "",
                "LR No": cleanLrNumber(rawTrip["LR No"] || ""),
                "Vehicles": vehicleVal,
                "Driver Name": driverNameVal,
                "Mileage": mileageRaw,
                "Destination": rawTrip["Destination"] || "",
                "Opening Km": startKm,
                "Closing Km": endKm,
                "Km": km,
                "CNG OR Diesel Rate": cngRate,
                "L and UL": unloadingCharge,
                "Driver Taken Amt": driverTakenAmt,
                "Diesel Amt": dieselAmt,
                "Driver Bata": driverBata,
                "Salary Advance": salaryAdvance,
                "Other Exp": otherExp,
                "Total Amount": totalAmount,
                "Actual Intent": actualIntent,
                "_inPrimary": isInPrimary
            };
        }
        
        async function loadAllTrips(skipCache = false) {
            if (skipCache) {
                localStorage.removeItem(CACHE_KEY);
                localStorage.removeItem(`${CACHE_KEY}_legacy`);
            }
            
            let primaryData = await loadTripsFast();
            let fallbackData = await loadLegacyFast();
            
            primaryDataLrSet.clear();
            primaryData.forEach(row => {
                const lr = row["LR No"] ? cleanLrNumber(row["LR No"]).trim() : "";
                if (lr) primaryDataLrSet.add(lr);
            });
            
            const fallbackMap = new Map();
            fallbackData.forEach(row => {
                const lr = row["LR No"] ? cleanLrNumber(row["LR No"]).trim() : "";
                if (lr) fallbackMap.set(lr, row);
            });
            
            let mergedRaw = [];
            if (primaryData.length === 0 && fallbackData.length > 0) {
                mergedRaw = fallbackData;
            } else {
                mergedRaw = primaryData.map(row => {
                    const lr = row["LR No"] ? cleanLrNumber(row["LR No"]).trim() : "";
                    const fb = fallbackMap.get(lr);
                    if (fb) return { ...fb, ...row };
                    return row;
                });
                const primaryLrSet_temp = new Set(primaryData.map(r => r["LR No"] ? cleanLrNumber(r["LR No"]).trim() : ""));
                fallbackData.forEach(fb => {
                    const lr = fb["LR No"] ? cleanLrNumber(fb["LR No"]).trim() : "";
                    if (lr && !primaryLrSet_temp.has(lr)) mergedRaw.push(fb);
                });
            }
            
            const processed = mergedRaw.map(raw => {
                const lr = raw["LR No"] ? cleanLrNumber(raw["LR No"]).trim() : "";
                const isInPrimary = primaryDataLrSet.has(lr);
                return processTripWithCalculations(raw, isInPrimary);
            });
            processed.sort((a,b) => (parseInt(a["Sr. No"]) || 0) - (parseInt(b["Sr. No"]) || 0));
            allTrips = processed;
            return processed;
        }
        
        function renderTablePage1(filter = "") {
            if (!dom.tableBody) return;
            const searchLower = filter.toLowerCase();
            let filtered = allTrips.filter(t => {
                const lr = (t["LR No"] || "").toString().toLowerCase();
                const sr = (t["Sr. No"] || "").toString().toLowerCase();
                const date = (t["Date"] || "").toString().toLowerCase();
                return lr.includes(searchLower) || sr.includes(searchLower) || date.includes(searchLower);
            });
            if (!filtered.length) {
                dom.tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">✨ No trips found</td></tr>';
                return;
            }
            const fragment = document.createDocumentFragment();
            filtered.forEach(t => {
                const row = document.createElement('tr');
                const syncBadge = t._inPrimary ? '<span class="sync-badge" title="Data synced to primary sheet"></span>' : '';
                const displayDate = formatDisplayDate(t["Date"]);
                row.innerHTML = `
                    <td><strong>${escapeHtml(t["Sr. No"] || "")}${syncBadge}</strong></td>
                    <td>${escapeHtml(displayDate)}</td>
                    <td>${escapeHtml(t["LR No"] || "")}</td>
                    <td><button class="btn btn-sm btn-outline viewBtn" data-sr="${escapeHtml(t["Sr. No"] || "")}">👁️ View</button></td>
                `;
                fragment.appendChild(row);
            });
            dom.tableBody.innerHTML = '';
            dom.tableBody.appendChild(fragment);
            dom.tableBody.querySelectorAll('.viewBtn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const srVal = btn.getAttribute('data-sr');
                    const found = allTrips.find(t => String(t["Sr. No"]) === String(srVal));
                    if (found) {
                        currentViewTrip = found;
                        currentRowIndex = allTrips.findIndex(t => String(t["Sr. No"]) === String(srVal)) + 2;
                        showPage2Details(found);
                    }
                });
            });

        function showPage2Details(trip) {
            if (!dom.detailsContainer) return;
            const displayHeaders = ["Sr. No", "Date", "LR No", "Vehicles", "Driver Name", "Mileage", "Destination", "Opening Km", "Closing Km", "Km", "CNG OR Diesel Rate", "L and UL", "Driver Taken Amt", "Diesel Amt", "Driver Bata", "Salary Advance", "Other Exp", "Total Amount", "Actual Intent"];
            const fragment = document.createDocumentFragment();
            displayHeaders.forEach(header => {
                let val = trip[header] !== undefined ? trip[header] : "";
                if (header === "Date") val = formatDisplayDate(val);
                const isNegative = (header === "Driver Bata" && typeof val === 'number' && val < 0);
                const card = document.createElement('div');
                card.className = 'detail-card' + (isNegative ? ' negative' : '');
                const displayValue = typeof val === 'number' ? val.toLocaleString('en-IN') : String(val);
                card.innerHTML = `<div class="detail-label">${escapeHtml(header)}</div><div class="detail-value ${isNegative ? 'negative' : ''}">${escapeHtml(displayValue) || '—'}</div>`;
                fragment.appendChild(card);
            });
            dom.detailsContainer.innerHTML = '';
            dom.detailsContainer.appendChild(fragment);
            dom.page1?.classList.remove('active-page');
            dom.page2?.classList.add('active-page');
        }
        
        function goToPage1() {

        async function refreshInBackground() {
            const url = `${SCRIPT_URL}?spreadsheetId=${PRIMARY_SPREADSHEET_ID}&sheetName=${PRIMARY_SHEET_NAME}&_=${Date.now()}`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                const formattedData = result.data.map(row => {
                    if (row['Date']) row['Date'] = formatToDDMMYYYY(row['Date']);
                    if (row['NEFT Date']) row['NEFT Date'] = formatToDDMMYYYY(row['NEFT Date']);
                    return row;

                localStorage.setItem(CACHE_KEY, JSON.stringify({ data: formattedData, timestamp: Date.now() }));
                await loadAllTrips(true);
                renderTablePage1(dom.searchInput?.value || "");

        }

            if (dom.refreshBtn) showSpinner(dom.refreshBtn, true);
            try {
                localStorage.removeItem(CACHE_KEY);
                localStorage.removeItem(`${CACHE_KEY}_legacy`);

        function setupAutocomplete(inputId, listId, optionsArray) {
            const input = document.getElementById(inputId);
            const listEl = document.getElementById(listId);
            if (!input || !listEl) return;
            function showOptions(filterVal = '') {
                const term = filterVal.toLowerCase();
                const filtered = optionsArray.filter(opt => opt.toLowerCase().includes(term));
                if (filtered.length) {
                    listEl.innerHTML = filtered.map(opt => `<div class="autocomplete-item" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`).join('');
                    listEl.style.display = 'block';
                    listEl.querySelectorAll('.autocomplete-item').forEach(item => {
                        item.addEventListener('click', (e) => {
                            input.value = item.getAttribute('data-value');
                            listEl.style.display = 'none';
                            input.dispatchEvent(new Event('input', { bubbles: true }));
                        });
                    });
                } else { listEl.style.display = 'none'; }
            }
            input.addEventListener('input', (e) => showOptions(e.target.value));
            input.addEventListener('focus', () => showOptions(input.value));
            input.addEventListener('blur', () => setTimeout(() => listEl.style.display = 'none', 200));
            document.addEventListener('click', (e) => {
                if (!listEl.contains(e.target) && e.target !== input) listEl.style.display = 'none';
            });
        }

                setupAutocomplete('field_DriverName', 'driverAutoList', driverOptions);
            }, 20);
            const updateCalculations = () => {
                const formData = {
                    Km: document.getElementById('field_Km')?.value || "0",
                    Destination: document.getElementById('field_Destination')?.value || "",
                    "L and UL": document.getElementById('field_LandUL')?.value || "0",
                    "Salary Advance": document.getElementById('field_SalaryAdvance')?.value || "0",
                    "Other Exp": document.getElementById('field_OtherExp')?.value || "0",
                    "Actual Intent": document.getElementById('field_ActualIntent')?.value || "0"
                };
                const calcResults = calculateAllFields(formData);
                const fields = ['Mileage', 'CNGORDieselRate', 'DieselAmt', 'DriverBata', 'DriverTakenAmt', 'TotalAmount'];
                const mappings = { Mileage: 'Mileage', CNGORDieselRate: 'CNG OR Diesel Rate', DieselAmt: 'Diesel Amt', DriverBata: 'Driver Bata', DriverTakenAmt: 'Driver Taken Amt', TotalAmount: 'Total Amount' };
                for (let f of fields) {
                    const el = document.getElementById(`field_${f}`);
                    if (el) el.value = calcResults[mappings[f]];
                }
                const driverBataField = document.getElementById('field_DriverBata');
                if (driverBataField && calcResults["Driver Bata"] < 0) {
                    driverBataField.style.color = '#dc2626';
                    driverBataField.style.fontWeight = 'bold';
                } else if (driverBataField) { driverBataField.style.color = ''; }
            };
            ['field_Km', 'field_Destination', 'field_LandUL', 'field_SalaryAdvance', 'field_OtherExp', 'field_ActualIntent'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', updateCalculations);
            });
            updateCalculations();
            document.getElementById('cancelSalaryBtn')?.addEventListener('click', () => dom.salaryModal.classList.remove('active'));
            const form = document.getElementById('salaryForm');
            form?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const saveBtn = document.getElementById('updateSalaryBtn');
                showSpinner(saveBtn, true, 'Updating...');
                const updatedData = {};
                for (let header of displayHeaders) {
                    let val = "";
                    if (header === "Vehicles") val = document.getElementById('field_Vehicles')?.value || "";
                    else if (header === "Driver Name") val = document.getElementById('field_DriverName')?.value || "";
                    else val = document.getElementById(`field_${header.replace(/\s/g, '')}`)?.value || "";
                    if (header === "Date") val = formatToDDMMYYYY(val);
                    updatedData[header] = val;
                }
                const params = new URLSearchParams();
                params.append("action", "update");
                params.append("spreadsheetId", PRIMARY_SPREADSHEET_ID);
                params.append("sheetName", PRIMARY_SHEET_NAME);
                params.append("rowIndex", currentRowIndex);
                for (let [key, val] of Object.entries(updatedData)) params.append(key, val);
                try {
                    const resp = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params });
                    const result = await resp.json();
                    if (result.status === "success") {
                        showModal("✅ Record updated successfully!", "Success", false, null, 1500);
                        dom.salaryModal.classList.remove('active');
                        await refreshAllData();
                        const refreshed = allTrips.find(t => String(t["Sr. No"]) === String(currentViewTrip["Sr. No"]));
                        if (refreshed) { currentViewTrip = refreshed; showPage2Details(currentViewTrip); }
                        else { goToPage1(); }
                    } else { showModal("Update failed: " + (result.message || "unknown"), "Error"); }
                } catch(err) { showModal("Error: "+err.message, "Error"); }
                finally { showSpinner(saveBtn, false); }
            });
        }
        
        // ==================== INITIALIZATION (EXACT PATTERN FROM 3108form.html) ====================
        async function fastInit() {
            cacheDomElements();
            
            if (dom.tableBody) {
                dom.tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;"><div class="spinner"></div> Loading trips...</td></tr>';
            }
            
            await loadDriverOptionsFast();
            allTrips = await loadAllTrips();
            renderTablePage1("");
            
            setTimeout(() => refreshInBackground(), 3000);
            
            dom.refreshBtn?.addEventListener('click', refreshAllData);
            
            if (dom.mobileRefreshBtn) {
                dom.mobileRefreshBtn.addEventListener('click', async () => {
                    if (dom.mobileRefreshBtn) showSpinner(dom.mobileRefreshBtn, true);
                    try {
                        localStorage.removeItem(CACHE_KEY);
                        localStorage.removeItem(`${CACHE_KEY}_legacy`);
                        localStorage.removeItem(DIST_CACHE_KEY);
                        allTrips = await loadAllTrips(true);
                        await loadDriverOptionsFast();
                        renderTablePage1(dom.searchInput?.value || "");
                    } catch (err) {
                        console.error("Refresh error:", err);
                        showModal("❌ Refresh failed: " + err.message, "Error");
                    } finally {
                        if (dom.mobileRefreshBtn) showSpinner(dom.mobileRefreshBtn, false);
                    }
                });
            }
            
            dom.calcTotalBtn?.addEventListener('click', showSummaryPopup);
            
            if (dom.mobileCalcTotalBtn) {
                dom.mobileCalcTotalBtn.addEventListener('click', () => dom.calcTotalBtn?.click());
            }
            
            dom.backBtn?.addEventListener('click', goToPage1);
            dom.manageSalaryBtn?.addEventListener('click', openSalaryModal);
            dom.deleteBtn?.addEventListener('click', deleteCurrentRecord);
            dom.searchInput?.addEventListener('input', (e) => {
                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => renderTablePage1(e.target.value), 300);
            });
            
            document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal?.classList.remove('active'));
            document.getElementById('closeSummaryModalBtn')?.addEventListener('click', () => dom.summaryModal?.classList.remove('active'));
            document.getElementById('closeSalaryModalBtn')?.addEventListener('click', () => dom.salaryModal?.classList.remove('active'));
            
            window.onclick = (e) => {
                if (e.target.classList?.contains('modal-overlay')) e.target.classList.remove('active');
            };
        }
        
        fastInit();
    </script>
</body>
