<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Driver Expenses | Smart Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ======================== CSS VARIABLES FOR THEMING ======================== */
        :root {
            /* Light Mode Colors */
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            
            /* Brand Colors */
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --secondary-dark: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fbbf24;
            --info: #06b6d4;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            
            /* Table Colors */
            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;
            
            /* Animation */
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --transition-slow: 500ms ease;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);
            
            /* Table Colors Dark */
            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
            position: relative;
        }

        /* App Container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Page animations */
        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page.active-page {
            display: block;
        }
        
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Cards */
        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .soft-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        /* Headers */
        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }

        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        /* Search Section */
        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        /* Buttons */
        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.7rem;
        }

        .btn-xs {
            padding: 4px 10px;
            font-size: 0.65rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Desktop Buttons */
        .desktop-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Mobile Buttons Grid */
        .mobile-buttons {
            display: none;
        }

        /* Search Input */
        .search-wrapper {
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .search-wrapper input::placeholder {
            color: var(--text-light);
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        /* Table Styles */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
            padding: 0;
        }

        .table-wrapper::-webkit-scrollbar {
            height: 6px;
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 3px solid var(--primary);
            position: relative;
        }

        .data-table th:first-child {
            border-top-left-radius: 12px;
        }

        .data-table th:last-child {
            border-top-right-radius: 12px;
        }

        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-primary);
            transition: background var(--transition-fast);
            font-size: 0.9rem;
        }

        .data-table tr:hover td {
            background: var(--table-row-hover);
        }

        /* Total Badge styling */
        .total-badge {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.8rem;
            box-shadow: var(--shadow-sm);
            min-width: 85px;
            text-align: center;
        }

        /* Action button in table */
        .view-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .view-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }

        /* Details Container - Enhanced for Table Format */
        .details-container {
            padding: 2rem;
        }

        .details-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
        }

        .details-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .details-header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .details-table-wrapper {
            overflow-x: auto;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            -webkit-overflow-scrolling: touch;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 500px;
        }

        .details-table th {
            background: var(--table-header-bg);
            padding: 12px 16px;
            text-align: left;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .details-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }

        .details-table tr:hover td {
            background: var(--table-row-hover);
        }

        /* Action buttons in details table */
        .details-action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .details-action-btns .btn {
            padding: 4px 10px;
            font-size: 0.65rem;
            border-radius: 20px;
        }

        .btn-edit-small {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-edit-small:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .btn-delete-small {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-delete-small:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .total-amount-box {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            flex-wrap: wrap;
            gap: 12px;
        }

        .total-amount-box .amount {
            font-size: 1.5rem;
            background: rgba(255,255,255,0.2);
            padding: 0.25rem 1.5rem;
            border-radius: 40px;
        }

        /* Action Row */
        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: white;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }

        .close-modal:hover {
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }

        .field input, 
        .field select, 
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .field input:focus, 
        .field select:focus, 
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .field input:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .fullwidth {
            grid-column: 1 / -1;
        }

        /* Vehicle Input Formatting */
        .vehicle-input {
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Autocomplete Styles */
        .autocomplete-wrap {
            position: relative;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            box-shadow: var(--shadow-lg);
            margin-top: 6px;
            border: 1px solid var(--border-color);
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition-fast);
            color: var(--text-primary);
        }

        .autocomplete-item:hover {
            background: var(--primary);
            color: white;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Loading Skeleton */
        .loading-skeleton {
            background: linear-gradient(90deg, var(--border-color) 25%, var(--table-header-bg) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ======================== RESPONSIVE DESIGN ======================== */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .card-header {
                padding: 1rem 1.2rem;
            }

            .card-header h2 {
                font-size: 1.3rem;
            }

            .search-section {
                padding: 1rem 1.2rem;
            }

            .desktop-buttons {
                display: none;
            }

            .mobile-buttons {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 16px;
                width: 100%;
            }

            .mobile-buttons .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 0.85rem;
            }

            .data-table th,
            .data-table td {
                padding: 10px 12px;
                font-size: 0.7rem;
            }

            .total-badge {
                padding: 4px 8px;
                font-size: 0.65rem;
                min-width: 55px;
            }

            .view-action-btn {
                padding: 4px 10px;
                font-size: 0.65rem;
            }

            .btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }

            .modal-box {
                width: 95%;
                border-radius: 1.5rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .details-container {
                padding: 0.5rem;
            }

            .details-header {
                padding: 0.75rem 1rem;
            }

            .details-header h3 {
                font-size: 1.1rem;
            }

            .details-header p {
                font-size: 0.8rem;
            }

            .details-table-wrapper {
                border-radius: 0.75rem;
                margin: 0 -0.5rem 1rem -0.5rem;
                border-left: none;
                border-right: none;
                border-radius: 0;
            }

            .details-table {
                font-size: 0.75rem;
                min-width: 400px;
            }

            .details-table th {
                padding: 8px 10px;
                font-size: 0.65rem;
            }

            .details-table td {
                padding: 8px 10px;
                font-size: 0.7rem;
            }

            .details-action-btns {
                flex-direction: column;
                gap: 4px;
            }

            .details-action-btns .btn {
                padding: 3px 8px;
                font-size: 0.6rem;
                border-radius: 16px;
                justify-content: center;
                width: 100%;
                min-width: 60px;
            }

            .total-amount-box {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
                flex-direction: column;
                text-align: center;
                gap: 6px;
            }

            .total-amount-box .amount {
                font-size: 1.2rem;
                padding: 0.15rem 1rem;
            }

            .action-row {
                padding: 0.75rem 1rem 1rem;
                justify-content: center;
            }

            .action-row .btn {
                flex: 1;
                justify-content: center;
                min-width: 100px;
            }
        }

        @media (max-width: 480px) {
            .details-table {
                font-size: 0.65rem;
                min-width: 320px;
            }

            .details-table th {
                padding: 6px 8px;
                font-size: 0.55rem;
            }

            .details-table td {
                padding: 6px 8px;
                font-size: 0.6rem;
            }

            .details-action-btns .btn {
                padding: 2px 6px;
                font-size: 0.5rem;
                min-width: 50px;
            }

            .details-header h3 {
                font-size: 0.95rem;
            }

            .total-amount-box .amount {
                font-size: 1rem;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--table-header-bg);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Hide scrollbars but keep scrolling */
        .table-wrapper::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar,
        .autocomplete-list::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            background: transparent;
            display: none;
        }
        
        .table-wrapper,
        .modal-box,
        .autocomplete-list,
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
        }
        
        .modal-body {
            overflow-y: auto;
            max-height: calc(85vh - 70px);
            scrollbar-width: none;
        }

        /* Dark mode specific */
        [data-theme="dark"] .details-table th {
            color: var(--primary-light);
        }

        [data-theme="dark"] .details-table tr:hover td {
            background: var(--table-row-hover);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- PAGE 1 - LIST -->
        <div id="page1" class="page active-page">
            <div class="soft-card">
                <div class="card-header">

    <script>
        /* ======================== DARK MODE SYNC ======================== */
        function syncThemeWithParent() {
            const localTheme = localStorage.getItem('user-theme-preference');
            if (localTheme) {
                document.body.setAttribute('data-theme', localTheme);
                document.documentElement.setAttribute('data-theme', localTheme);
            } else {
                try {
                    if (window.parent && window.parent.document.body) {
                        const parentTheme = window.parent.document.body.getAttribute('data-theme');
                        if (parentTheme) {
                            document.body.setAttribute('data-theme', parentTheme);
                            document.documentElement.setAttribute('data-theme', parentTheme);
                        }
                    }
                } catch(e) { }
            }
        }

        window.addEventListener('DOMContentLoaded', syncThemeWithParent);
        window.addEventListener('storage', syncThemeWithParent);
        setInterval(syncThemeWithParent, 1000);
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'themeChange') {
                const newTheme = event.data.theme;
                if (newTheme) {
                    document.body.setAttribute('data-theme', newTheme);
                    document.documentElement.setAttribute('data-theme', newTheme);
                }
            }
        });
        
        /* ======================== CONFIGURATION ======================== */
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoDds81u8M5N8micA_hoIBgCS7aCFm0NUmwW6XLH4m_fRJ8R9pGqjgFGMeBxBd2dSL/exec";
        const SPREADSHEET_ID = "1Aofp--fuGeDzONi8Y67pfCYOhOS6vEilCL8Nq5mBq00";
        const SHEET_NAME = "Driver Expenses";
        const DRIVER_INFO_SHEET = "Driver Info";
        const DRIVER_INFO_SPREADSHEET_ID = "1Aofp--fuGeDzONi8Y67pfCYOhOS6vEilCL8Nq5mBq00";
        
        const CACHE_KEY = "driver_exp_cache";
        const DRIVER_INFO_CACHE_KEY = "driver_info_cache";
        const CACHE_TTL = 15 * 60 * 1000;
        
        let allExpenses = [];
        let driverInfoData = [];
        let currentViewExpense = [];
        let currentViewDriver = "";
        let currentViewVehicle = "";
        let driverNameOptions = [];
        let vehicleNoOptions = [];
        let preloadInProgress = false;
        let searchDebounceTimer = null;
        let saveInProgress = false;
        
        const dom = {};

        /* ======================== DATE FORMATTING FUNCTIONS ======================== */
        function formatToDDMMYYYY(dateInput) {
            if (!dateInput || dateInput === '') return '—';
            
            try {
                if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
                    const [year, month, day] = dateInput.split('-');
                    return `${day}/${month}/${year}`;
                }
                
                if (typeof dateInput === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(dateInput)) {
                    return dateInput;
                }
                
                const dateObj = new Date(dateInput);
                if (!isNaN(dateObj.getTime())) {
                    const year = dateObj.getFullYear();
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    return `${day}/${month}/${year}`;
                }
                
                return '—';
            } catch (error) {
                console.error('Date display formatting error:', error);
                return '—';
            }
        }
        
        function formatToYYYYMMDD(dateString) {
            if (!dateString || dateString === '') return '';
            
            try {
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                    return dateString;
                }
                
                if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) {
                    const [day, month, year] = dateString.split('/');
                    return `${year}-${month}-${day}`;
                }
                
                return '';
            } catch (error) {
                console.error('Date conversion error:', error);
                return '';
            }
        }
        
        function formatDisplayDate(dateInput) {
            if (!dateInput) return '—';
            const formatted = formatToDDMMYYYY(dateInput);
            return formatted || '—';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }
        
        function showModal(msg, title = "Message", isConfirm = false, onConfirm = null, autoClose = 0) {
            if (!dom.globalModal) return;
            dom.modalTitle.innerText = title;
            dom.modalMsg.innerHTML = msg;
            const confirmBtn = document.getElementById('confirmModalBtn');
            if (confirmBtn) {
                confirmBtn.onclick = () => {
                    dom.globalModal.classList.remove('active');
                    if (isConfirm && onConfirm) onConfirm();
                };
            }
            dom.globalModal.classList.add('active');
            if (autoClose > 0) setTimeout(() => dom.globalModal.classList.remove('active'), autoClose);
        }
        
        function showSpinner(element, show, customHtml = null) {
            if (!element) return;
            if (show) {
                element.disabled = true;
                const originalText = element.innerHTML;
                element.setAttribute('data-original-text', originalText);
                element.innerHTML = customHtml || '<span class="spinner"></span> Loading...';
            } else {
                element.disabled = false;
                const original = element.getAttribute('data-original-text');
                if (original) element.innerHTML = original;
            }
        }
        
        /* ======================== FETCH FUNCTIONS ======================== */
        async function fetchWithBackgroundCache(url, cacheKey, ttl) {
            const cached = localStorage.getItem(cacheKey);
            let cachedData = null;
            
            if (cached) {
                try {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < ttl) {
                        cachedData = data;
                    }
                } catch (e) { }
            }
            
            if (cachedData && !preloadInProgress) {
                fetchFreshDataInBackground(url, cacheKey);
                return cachedData;
            }
            
            try {
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    localStorage.setItem(cacheKey, JSON.stringify({
                        data: result.data,
                        timestamp: Date.now()
                    }));
                    return result.data;
                }
                return [];
            } catch (err) {
                console.error("Fetch error:", err);
                return cachedData || [];
            }
        }
        
        async function fetchFreshDataInBackground(url, cacheKey) {
            preloadInProgress = true;
            try {
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                    localStorage.setItem(cacheKey, JSON.stringify({
                        data: result.data,
                        timestamp: Date.now()
                    }));
                    
                    if (cacheKey === CACHE_KEY && result.data.length !== allExpenses.length) {
                        allExpenses = result.data;
                        renderTablePage1(dom.searchInput?.value || "");
                    }
                    if (cacheKey === DRIVER_INFO_CACHE_KEY) {
                        updateDriverOptionsFromData(result.data);
                    }
                }
            } catch (err) {
                console.warn("Background fetch failed:", err);
            } finally {
                preloadInProgress = false;
            }
        }
        
        async function loadExpensesFast() {
            const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`;
            const data = await fetchWithBackgroundCache(url, CACHE_KEY, CACHE_TTL);
            allExpenses = data;
            return allExpenses;
        }
        
        async function loadDriverInfoFast() {
            const url = `${SCRIPT_URL}?spreadsheetId=${DRIVER_INFO_SPREADSHEET_ID}&sheetName=${DRIVER_INFO_SHEET}&_=${Date.now()}`;
            const data = await fetchWithBackgroundCache(url, DRIVER_INFO_CACHE_KEY, CACHE_TTL);
            driverInfoData = data;
            updateDriverOptionsFromData(data);
            return { driverNameOptions, vehicleNoOptions };
        }
        
        function updateDriverOptionsFromData(data) {
            const drivers = new Set();
            const vehicles = new Set();
            data.forEach(row => {
                if (row["Driver Name"] && row["Driver Name"].trim()) drivers.add(row["Driver Name"].trim());
                if (row["Vehicle No"] && row["Vehicle No"].trim()) vehicles.add(row["Vehicle No"].trim());
            });
            driverNameOptions = Array.from(drivers);
            vehicleNoOptions = Array.from(vehicles);
        }
        
        /* ======================== DRIVER INFO SHEET OPERATIONS ======================== */
        async function fetchExistingDriverInfo(forceRefresh = false) {
            if (forceRefresh) localStorage.removeItem(DRIVER_INFO_CACHE_KEY);
            const url = `${SCRIPT_URL}?spreadsheetId=${DRIVER_INFO_SPREADSHEET_ID}&sheetName=${DRIVER_INFO_SHEET}&_=${Date.now()}`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                localStorage.setItem(DRIVER_INFO_CACHE_KEY, JSON.stringify({
                    data: result.data,
                    timestamp: Date.now()
                }));
                return result.data;
            }
            return [];
        }
        
        async function addRowToDriverInfoSheet(srNo, driverName, vehicleNo) {
            try {
                const params = new URLSearchParams();
                params.append("action", "insert");
                params.append("spreadsheetId", DRIVER_INFO_SPREADSHEET_ID);
                params.append("sheetName", DRIVER_INFO_SHEET);
                params.append("Sr. No", srNo.toString());
                params.append("Driver Name", driverName || "");
                params.append("Vehicle No", vehicleNo || "");

                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString()
                });
                const result = await response.json();
                return result.status === "success";
            } catch (err) {
                console.error("Add row error:", err);
                return false;
            }
        }
        
        async function updateDriverInfoRow(srNo, driverName, vehicleNo) {
            try {
                const rowIndex = parseInt(srNo) + 1;
                const params = new URLSearchParams();
                params.append("action", "update");
                params.append("spreadsheetId", DRIVER_INFO_SPREADSHEET_ID);
                params.append("sheetName", DRIVER_INFO_SHEET);
                params.append("rowIndex", rowIndex.toString());
                params.append("Sr. No", srNo.toString());
                params.append("Driver Name", driverName || "");
                params.append("Vehicle No", vehicleNo || "");

                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString()
                });
                const result = await response.json();
                return result.status === "success";
            } catch (err) {
                console.error("Update row error:", err);
                return false;
            }
        }
        
        async function smartSaveToDriverInfoSheet(driverNameVal, vehicleNoVal, existingData) {
            const addedItems = [];
            let dataModified = false;
            
            if ((!driverNameVal || driverNameVal.trim() === "") && (!vehicleNoVal || vehicleNoVal.trim() === "")) {
                return { addedItems, dataModified: false };
            }
            
            let currentData = JSON.parse(JSON.stringify(existingData));
            const normalizedDriver = driverNameVal ? driverNameVal.trim() : "";
            const normalizedVehicle = vehicleNoVal ? vehicleNoVal.trim() : "";
            
            const driverExists = normalizedDriver && currentData.some(row => row["Driver Name"] === normalizedDriver);
            const vehicleExists = normalizedVehicle && currentData.some(row => row["Vehicle No"] === normalizedVehicle);
            
            const pairExists = currentData.some(row => 
                row["Driver Name"] === normalizedDriver && row["Vehicle No"] === normalizedVehicle
            );
            
            if (pairExists) {
                return { addedItems, dataModified: false };
            }
            
            if (normalizedDriver && normalizedVehicle && !driverExists && !vehicleExists) {
                const emptyRowIndex = currentData.findIndex(row => 
                    (!row["Driver Name"] || row["Driver Name"] === "") && 
                    (!row["Vehicle No"] || row["Vehicle No"] === "")
                );
                
                if (emptyRowIndex !== -1) {
                    const srNo = currentData[emptyRowIndex]["Sr. No"];
                    const success = await updateDriverInfoRow(srNo, normalizedDriver, normalizedVehicle);
                    if (success) {
                        addedItems.push(`Added "${normalizedDriver}" + "${normalizedVehicle}" to existing row`);
                        currentData[emptyRowIndex]["Driver Name"] = normalizedDriver;
                        currentData[emptyRowIndex]["Vehicle No"] = normalizedVehicle;
                        dataModified = true;
                    }
                } else {
                    const maxSrNo = currentData.reduce((max, row) => Math.max(max, parseInt(row["Sr. No"]) || 0), 0);
                    const newSrNo = maxSrNo + 1;
                    const success = await addRowToDriverInfoSheet(newSrNo, normalizedDriver, normalizedVehicle);
                    if (success) {
                        addedItems.push(`Created new entry: "${normalizedDriver}" + "${normalizedVehicle}"`);
                        currentData.push({ "Sr. No": newSrNo.toString(), "Driver Name": normalizedDriver, "Vehicle No": normalizedVehicle });
                        dataModified = true;
                    }
                }
            }
            else if (normalizedDriver && !driverExists) {
                let targetRowIndex = -1;
                if (normalizedVehicle) {
                    targetRowIndex = currentData.findIndex(row => 
                        (!row["Driver Name"] || row["Driver Name"] === "") && 
                        row["Vehicle No"] === normalizedVehicle
                    );
                }
                if (targetRowIndex === -1) {
                    targetRowIndex = currentData.findIndex(row => 
                        (!row["Driver Name"] || row["Driver Name"] === "")
                    );
                }
                if (targetRowIndex !== -1) {
                    const srNo = currentData[targetRowIndex]["Sr. No"];
                    const existingVehicle = currentData[targetRowIndex]["Vehicle No"] || "";
                    const success = await updateDriverInfoRow(srNo, normalizedDriver, existingVehicle);
                    if (success) {
                        addedItems.push(`Added Driver "${normalizedDriver}" to existing row`);
                        currentData[targetRowIndex]["Driver Name"] = normalizedDriver;
                        dataModified = true;
                    }
                } else {
                    const maxSrNo = currentData.reduce((max, row) => Math.max(max, parseInt(row["Sr. No"]) || 0), 0);
                    const newSrNo = maxSrNo + 1;
                    const success = await addRowToDriverInfoSheet(newSrNo, normalizedDriver, "");
                    if (success) {
                        addedItems.push(`Created new Driver entry: "${normalizedDriver}"`);
                        currentData.push({ "Sr. No": newSrNo.toString(), "Driver Name": normalizedDriver, "Vehicle No": "" });
                        dataModified = true;
                    }
                }
            }
            else if (normalizedVehicle && !vehicleExists) {
                let targetRowIndex = -1;
                if (normalizedDriver) {
                    targetRowIndex = currentData.findIndex(row => 
                        row["Driver Name"] === normalizedDriver && 
                        (!row["Vehicle No"] || row["Vehicle No"] === "")
                    );
                }
                if (targetRowIndex === -1) {
                    targetRowIndex = currentData.findIndex(row => 
                        (!row["Vehicle No"] || row["Vehicle No"] === "")
                    );
                }
                if (targetRowIndex !== -1) {
                    const srNo = currentData[targetRowIndex]["Sr. No"];
                    const existingDriver = currentData[targetRowIndex]["Driver Name"] || "";
                    const success = await updateDriverInfoRow(srNo, existingDriver, normalizedVehicle);
                    if (success) {
                        addedItems.push(`Added Vehicle "${normalizedVehicle}" to existing row`);
                        currentData[targetRowIndex]["Vehicle No"] = normalizedVehicle;
                        dataModified = true;
                    }
                } else {
                    const maxSrNo = currentData.reduce((max, row) => Math.max(max, parseInt(row["Sr. No"]) || 0), 0);
                    const newSrNo = maxSrNo + 1;
                    const success = await addRowToDriverInfoSheet(newSrNo, "", normalizedVehicle);
                    if (success) {
                        addedItems.push(`Created new Vehicle entry: "${normalizedVehicle}"`);
                        currentData.push({ "Sr. No": newSrNo.toString(), "Driver Name": "", "Vehicle No": normalizedVehicle });
                        dataModified = true;
                    }
                }
            }
            
            if (dataModified) {
                localStorage.setItem(DRIVER_INFO_CACHE_KEY, JSON.stringify({
                    data: currentData,
                    timestamp: Date.now()
                }));
                updateDriverOptionsFromData(currentData);
            }
            return { addedItems, dataModified };
        }
        
        /* ======================== RENDER FUNCTIONS ======================== */
        function renderTablePage1(filter = "") {
            if (!dom.tableBody) return;
            const searchLower = filter.toLowerCase();
            
            const grouped = {};
            allExpenses.forEach(exp => {
                const key = `${exp["Driver Name"] || ''}|${exp["Vehicle No"] || ''}`;
                if (!grouped[key]) {
                    grouped[key] = {
                        driverName: exp["Driver Name"] || '',
                        vehicleNo: exp["Vehicle No"] || '',
                        totalAmount: 0,
                        expenses: []
                    };
                }
                grouped[key].totalAmount += parseFloat(exp["Amount"]) || 0;
                grouped[key].expenses.push(exp);
            });
            
            let groupedArray = Object.values(grouped);
            
            if (searchLower) {
                groupedArray = groupedArray.filter(g => 
                    g.driverName.toLowerCase().includes(searchLower) || 
                    g.vehicleNo.toLowerCase().includes(searchLower)
                );
            }
            
            if (!groupedArray.length) {
                dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">✨ No expenses found</td></tr>';
                return;
            }
            
            const fragment = document.createDocumentFragment();
            groupedArray.forEach((group, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${index + 1}</strong></td>
                    <td>${escapeHtml(group.driverName)}</td>
                    <td>${escapeHtml(group.vehicleNo)}</td>
                    <td><span class="total-badge">₹ ${group.totalAmount.toLocaleString()}</span></td>
                    <td><button class="view-action-btn" data-driver="${escapeHtml(group.driverName)}" data-vehicle="${escapeHtml(group.vehicleNo)}">👁️ View</button></td>
                `;
                fragment.appendChild(row);
            });
            dom.tableBody.innerHTML = '';
            dom.tableBody.appendChild(fragment);
            
            dom.tableBody.querySelectorAll('.view-action-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const driver = btn.getAttribute('data-driver');
                    const vehicle = btn.getAttribute('data-vehicle');
                    const found = allExpenses.filter(exp => 
                        exp["Driver Name"] === driver && exp["Vehicle No"] === vehicle
                    );
                    if (found.length > 0) {
                        currentViewExpense = found;
                        currentViewDriver = driver;
                        currentViewVehicle = vehicle;
                        showPage2(found, driver, vehicle);
                    }
                });
            });
        }
        
        /* ======================== SHOW PAGE 2 WITH ENHANCED TABLE ======================== */
        function showPage2(expenses, driverName, vehicleNo) {
            if (!dom.detailsContainer) return;
            
            const sortedExpenses = [...expenses].sort((a, b) => {
                const dateA = a["Date"] ? new Date(a["Date"]) : new Date(0);
                const dateB = b["Date"] ? new Date(b["Date"]) : new Date(0);
                return dateB - dateA;
            });
            
            const totalAmount = sortedExpenses.reduce((sum, exp) => sum + (parseFloat(exp["Amount"]) || 0), 0);
            
            let html = `
                <div class="details-header">
                    <h3>${escapeHtml(driverName)}</h3>
                    <p>🚗 Vehicle: ${escapeHtml(vehicleNo)}</p>
                </div>
                
                <div class="details-table-wrapper">
                    <table class="details-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Reason</th>
                                <th>Note</th>
                                <th style="min-width: 140px;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            sortedExpenses.forEach((exp, index) => {
                const displayDate = formatDisplayDate(exp["Date"]);
                const srNo = exp["Sr. No"];
                html += `
                    <tr>
                        <td>${escapeHtml(displayDate)}</td>
                        <td><strong>₹ ${(parseFloat(exp["Amount"]) || 0).toLocaleString()}</strong></td>
                        <td>${escapeHtml(exp["Reason"] || '—')}</td>
                        <td>${escapeHtml(exp["Note"] || '—')}</td>
                        <td>
                            <div class="details-action-btns">
                                <button class="btn btn-edit-small btn-xs" data-sr="${escapeHtml(srNo)}" data-index="${index}">
                                    ✏️ Edit
                                </button>
                                <button class="btn btn-delete-small btn-xs" data-sr="${escapeHtml(srNo)}" data-index="${index}">
                                    🗑 Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
                
                <div class="total-amount-box">
                    <span>Total Amount</span>
                    <span class="amount">₹ ${totalAmount.toLocaleString()}</span>
                </div>
            `;
            
            dom.detailsContainer.innerHTML = html;
            
            // Attach event listeners for Edit buttons
            dom.detailsContainer.querySelectorAll('.btn-edit-small').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const sr = btn.getAttribute('data-sr');
                    const expense = allExpenses.find(exp => String(exp["Sr. No"]) === String(sr));
                    if (expense) {
                        openEditSingleModal(expense);
                    }
                });
            });
            
            // Attach event listeners for Delete buttons
            dom.detailsContainer.querySelectorAll('.btn-delete-small').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const sr = btn.getAttribute('data-sr');
                    const expense = allExpenses.find(exp => String(exp["Sr. No"]) === String(sr));
                    if (expense) {
                        deleteSingleExpense(expense);
                    }
                });
            });
            
            dom.page1?.classList.remove('active-page');
            dom.page2?.classList.add('active-page');
        }
        
        function goToPage1() {
            dom.page2?.classList.remove('active-page');
            dom.page1?.classList.add('active-page');
            refreshInBackground();
        }
        
        async function refreshInBackground() {
            const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.status === "success" && Array.isArray(result.data)) {
                allExpenses = result.data;
                localStorage.setItem(CACHE_KEY, JSON.stringify({ data: result.data, timestamp: Date.now() }));
                renderTablePage1(dom.searchInput?.value || "");
            }
        }
        
        async function refreshAllData() {
            if (dom.refreshBtn) showSpinner(dom.refreshBtn, true);
            try {
                localStorage.removeItem(CACHE_KEY);
                localStorage.removeItem(DRIVER_INFO_CACHE_KEY);
                allExpenses = await loadExpensesFast();
                await loadDriverInfoFast();
                renderTablePage1(dom.searchInput?.value || "");
            } catch (err) {
                console.error("Refresh error:", err);
            } finally {
                if (dom.refreshBtn) showSpinner(dom.refreshBtn, false);
            }
        }
        
        /* ======================== FIND ROW INDEX ======================== */
        function findRowIndexBySrNo(sr) {
            const idx = allExpenses.findIndex(t => String(t["Sr. No"]) === String(sr));
            return idx !== -1 ? idx + 2 : null;
        }
        
        /* ======================== DELETE SINGLE EXPENSE ======================== */
        async function deleteSingleExpense(expense) {
            const sr = expense["Sr. No"];
            const driverName = expense["Driver Name"] || "Unknown";
            const amount = expense["Amount"] || 0;
            
            showModal(
                `⚠️ Delete this expense?<br><br>📌 Driver: ${escapeHtml(driverName)}<br>💰 Amount: ₹ ${parseFloat(amount).toLocaleString()}<br>📅 Date: ${formatDisplayDate(expense["Date"])}`,
                "Confirm Delete",
                true,
                async () => {
                    const rowIdx = findRowIndexBySrNo(sr);
                    if (!rowIdx) {
                        showModal("Row error", "Error");
                        return;
                    }
                    
                    try {
                        const params = new URLSearchParams();
                        params.append("action", "delete");
                        params.append("spreadsheetId", SPREADSHEET_ID);
                        params.append("sheetName", SHEET_NAME);
                        params.append("rowIndex", rowIdx);
                        
                        const response = await fetch(SCRIPT_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/x-www-form-urlencoded" },
                            body: params
                        });
                        const result = await response.json();
                        
                        if (result.status === "success") {
                            showModal("✅ Expense deleted successfully!", "Success", false, null, 1200);
                            await refreshAllData();
                            
                            // Update current view
                            const updatedExpenses = allExpenses.filter(exp => 
                                exp["Driver Name"] === currentViewDriver && 
                                exp["Vehicle No"] === currentViewVehicle
                            );
                            if (updatedExpenses.length > 0) {
                                currentViewExpense = updatedExpenses;
                                showPage2(updatedExpenses, currentViewDriver, currentViewVehicle);
                            } else {
                                goToPage1();
                            }
                        } else {
                            showModal("Delete failed", "Error");
                        }
                    } catch (err) {
                        showModal("Error: " + err.message, "Error");
                    }
                }
            );
        }
        
        /* ======================== EDIT SINGLE EXPENSE ======================== */
        function openEditSingleModal(expense) {
            if (!dom.formModalBody) return;
            
            dom.formModalBody.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="spinner"></div><p style="margin-top: 12px;">Loading edit form...</p></div>';
            dom.formModal.classList.add('active');
            dom.formModalTitle.innerHTML = "✏️ Edit Expense";
            
            dom.formModalBody.innerHTML = buildEditFormHtml(expense);
            setTimeout(() => {
                setupAutocomplete('editDriverName', 'driverAutoList', driverNameOptions);
                setupAutocomplete('editVehicleNo', 'vehicleAutoList', vehicleNoOptions);
                attachEditFormEvents(expense);
            }, 20);
        }
        
        function buildEditFormHtml(expense) {

            return `
                <form id="dynamicExpenseForm">
                    <div class="form-grid">

                            <input type="date" id="editDate" value="${dateValue}" required>
                        </div>
                        <div class="field autocomplete-wrap">
                            <label>Driver Name *</label>
                            <input type="text" id="editDriverName" value="${escapeHtml(expense["Driver Name"] || '')}" autocomplete="off" required>
                            <div id="driverAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field autocomplete-wrap">
                            <label>Vehicle No *</label>
                            <input type="text" id="editVehicleNo" value="${escapeHtml(expense["Vehicle No"] || '')}" autocomplete="off" class="vehicle-input" required>
                            <div id="vehicleAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field">
                            <label>Reason</label>
                            <textarea id="editReason" rows="2">${escapeHtml(expense["Reason"] || '')}</textarea>
                        </div>

                            <label>Amount *</label>
                            <input type="number" step="0.01" id="editAmount" value="${escapeHtml(expense["Amount"] || '0')}" required>

                            <textarea id="editNote" rows="2">${escapeHtml(expense["Note"] || '')}</textarea>
