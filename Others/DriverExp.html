                    </div>
                    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1.5rem;">
                        <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                        <button type="submit" id="saveUpdateBtn" class="btn btn-primary">💾 Update Expense</button>
                    </div>
                </form>
            `;
        }
        
        function attachEditFormEvents(expense) {
            const form = document.getElementById('dynamicExpenseForm');
            if (form) {
                form.onsubmit = (e) => {
                    handleEditSubmit(e, expense);
                };
            }
            
            document.getElementById('cancelFormBtn')?.addEventListener('click', () => dom.formModal?.classList.remove('active'));
            
            const vehicleInput = document.getElementById('editVehicleNo');
            if (vehicleInput) {
                vehicleInput.addEventListener('input', function() {
                    this.value = this.value.toUpperCase();
                });
                
                vehicleInput.addEventListener('keypress', function(e) {
                    const char = String.fromCharCode(e.which);
                    if (!/[a-zA-Z0-9 ]/.test(char)) {
                        e.preventDefault();
                    }
                });
            }
        }
        
        /* ======================== EDIT FORM SUBMIT HANDLER ======================== */
        async function handleEditSubmit(e, expense) {
            e.preventDefault();
            
            if (saveInProgress) {
                console.log('Save already in progress');
                return;
            }
            saveInProgress = true;
            
            const dateInput = document.getElementById('editDate');
            const saveBtn = document.getElementById('saveUpdateBtn');
            showSpinner(saveBtn, true);
            
            const dateValue = dateInput?.value || "";
            const driverName = document.getElementById('editDriverName')?.value || "";
            const vehicleNo = document.getElementById('editVehicleNo')?.value || "";
            const reason = document.getElementById('editReason')?.value || "";
            const amount = document.getElementById('editAmount')?.value || "0";
            const note = document.getElementById('editNote')?.value || "";
            
            // Validate
            if (!dateValue) {
                showModal('❌ Date is required.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                showModal('❌ Invalid Date format.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!driverName.trim()) {
                showModal('❌ Driver Name is required.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!vehicleNo.trim()) {
                showModal('❌ Vehicle No is required.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!amount || parseFloat(amount) <= 0) {
                showModal('❌ Amount is required and must be greater than 0.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            const rowIdx = findRowIndexBySrNo(expense["Sr. No"]);
            if (!rowIdx) {
                showModal("Row error", "Error");
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            const params = new URLSearchParams();
            params.append("action", "update");
            params.append("spreadsheetId", SPREADSHEET_ID);
            params.append("sheetName", SHEET_NAME);
            params.append("rowIndex", rowIdx);
            params.append("Date", dateValue);
            params.append("Driver Name", driverName.trim());
            params.append("Vehicle No", vehicleNo.trim().toUpperCase());
            params.append("Reason", reason);
            params.append("Amount", amount);
            params.append("Note", note);
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString(),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const result = await response.json();
                
                if (result.status === "success") {
                    showModal("✅ Expense updated successfully!", "Success", false, null, 1500);
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                    dom.formModal?.classList.remove('active');
                    await refreshAllData();
                    
                    // Refresh the detail view
                    const updatedExpenses = allExpenses.filter(exp => 
                        exp["Driver Name"] === currentViewDriver && 
                        exp["Vehicle No"] === currentViewVehicle
                    );
                    if (updatedExpenses.length > 0) {
                        currentViewExpense = updatedExpenses;
                        showPage2(updatedExpenses, currentViewDriver, currentViewVehicle);
                    } else {
                        goToPage1();
                    }
                } else { 
                    showModal("❌ Error: " + (result.message || "Unknown error"), "Error"); 
                }
            } catch (err) {
                console.error('Save error:', err);
                if (err.name === 'AbortError') {
                    showModal("❌ Request timeout. Please check your internet connection.", "Error");
                } else {
                    showModal("❌ Error: " + err.message, "Error");
                }
            } finally { 
                saveInProgress = false;
                showSpinner(saveBtn, false);
            }
        }
        
        /* ======================== ADD NEW EXPENSE ======================== */
        function buildFormHtml(trip = null, isEdit = false) {
            const def = {
                "Date": "",
                "Driver Name": "",
                "Vehicle No": "",
                "Reason": "",
                "Amount": "",
                "Note": ""
            };
            
            let driverName = "";
            let vehicleNo = "";
            
            if (trip && trip.length > 0) {
                const firstExp = trip[0];
                driverName = firstExp["Driver Name"] || "";
                vehicleNo = firstExp["Vehicle No"] || "";
            }
            
            const dateValue = def["Date"] ? formatToYYYYMMDD(def["Date"]) : "";
            
            return `
                <form id="dynamicExpenseForm">
                    <div class="form-grid">
                        <div class="field">
                            <label>Date *</label>
                            <input type="date" id="editDate" value="${dateValue}" required>
                        </div>
                        <div class="field autocomplete-wrap">
                            <label>Driver Name *</label>
                            <input type="text" id="editDriverName" value="${escapeHtml(driverName)}" autocomplete="off" required>
                            <div id="driverAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field autocomplete-wrap">
                            <label>Vehicle No *</label>
                            <input type="text" id="editVehicleNo" value="${escapeHtml(vehicleNo)}" autocomplete="off" class="vehicle-input" required>
                            <div id="vehicleAutoList" class="autocomplete-list"></div>
                        </div>
                        <div class="field">
                            <label>Reason</label>
                            <textarea id="editReason" rows="2">${escapeHtml(def["Reason"])}</textarea>
                        </div>
                        <div class="field">
                            <label>Amount *</label>
                            <input type="number" step="0.01" id="editAmount" value="${escapeHtml(def["Amount"])}" required>
                        </div>
                        <div class="field fullwidth">
                            <label>Note</label>
                            <textarea id="editNote" rows="2">${escapeHtml(def["Note"])}</textarea>
                        </div>
                    </div>
                    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1.5rem;">
                        <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                        <button type="submit" id="saveUpdateBtn" class="btn btn-primary">💾 Save Expense</button>
                    </div>
                </form>
            `;
        }
        
        function setupAutocomplete(inputId, listId, optionsArray) {
            const input = document.getElementById(inputId);
            const listEl = document.getElementById(listId);
            if (!input || !listEl) return;
            
            function showOptions(filterVal = '') {
                const term = filterVal.toLowerCase();
                const filtered = optionsArray.filter(opt => opt.toLowerCase().includes(term));
                if (filtered.length > 0) {
                    listEl.innerHTML = filtered.map(opt => `<div class="autocomplete-item" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`).join('');
                    listEl.style.display = 'block';
                    listEl.querySelectorAll('.autocomplete-item').forEach(item => {
                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            input.value = item.getAttribute('data-value');
                            listEl.style.display = 'none';
                            input.dispatchEvent(new Event('input', { bubbles: true }));
                        });
                    });
                } else {
                    listEl.style.display = 'none';
                }
            }
            
            input.addEventListener('input', (e) => showOptions(e.target.value));
            input.addEventListener('focus', () => showOptions(input.value));
            input.addEventListener('blur', () => setTimeout(() => listEl.style.display = 'none', 200));
            document.addEventListener('click', (e) => {
                if (!listEl.contains(e.target) && e.target !== input) listEl.style.display = 'none';
            });
        }
        
        function attachFormEvents(isEdit, rowIdx) {
            const form = document.getElementById('dynamicExpenseForm');
            if (form) {
                form.onsubmit = (e) => {
                    handleAddSubmit(e);
                };
            }
            
            document.getElementById('cancelFormBtn')?.addEventListener('click', () => dom.formModal?.classList.remove('active'));
            
            const vehicleInput = document.getElementById('editVehicleNo');
            if (vehicleInput) {
                vehicleInput.addEventListener('input', function() {
                    this.value = this.value.toUpperCase();
                });
                
                vehicleInput.addEventListener('keypress', function(e) {
                    const char = String.fromCharCode(e.which);
                    if (!/[a-zA-Z0-9 ]/.test(char)) {
                        e.preventDefault();
                    }
                });
            }
        }
        
        async function handleAddSubmit(e) {
            e.preventDefault();
            
            if (saveInProgress) {
                return;
            }
            saveInProgress = true;
            
            const dateInput = document.getElementById('editDate');
            const saveBtn = document.getElementById('saveUpdateBtn');
            showSpinner(saveBtn, true);
            
            const dateValue = dateInput?.value || "";
            const driverName = document.getElementById('editDriverName')?.value || "";
            const vehicleNo = document.getElementById('editVehicleNo')?.value || "";
            const reason = document.getElementById('editReason')?.value || "";
            const amount = document.getElementById('editAmount')?.value || "0";
            const note = document.getElementById('editNote')?.value || "";
            
            if (!dateValue) {
                showModal('❌ Date is required.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                showModal('❌ Invalid Date format.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!driverName.trim()) {
                showModal('❌ Driver Name is required.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!vehicleNo.trim()) {
                showModal('❌ Vehicle No is required.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            if (!amount || parseFloat(amount) <= 0) {
                showModal('❌ Amount is required and must be greater than 0.', 'Validation Error');
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
            
            const params = new URLSearchParams();
            params.append("action", "insert");
            params.append("spreadsheetId", SPREADSHEET_ID);
            params.append("sheetName", SHEET_NAME);
            params.append("Date", dateValue);
            params.append("Driver Name", driverName.trim());
            params.append("Vehicle No", vehicleNo.trim().toUpperCase());
            params.append("Reason", reason);
            params.append("Amount", amount);
            params.append("Note", note);
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString(),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const result = await response.json();
                
                if (result.status === "success") {
                    let driverInfoMsg = "";
                    
                    try {
                        const existingData = await fetchExistingDriverInfo(true);
                        const driverResult = await smartSaveToDriverInfoSheet(
                            driverName.trim(), 
                            vehicleNo.trim().toUpperCase(), 
                            existingData
                        );
                        if (driverResult.addedItems.length > 0) {
                            driverInfoMsg = `<br><br>📌 ${driverResult.addedItems.join('<br>')}`;
                        }
                        await loadDriverInfoFast();
                    } catch (err) { 
                        console.error('Driver Info save error:', err);
                        driverInfoMsg = `<br><br>⚠️ Note: Expense saved, but Driver Info sheet update failed.`; 
                    }
                    
                    showModal(`✅ Expense saved successfully!${driverInfoMsg}`, "Success", false, null, 2000);
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                    dom.formModal?.classList.remove('active');
                    await refreshAllData();
                    goToPage1();
                } else { 
                    showModal("❌ Error: " + (result.message || "Unknown error"), "Error"); 
                }
            } catch (err) {
                console.error('Save error:', err);
                if (err.name === 'AbortError') {
                    showModal("❌ Request timeout. Please check your internet connection.", "Error");
                } else {
                    showModal("❌ Error: " + err.message, "Error");
                }
            } finally { 
                saveInProgress = false;
                showSpinner(saveBtn, false);
            }
        }
        
        async function openAddModal() {
            if (!dom.formModalBody) return;
            dom.formModalBody.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="spinner"></div><p style="margin-top: 12px;">Loading form...</p></div>';
            dom.formModal.classList.add('active');
            dom.formModalTitle.innerHTML = "➕ Add New Expense";
            dom.formModalBody.innerHTML = buildFormHtml(null, false);
            setTimeout(() => {
                setupAutocomplete('editDriverName', 'driverAutoList', driverNameOptions);
                setupAutocomplete('editVehicleNo', 'vehicleAutoList', vehicleNoOptions);
                attachFormEvents(false, null);
            }, 20);
        }
        
        /* ======================== INITIALIZATION ======================== */
        async function fastInit() {
            cacheDomElements();
            if (dom.tableBody) dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><div class="spinner"></div> Loading expenses...</td></tr>';
            
            const [expensesData] = await Promise.all([loadExpensesFast(), loadDriverInfoFast()]);
            renderTablePage1("");
            
            setTimeout(() => { refreshInBackground(); loadDriverInfoFast(); }, 3000);
            
            dom.refreshBtn?.addEventListener('click', async () => {
                if (dom.refreshBtn) showSpinner(dom.refreshBtn, true);
                try {
                    localStorage.removeItem(CACHE_KEY);
                    localStorage.removeItem(DRIVER_INFO_CACHE_KEY);
                    allExpenses = await loadExpensesFast();
                    await loadDriverInfoFast();
                    renderTablePage1(dom.searchInput?.value || "");
                } catch (err) {
                    showModal("❌ Refresh failed: " + err.message, "Error");
                } finally {
                    if (dom.refreshBtn) showSpinner(dom.refreshBtn, false);
                }
            });
            
            dom.mobileRefreshBtn?.addEventListener('click', () => dom.refreshBtn?.click());
            dom.addNewBtn?.addEventListener('click', openAddModal);
            dom.mobileAddBtn?.addEventListener('click', () => dom.addNewBtn?.click());
            dom.backBtn?.addEventListener('click', goToPage1);
            
            dom.searchInput?.addEventListener('input', (e) => {
                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => renderTablePage1(e.target.value), 300);
            });
            
            document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal?.classList.remove('active'));
            document.getElementById('closeFormModalBtn')?.addEventListener('click', () => dom.formModal?.classList.remove('active'));
            
            window.onclick = (e) => {
                if (e.target.classList?.contains('modal-overlay')) e.target.classList.remove('active');
            };
        }
        
        fastInit();
    </script>
